      ${D.entries.length ? `<div class="mini-list">${D.entries.map(e => `<button class="mi ${A.ui.sel === e.id ? 'sel' : ''}" data-action="selEntry" data-id="${esc(e.id)}" style="--c:${h.colorOf(S, e)}">
        <i class="dot" style="background:${h.colorOf(S, e)}"></i><span class="mt">${esc(h.titleOf(S, e))}</span><span class="muted small">${e.kind === 'study' ? h.partsLabel(e) : h.kindLabel(e)}</span>
        <span class="mm">${e.pieces.length ? P.t12(e.pieces[0][0]) + ' · ' : ''}${h.fmtMin(e.min)}</span></button>`).join('')}</div>` : ''}
      ${D.dropped.length ? `<div class="hint">상한·시간 부족으로 빠진 복습/예습 ${D.dropped.length}개</div>` : ''}
      <div class="hint">${idx === 0 ? '체크·타이머는 오늘 탭에서 해요. 여기서도 끌어서 시간을 바꿀 수 있어요.' : '블록을 끌어 시간을 옮기고, 아래쪽 끝을 끌어 길이를 바꿔요.'}</div>
      <div class="tlwrap">${h.timeline(S, D, { editable: true })}</div></div>`;
  }

  A.views.plan = function (S, PLAN) {
    const today = PLAN.today;
    const ym = A.ui.calMonth || today.slice(0, 7);
    const sel = A.ui.calSel || today;
    const [y, m] = ym.split('-').map(Number);
    const days = cellsOf(ym);
    const al = h.alerts(S, PLAN);
    return `<div class="split cal-split"><section class="cal">
      <div class="calhead"><h1>${y}년 ${m}월</h1><div class="calnav">
        <button class="btn" data-action="calnav" data-d="-1">◀</button><button class="btn" data-action="caltoday">오늘</button><button class="btn" data-action="calnav" data-d="1">▶</button></div></div>
      ${al.urgent}
      ${h.allocTray ? h.allocTray(S) : ''}
      <div class="calgrid"><div class="dow sun">일</div><div class="dow">월</div><div class="dow">화</div><div class="dow">수</div><div class="dow">목</div><div class="dow">금</div><div class="dow sat">토</div>
        ${days.map(d => cell(S, PLAN, d, ym, sel)).join('')}</div>
      <div class="legend"><span><i class="k-rev"></i>공부</span><span><i class="k-task"></i>대회·과제</span><span class="muted">날짜를 누르면 그날의 시간표 · 시험 대비·과제·일정·시험일 라벨은 끌어서 다른 날로 옮길 수 있어요</span></div>
    </section><aside class="pane-r">${detail(S, PLAN, sel)}</aside></div>`;
  };

  // ---------- 액션 ----------
  const Ac = A.actions;
  Ac.calnav = el => { A.ui.calMonth = shiftMonth(A.ui.calMonth || P.today().slice(0, 7), +el.dataset.d); A.render(); };
  Ac.caltoday = () => { A.ui.calMonth = P.today().slice(0, 7); A.ui.calSel = P.today(); A.render(); };
  Ac.calsel = el => {
    A.ui.calSel = el.dataset.date;
    if (el.dataset.date.slice(0, 7) !== (A.ui.calMonth || P.today().slice(0, 7))) A.ui.calMonth = el.dataset.date.slice(0, 7);
    A.render();
    if (window.innerWidth < 980) { const d = document.getElementById('daydetail'); if (d) d.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  };
  Ac.selEntry = el => { A.ui.sel = el.dataset.id; A.render(); };
  A.onShow.plan = () => { if (!A.ui.calSel) A.ui.calSel = P.today(); if (!A.ui.calMonth) A.ui.calMonth = P.today().slice(0, 7); };

  // ---------- 캘린더에서 끌어서 다른 날로 옮기기 ----------
  // 값 형식: '종류|원래 날짜|id'  (종류: cu 내 일정 · exam 시험일 · job 시험 대비/과제의 그날 몫)
  A.moveToDate = function (v, target) {
    const S = A.S, PLAN = A.PLAN, today = PLAN.today;
    const type = v.slice(0, v.indexOf('|')), rest = v.slice(type.length + 1), src = rest.slice(0, 10), id = rest.slice(11);
    if (target < today) { A.toast('지난 날짜로는 옮길 수 없어요', true); return; }
    if (target === src) return;
    if (type === 'alloc') { const [aid, iid] = id.split(':'); if (A.assignUnit(aid, iid, target)) A.toast(`${h.md(target)}에 배정했어요`); return; }   // 배정 대기 칩
    if (type === 'cu') {
      const c = S.custom.find(x => x.id === id.slice(3));
      if (!c) return;
      c.date = target; if (c.alloc) c.start = null;       // 할당은 날짜를 옮기면 시각을 비워 그날 빈 시간에 자동 배치
      A.save(); A.render(); A.toast(`${h.md(target)}로 옮겼어요`);
      return;
    }
    if (type === 'exam') {
      const e = S.exams.find(x => x.id === id);
      if (!e) return;
      e.date = target; A.save(); A.render(); A.toast(`시험일을 ${h.md(target)}로 바꿨어요`);
      return;
    }
    if (type === 'job') {
      const sD = PLAN.days[P.diffDays(today, src)], tD = PLAN.days[P.diffDays(today, target)];
      const ent = sD && sD.entries.find(x => x.id === id);
      if (!ent) return;
      const moves = ent.kind === 'task' ? [{ job: ent.job, amt: ent.min }] : ent.parts.filter(p => p.job).map(p => ({ job: p.job, amt: p.min }));
      for (const m of moves) {
        if (target > m.job.deadline) { A.toast(`${m.job.title}은(는) ${h.md(m.job.deadline)}까지만 할 수 있어요`, true); return; }
        if (target < m.job.release) { A.toast(`${m.job.title}은(는) ${h.md(m.job.release)}부터 할 수 있어요`, true); return; }
      }
      S.manual[src] = S.manual[src] || {}; S.manual[target] = S.manual[target] || {};
      for (const m of moves) {
        const existing = tD ? ((tD.work.find(w => w.job.id === m.job.id) || {}).min || 0) : 0;
        S.manual[src][m.job.id] = { skip: true };
        S.manual[target][m.job.id] = { dur: existing + m.amt };
      }
      A.save(); A.render(); A.toast(`${h.md(target)}로 옮겼어요 (되돌리려면 그 날짜의 ‘자동 배치로 되돌리기’)`);
    }
  };

  let dragVal = null, dragY = -1, scrollTimer = null;
  // 끄는 동안 마우스가 화면 위·아래 가장자리에 가면 달력이 저절로 스크롤된다 (멀리 있는 날짜로 끌어다 놓기 쉽게)
  const stopAutoScroll = () => { clearInterval(scrollTimer); scrollTimer = null; dragY = -1; };
  const startAutoScroll = () => {
    stopAutoScroll();
    scrollTimer = setInterval(() => {
      if (dragY < 0) return;
      const H = window.innerHeight, top = 70, bot = H - 100;
      if (dragY < top) window.scrollBy(0, -Math.round(6 + (top - dragY) * 0.45));
      else if (dragY > bot) window.scrollBy(0, Math.round(6 + (dragY - bot) * 0.45));
    }, 16);
  };
  document.addEventListener('dragstart', ev => {
    const el = ev.target.closest && ev.target.closest('[data-drag]');
    if (!el) return;
    if (A.RO) { ev.preventDefault(); return; }                                    // 보기 전용: 끌어 옮기기 없음
    dragVal = el.dataset.drag;
    startAutoScroll();
    ev.dataTransfer.setData('text/plain', dragVal);
    ev.dataTransfer.effectAllowed = 'move';
    el.classList.add('dragging');
  });
  document.addEventListener('dragend', () => {
    dragVal = null; stopAutoScroll();
    document.querySelectorAll('.dragging, .dropok').forEach(x => x.classList.remove('dragging', 'dropok'));
  });
  document.addEventListener('dragover', ev => {
    if (dragVal) dragY = ev.clientY;
    const tray = ev.target.closest && ev.target.closest('.alloc-tray');
    if (tray && dragVal && dragVal.startsWith('cu|')) { ev.preventDefault(); ev.dataTransfer.dropEffect = 'move'; tray.classList.add('dropok'); return; }
    const c = ev.target.closest && ev.target.closest('.cell');
    if (!c || !dragVal) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.dropok').forEach(x => { if (x !== c) x.classList.remove('dropok'); });
    c.classList.add('dropok');
  });
  document.addEventListener('drop', ev => {
    stopAutoScroll();
    const tray = ev.target.closest && ev.target.closest('.alloc-tray');
    if (tray && dragVal && dragVal.startsWith('cu|')) {
      ev.preventDefault();
      const v = dragVal; dragVal = null;
      document.querySelectorAll('.dragging, .dropok').forEach(x => x.classList.remove('dragging', 'dropok'));
      A.unassignDrag(v);
      return;
    }
    const c = ev.target.closest && ev.target.closest('.cell');
    if (!c || !dragVal) return;
    ev.preventDefault();
    const v = dragVal;
    dragVal = null;
    document.querySelectorAll('.dragging, .dropok').forEach(x => x.classList.remove('dragging', 'dropok'));
    A.moveToDate(v, c.dataset.date);
  });
})();

</script>
<script>
/* v_home.js — 홈 탭: 앞으로 남은 일정을 D-day 로 한눈에 + 오늘 요약.
   중요 할 일(S.important)의 입력 상자·체크·삭제도 여기서 맡는다 (입력 상자는 계획 탭의 날짜 패널에 들어간다). */
(function () {
  'use strict';
  const A = window.App, P = window.Planner, h = A.h, esc = h.esc;
  const KIND = { imp: '중요 할 일', task: '마감 · 대회', exam: '시험', etc: '일정' };
  const FILTERS = [['all', '전체'], ['imp', '중요'], ['task', '마감'], ['exam', '시험'], ['etc', '일정']];

  // ---------- 계획 탭 날짜 패널에 들어가는 ‘중요 할 일’ 상자 ----------
  h.impBox = (S, date) => {
    const items = S.important.filter(x => x.date === date);
    return `<section class="impbox"><h3>중요 할 일 <small>홈 화면에 D-day 로 나와요</small></h3>
      ${A.ui.evForm && A.ui.evForm.mode === 'edit' && A.ui.evForm.kind === 'imp' && items.some(x => x.id === A.ui.evForm.id) ? h.evForm() : ''}
      ${items.map(it => `<div class="imp-r ${it.done ? 'done' : ''}">
        <button type="button" class="ick ${it.done ? 'on' : ''}" data-action="impdone" data-id="${esc(it.id)}" title="${it.done ? '다시 안 끝낸 걸로' : '끝냈어요'}">${it.done ? '✓' : ''}</button>
        <span class="imp-t">${esc(it.title)}${h.schedText(S, 'imp:' + it.id, it.date)}</span>
        <button type="button" class="btn sm ghost" data-action="evedit" data-id="imp:${esc(it.id)}" title="고치기">✎</button>
        <button type="button" class="btn sm ghost" data-action="impdel" data-id="${esc(it.id)}" title="지우기">✕</button></div>`).join('')}
      <div class="imp-add"><input type="text" id="imp-title" data-enter="imp-add-btn" maxlength="80" placeholder="예: KSEF 초안 제출, SAT 접수"><button type="button" id="imp-add-btn" class="btn primary sm" data-action="impadd" data-date="${date}">추가</button></div>
    </section>`;
  };

  // ---------- 일정 추가·수정 폼 (홈 위쪽 / 계획 탭 중요 할 일 상자) ----------
  // A.ui.evForm = { mode: 'add'|'edit', kind: 'imp'|'deadline'|'etc'|'exam', id, title, date, end }
  //   imp → S.important 항목, 그 외 → S.milestones(달력 일정) 항목
  h.evForm = () => {
    const f = A.ui.evForm;
    if (!f) return '';
    const add = f.mode === 'add', range = f.kind !== 'imp' && f.kind !== 'deadline';
    return `<div class="addform evform">
      <div class="fl"><label class="wide">${add ? '새 일정' : '일정 고치기'}<input type="text" id="ev-title" data-enter="ev-save" maxlength="80" data-bind="ui.evForm.title" value="${esc(f.title)}" placeholder="예: KSEF 초안 제출, 동아리 발표"></label></div>
      ${add ? `<div class="fl">${h.seg('ui.evForm.kind', f.kind, [['imp', '중요 할 일'], ['deadline', '마감'], ['etc', '일정']])}</div>` : ''}
      <div class="fl"><label>날짜<input type="date" id="ev-date" data-bind="ui.evForm.date" value="${esc(f.date)}"></label>
        ${range ? `<label>끝나는 날 <small>(며칠이면)</small><input type="date" id="ev-end" data-bind="ui.evForm.end" value="${esc(f.end || '')}"></label>` : ''}</div>
      <div class="fl"><button type="button" class="btn primary" id="ev-save" data-action="evsave">${add ? '추가' : '저장'}</button><button type="button" class="btn ghost" data-action="evcancel">취소</button>${add ? '' : '<button type="button" class="btn ghost danger" data-action="evdel">삭제</button>'}</div></div>`;
  };

  // ---------- 홈 ----------
  const urgency = n => (n < 0 ? 'late' : n <= 3 ? 'hot' : n <= 7 ? 'soon' : '');

  function row(it, today) {
    const n = P.diffDays(today, it.date), inline = it.kind === 'imp' || it.id.startsWith('ms:'), isAl = it.id.startsWith('al:');   // 시험·과제는 시험·과제 탭에서 고친다
    const label = it.ongoing ? '진행 중' : h.dday(it.date, today);
    const sub = `${h.md(it.date)}${it.end ? ' ~ ' + h.md(it.end) : ''} · ${KIND[it.kind]}${it.unconfirmed ? ' · 날짜 미확정' : ''}${it.overdue ? ' · 지났어요' : ''}${it.ongoing ? ` · ${h.dday(it.end, today)} 종료` : ''}`;
    return `<div class="up ${it.kind} ${it.ongoing ? 'ing' : urgency(n)}" role="button" tabindex="0" data-action="upgo" data-id="${esc(it.id)}" style="${it.color ? `--c:${it.color}` : ''}">
      <span class="ud">${esc(label)}</span>
      <span class="ut"><b>${esc(it.title)}</b><small>${esc(sub)}</small>${/^(imp|task):/.test(it.id) ? h.schedText(A.S, it.id, it.date) : ''}</span>
      <span class="uact">
        <button type="button" class="btn sm ghost uedit" data-action="${inline ? 'evedit' : 'upgo'}" data-id="${esc(it.id)}" title="${inline ? '고치기' : isAl ? '할당 탭에서 고치기' : '시험·과제 탭에서 고치기'}">✎</button>
        ${isAl ? '' : `<button type="button" class="btn sm ghost uedit udel" data-action="updel" data-id="${esc(it.id)}" title="지우기">✕</button>`}
        ${it.kind === 'imp' ? `<button type="button" class="ick" data-action="impdone" data-id="${esc(it.impId)}" title="끝냈어요"></button>` : ''}
      </span>
    </div>`;
  }

  function todayPanel(S, PLAN) {
    const today = PLAN.today, D = PLAN.days[0], dt = P.parse(today);
    const planned = D.entries.filter(e => !(e.custom && e.custom.kind === 'event')).reduce((a, e) => a + e.min, 0);
    const next = D.entries.filter(e => e.pieces && e.pieces.length).slice().sort((a, b) => a.pieces[0][0] - b.pieces[0][0]);
    const ov = S.dayOverrides[today], ms = S.milestones.filter(m => m.date <= today && today <= (m.end || m.date));
    return `<div class="panel home-today">
      <div class="ph"><h2>오늘 · ${dt.getMonth() + 1}월 ${dt.getDate()}일 ${P.DOW[dt.getDay()]}요일</h2></div>
      ${ms.length || (ov && ov.off) ? `<div class="evl">${ms.map(m => `<span class="ev etc">${esc(m.title)}</span>`).join('')}${ov && ov.off ? `<span class="ev etc">쉬는 날${ov.note ? ' · ' + esc(ov.note) : ''}</span>` : ''}</div>` : ''}
      <div class="stats"><div><span>남은 계획</span><b>${h.fmtMin(planned)}</b></div><div><span>남은 가용</span><b>${h.fmtMin(D.raw)}</b></div><div><span>할 일</span><b>${D.entries.filter(e => !(e.custom && e.custom.kind === 'event')).length}개</b></div></div>
      ${next.length ? `<div class="mini-list">${next.slice(0, 5).map(e => `<div class="mi nx" style="--c:${h.colorOf(S, e)}"><i class="dot" style="background:${h.colorOf(S, e)}"></i><span class="mt">${esc(h.titleOf(S, e))}</span><span class="mm">${P.t12(e.pieces[0][0])} · ${h.fmtMin(e.min)}</span></div>`).join('')}${next.length > 5 ? `<div class="hint">외 ${next.length - 5}개</div>` : ''}</div>` : `<div class="hint">${D.raw === 0 ? '오늘은 남은 가용 시간이 없어요.' : '오늘 계획된 할 일이 없어요.'}</div>`}
      <div class="fl"><button class="btn primary" data-action="tab" data-tab="today">오늘 할 일 열기</button><button class="btn" data-action="tab" data-tab="plan">계획 보기</button></div>
    </div>`;
  }

  A.views.home = function (S, PLAN) {
    const today = PLAN.today, all = P.upcoming(S, today);
    const f = FILTERS.some(x => x[0] === A.ui.homeFilter) ? A.ui.homeFilter : 'all';
    const cnt = k => (k === 'all' ? all.length : all.filter(x => x.kind === k).length);
    const shown = f === 'all' ? all : all.filter(x => x.kind === f);
    const al = h.alerts(S, PLAN);
    const late = all.filter(x => x.overdue).length;
    return `<div class="split home-split"><section class="home-main">
      <header class="dayhead"><h1>다가오는 일정</h1><button class="btn primary" data-action="evnew">＋ 일정 추가</button></header>
      ${h.evForm()}
      ${al.urgent}
      ${late ? `<div class="note bad">끝내지 못한 중요 할 일이 ${late}개 있어요.</div>` : ''}
      <div class="home-filter">${h.seg('ui.homeFilter', f, FILTERS.map(([k, n]) => [k, `${n} ${cnt(k)}`]))}</div>
      <div class="uplist">${shown.length ? shown.map(it => row(it, today)).join('') : `<div class="empty">${all.length ? '이 종류의 일정은 없어요.' : '다가오는 일정이 없어요.'}<br><small>위의 ＋ 일정 추가로 적을 수 있어요.</small></div>`}</div>
      <div class="hint">줄을 누르면 해당 날짜·시험·과제로 이동하고, ✎로 그 자리에서 고쳐요 (시험·과제는 시험·과제 탭에서). 날짜별로 적으려면 <button class="link" data-action="tab" data-tab="plan">계획</button> 탭에서 날짜를 눌러요.</div>
    </section><aside class="pane-r">${h.giftHome ? h.giftHome() : ''}${todayPanel(S, PLAN)}${h.allocHome ? h.allocHome(S, PLAN.today) : ''}</aside></div>`;
  };

  // ---------- 액션 ----------
  const Ac = A.actions;
  const newId = () => 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const find = id => A.S.important.find(x => x.id === id);

  Ac.impadd = el => {
    const inp = document.getElementById('imp-title'), title = inp ? inp.value.trim() : '';
    if (!title) { A.toast('할 일을 적어 주세요', true); if (inp) inp.focus(); return; }
    A.S.important.push({ id: newId(), date: el.dataset.date, title, done: false });
    A.save(); A.render();
    const n = document.getElementById('imp-title'); if (n) n.focus();
  };
  Ac.impdone = el => {
    const it = find(el.dataset.id);
    if (!it) return;
    it.done = !it.done;
    A.save(); A.render();
    if (it.done) A.toast(`끝냈어요 · ${it.title}`, false, { fn: () => { it.done = false; A.save(); A.render(); } });
  };
  Ac.impdel = el => {
    const S = A.S, i = S.important.findIndex(x => x.id === el.dataset.id);
    if (i < 0) return;
    const it = S.important.splice(i, 1)[0];
    A.save(); A.render();
    A.toast(`지웠어요 · ${it.title}`, false, { fn: () => { S.important.splice(Math.min(i, S.important.length), 0, it); A.save(); A.render(); } });
  };
  // ---- 일정 추가·수정 ----
  const focusTitle = () => { const t = document.getElementById('ev-title'); if (t) { t.focus(); t.select(); } };
  Ac.evnew = () => {
    A.ui.evForm = { mode: 'add', kind: 'imp', id: null, title: '', date: P.today(), end: '' };
    A.render(); focusTitle();
  };
  // data-id: 'imp:<id>' | 'ms:<id>'
  Ac.evedit = el => {
    const S = A.S, key = el.dataset.id, isImp = key.startsWith('imp:'), id = key.slice(key.indexOf(':') + 1);
    const it = isImp ? find(id) : S.milestones.find(m => m.id === id);
    if (!it) return;
    A.ui.evForm = { mode: 'edit', kind: isImp ? 'imp' : (it.kind || 'etc'), id, title: it.title, date: it.date, end: it.end || '' };
    A.render(); focusTitle();
    const f = document.querySelector('.evform'); if (f) f.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  };
  Ac.evcancel = () => { A.ui.evForm = null; A.render(); };
  Ac.evsave = () => {
    const S = A.S, f = A.ui.evForm;
    if (!f) return;
    const title = h.val('ev-title').trim(), date = h.val('ev-date'), end = h.val('ev-end');
    if (!title) { A.toast('제목을 적어 주세요', true); focusTitle(); return; }
    if (!date) { A.toast('날짜를 골라 주세요', true); return; }
    if (end && end < date) { A.toast('끝나는 날이 시작 날짜보다 빠를 수 없어요', true); return; }
    const imp = f.kind === 'imp';
    if (f.mode === 'add') {
      if (imp) S.important.push({ id: newId(), date, title, done: false });
      else { const m = { id: 'm' + newId(), date, title, kind: f.kind }; if (end && f.kind === 'etc') m.end = end; S.milestones.push(m); }
    } else {
      const it = imp ? find(f.id) : S.milestones.find(m => m.id === f.id);
      if (!it) { A.ui.evForm = null; A.render(); return; }
      it.title = title; it.date = date;
      if (!imp) { if (end) it.end = end; else delete it.end; }
    }
    A.ui.evForm = null;
    A.save(); A.render();
    A.toast(f.mode === 'add' ? `추가했어요 · ${title}` : `고쳤어요 · ${title}`);
  };
  Ac.evdel = () => {
    const S = A.S, f = A.ui.evForm;
    if (!f || f.mode !== 'edit') return;
    const imp = f.kind === 'imp', list = imp ? S.important : S.milestones, i = list.findIndex(x => x.id === f.id);
    if (i < 0) return;
    const it = list.splice(i, 1)[0];
    A.ui.evForm = null;
    A.save(); A.render();
    A.toast(`지웠어요 · ${it.title}`, false, { fn: () => { list.splice(Math.min(i, list.length), 0, it); A.save(); A.render(); } });
  };
  // 홈 줄의 ✕: 중요 할 일·달력 일정은 바로, 시험·과제는 확인 후 지운다 (모두 되돌리기 가능). data-id: 'imp:' | 'ms:' | 'exam:' | 'task:'
  Ac.updel = el => {
    const S = A.S, key = el.dataset.id, kind = key.slice(0, key.indexOf(':')), id = key.slice(kind.length + 1);
    const list = { imp: S.important, ms: S.milestones, exam: S.exams, task: S.tasks }[kind];
    const i = list ? list.findIndex(x => x.id === id) : -1;
    if (i < 0) return;
    const it = list[i], name = kind === 'exam' ? `${(P.subj(S, it.sid) || {}).name || ''} 시험` : it.title;
    if ((kind === 'exam' || kind === 'task') && !window.confirm(`‘${name}’을(를) 지울까요? 시험·과제 계획에서도 빠져요.`)) return;
    list.splice(i, 1);
    if (A.ui.evForm && A.ui.evForm.id === id) A.ui.evForm = null;
    A.save(); A.render();
    A.toast(`지웠어요 · ${name}`, false, { fn: () => { list.splice(Math.min(i, list.length), 0, it); A.save(); A.render(); } });
  };
  // 홈의 줄을 누르면 그 일정이 있는 곳으로
  Ac.upgo = el => {
    const it = P.upcoming(A.S, P.today()).find(x => x.id === el.dataset.id);
    if (!it) return;
    if (it.kind === 'imp') { A.ui.calSel = it.date; A.ui.calMonth = it.date.slice(0, 7); A.setTab('plan'); }
    else if (it.id.startsWith('al:')) { A.ui.allocSel = it.id.slice(3); A.setTab('alloc'); }
    else { A.ui.workSel = it.id; A.setTab('work'); }
    window.scrollTo(0, 0);
  };
  document.addEventListener('keydown', ev => {
    const el = ev.target;
    if ((ev.key === 'Enter' || ev.key === ' ') && el.classList && el.classList.contains('up')) { ev.preventDefault(); el.click(); }
  });
})();

</script>
<script>
/* v_plan.js — 시험·과제 탭: 왼쪽 목록(시험 · 대회/과제 · 달력 일정)에서 하나를 고르면 오른쪽에서 정한다 */
(function () {
  'use strict';
  const A = window.App, P = window.Planner, h = A.h, esc = h.esc;
  const row = (label, desc, ctl) => `<div class="swrow"><span class="swt"><b>${label}</b>${desc ? `<small>${desc}</small>` : ''}</span>${ctl}</div>`;
  const subjOptions = (S, sel, withNone) =>
    (withNone ? `<option value="">없음</option>` : '') + S.subjects.map(s => `<option value="${esc(s.id)}" ${s.id === sel ? 'selected' : ''}>${esc(s.name)}</option>`).join('');

  // ---------- 왼쪽 목록 ----------
  function list(S, PLAN, k) {
    const today = PLAN.today;
    const exams = S.exams.map((e, i) => ({ e, i })).sort((a, b) => (a.e.date || '9').localeCompare(b.e.date || '9'));
    const tasks = S.tasks.map((t, i) => ({ t, i })).sort((a, b) => (+a.t.done - +b.t.done) || (a.t.due || '9').localeCompare(b.t.due || '9'));
    const ms = S.milestones.map((m, i) => ({ m, i })).sort((a, b) => a.m.date.localeCompare(b.m.date));
    const li = (key, dot, title, sub, pct, extra) => `<button class="navi li ${k === key ? 'on' : ''}" data-action="worksel" data-k="${esc(key)}">
      <i class="dot" style="background:${dot}"></i><span class="lt">${esc(title)}</span><small>${sub}</small>${extra || ''}${pct != null ? `<span class="mprog"><i style="width:${pct}%"></i></span>` : ''}</button>`;
    return `<div class="navgroup">시험</div>
      ${exams.map(({ e }) => {
    const sb = P.subj(S, e.sid); if (!sb) return '';
    const tot = P.examTotal(S, e), rem = P.examRemaining(S, e), pct = tot ? Math.round((tot - rem) / tot * 100) : 0;
    return li('exam:' + e.id, sb.color, sb.name, `${e.date ? h.md(e.date) + ' ' + h.dday(e.date, today) : '날짜 없음'}${e.confirmed ? '' : ' · 미확정'}`, pct);
  }).join('')}
      <button class="navi add ${k === 'newexam' ? 'on' : ''}" data-action="worksel" data-k="newexam">＋ 시험 추가</button>
      <div class="navgroup">대회 · 과제</div>
      ${tasks.map(({ t }) => li('task:' + t.id, '#d97706', t.title, `${t.due ? h.md(t.due) + ' ' + h.dday(t.due, today) : '마감 없음'}${t.done ? ' · 완료' : ''}`, t.totalMin ? Math.min(100, Math.round((t.spent || 0) / t.totalMin * 100)) : 0)).join('')}
      <button class="navi add ${k === 'newtask' ? 'on' : ''}" data-action="worksel" data-k="newtask">＋ 대회·과제 추가</button>
      <div class="navgroup">달력 일정</div>
      ${ms.map(({ m }) => li('ms:' + m.id, m.kind === 'deadline' ? '#d97706' : m.kind === 'exam' ? '#dc2626' : '#94a3b8', m.title, `${h.md(m.date)}${m.end ? ' ~ ' + h.md(m.end) : ''}`, null)).join('')}
      <button class="navi add ${k === 'newms' ? 'on' : ''}" data-action="worksel" data-k="newms">＋ 일정 추가</button>`;
  }

  // ---------- 시험 ----------
  function exam(S, id, today) {
    const i = S.exams.findIndex(e => e.id === id);
    if (i < 0) return empty();
    const e = S.exams[i], sb = P.subj(S, e.sid), b = `exams.${i}`;
    const rem = P.examRemaining(S, e), tot = P.examTotal(S, e), pct = tot ? Math.round((tot - rem) / tot * 100) : 0;
    const hasScope = e.scope.length;
    return `<div class="panel detail">
      <div class="dh"><i class="dot big" style="background:${sb ? sb.color : '#999'}"></i><h2>${esc(sb ? sb.name : '시험')} 시험</h2><button class="btn sm ghost danger" data-action="delExam" data-i="${i}">삭제</button></div>
      ${tot === 0 && !hasScope ? '<div class="note info">이 시험은 <b>루틴</b>으로 준비해요. 하루에 무엇을 얼마나 할지는 <button class="link" data-action="tab" data-tab="routine">루틴 탭의 주간 시간표</button>에서 정하세요.</div>' : `<div class="prog"><i style="width:${pct}%"></i></div><div class="hint">남은 공부 ${h.fmtMin(rem)} / 전체 ${h.fmtMin(tot)} (${pct}%)</div>`}
      <section class="grp"><h3>시험 날짜</h3>
        <div class="fl"><input type="date" data-bind="${b}.date" data-render="1" value="${esc(e.date)}">${e.date ? `<span class="pill">${h.dday(e.date, today)}</span>` : ''}</div>
        ${h.sw(`${b}.confirmed`, e.confirmed, '날짜 확정', '시험 시간표로 확인한 날짜면 켜세요. 꺼져 있으면 ‘미확정’으로 표시돼요', true)}</section>
      <section class="grp"><h3>시험 범위 <small>${hasScope ? `${e.scope.filter(c => c.done).length}/${e.scope.length} 단원 완료` : '아직 없어요'}</small></h3>
        ${hasScope ? e.scope.map((c, j) => `<div class="ch"><input type="checkbox" data-action="chapter" data-ex="${esc(e.id)}" data-i="${j}" ${c.done ? 'checked' : ''}>
          <input type="text" data-bind="${b}.scope.${j}.title" value="${esc(c.title)}" class="${c.done ? 'done' : ''}">
          ${h.step(`${b}.scope.${j}.min`, c.min != null ? c.min : S.settings.minDefaults.chapter, { step: 10, min: 10, max: 600, unit: '분' })}
          <button class="x" data-action="delChapter" data-ex="${esc(e.id)}" data-i="${j}">×</button></div>`).join('') : '<div class="hint">단원을 입력하면 단원별로 진도를 관리하고, 오늘 탭에서 단원 단위로 체크할 수 있어요.</div>'}
        <textarea id="ch-${esc(e.id)}" rows="3" placeholder="한 줄에 한 단원씩 입력하세요. 시간을 정하려면 ‘3장 평형 | 90’ 처럼 | 뒤에 분을 적어요"></textarea>
        <button class="btn sm" data-action="addChapters" data-ex="${esc(e.id)}">단원 추가</button></section>
      <section class="grp"><h3>필요한 시간</h3>
        ${hasScope ? '<div class="hint">단원별 시간의 합으로 계산해요.</div>' : row('시험 대비 총 시간', '범위를 입력하지 않았을 때 쓰는 값', h.step(`${b}.budgetMin`, e.budgetMin != null ? e.budgetMin : S.settings.minDefaults.exam, { hours: true, step: 30, min: 30, max: 6000, unit: '시간' }))}
        ${row('직전 정리', '시험 직전에 전 범위를 훑는 시간', h.step(`${b}.finalMin`, e.finalMin != null ? e.finalMin : S.settings.minDefaults.final, { step: 10, min: 0, max: 600, unit: '분' }))}</section></div>`;
  }

  // ---------- 새 시험 ----------
  function newExam(S) {
    const used = new Set(S.exams.map(e => e.sid)), free = S.subjects.filter(s => !used.has(s.id));
    return `<div class="panel detail"><div class="dh"><h2>시험 추가</h2></div>
      ${free.length ? `<div class="fl"><label>과목<select id="ex-sid">${free.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select></label>
        <label>시험 날짜 <small class="muted">(몰라도 돼요)</small><input type="date" id="ex-date"></label></div><button class="btn primary" data-action="addExam">추가</button>`
    : '<div class="hint">모든 과목에 시험이 이미 있어요. 설정에서 과목을 먼저 추가하세요.</div>'}</div>`;
  }

  // ---------- 과제 ----------
  function task(S, id, today) {
    const i = S.tasks.findIndex(t => t.id === id);
    if (i < 0) return empty();
    const t = S.tasks[i], b = `tasks.${i}`, rem = Math.max(0, (t.totalMin || 0) - (t.spent || 0));
    const pct = t.totalMin ? Math.min(100, Math.round((t.spent || 0) / t.totalMin * 100)) : 0;
    return `<div class="panel detail">
      <div class="dh"><i class="dot big" style="background:#d97706"></i><h2>${esc(t.title)}</h2><button class="btn sm ghost danger" data-action="delTask" data-i="${i}">삭제</button></div>
      <div class="prog"><i style="width:${pct}%;background:#d97706"></i></div><div class="hint">${t.done ? '끝난 과제예요' : `남은 ${h.fmtMin(rem)} / 전체 ${h.fmtMin(t.totalMin || 0)} (${pct}%)`}</div>
      ${h.schedText(S, 'task:' + t.id, t.due) ? `<div class="hint">${h.schedText(S, 'task:' + t.id, t.due)} <small class="muted">(계획 탭에서 날짜를 누르고 ‘일정 추가’로 잡아요)</small></div>` : ''}
      <section class="grp"><h3>기본</h3>
        <div class="fl"><label>이름<input type="text" data-bind="${b}.title" data-render="1" value="${esc(t.title)}" style="min-width:16rem"></label>
          <label>마감<input type="date" data-bind="${b}.due" data-render="1" value="${esc(t.due || '')}"></label>${t.due ? `<span class="pill warn">${h.dday(t.due, today)}</span>` : ''}</div>
        ${row('총 필요 시간', '이 일을 끝내는 데 드는 전체 시간', h.step(`${b}.totalMin`, t.totalMin || 0, { hours: true, step: 30, min: 30, max: 6000, unit: '시간' }))}
        ${row('중요도', '시간이 모자랄 때 먼저 챙길 정도', h.seg(`${b}.priority`, t.priority || 2, [[3, '상'], [2, '중'], [1, '하']], 'int'))}
        ${h.sw(`${b}.done`, t.done, '끝났어요', '켜면 계획에서 빠져요', true)}</section>
      <section class="grp"><h3>나눠서 하는 방식</h3>
        ${row('한 번에 최소', '이보다 짧게 쪼개 하지 않아요', h.step(`${b}.minChunk`, t.minChunk || 30, { step: 10, min: 10, max: 180, unit: '분' }))}
        ${row('하루 최대', '', h.step(`${b}.maxPerDay`, t.maxPerDay || 180, { step: 30, min: 30, max: 480, unit: '분' }))}
        <div class="fl"><label>관련 과목 <select data-bind="${b}.sid" data-render="1">${subjOptions(S, t.sid || '', true)}</select></label></div></section>
      ${t.items && t.items.length ? `<section class="grp"><h3>세부 항목 <small>${t.items.filter(x => x.done).length}/${t.items.length}</small></h3><ul class="chk">${t.items.map((it, j) => `<li><label><input type="checkbox" data-action="taskitem" data-t="${esc(t.id)}" data-i="${j}" ${it.done ? 'checked' : ''}><span class="tx ${it.done ? 'done' : ''}">${esc(it.text)}${it.min != null ? ` <small class="muted">${it.min}분</small>` : ''}</span></label></li>`).join('')}</ul></section>` : ''}</div>`;
  }

  function newTask(S) {
    if (!A.ui.taskForm) A.ui.taskForm = {};
    const f = A.ui.taskForm;
    if (f.min == null) f.min = 180;
    if (!f.prio) f.prio = 2;
    if (f.split == null) f.split = true;
    return `<div class="panel detail"><div class="dh"><h2>대회·과제 추가</h2></div>
      <section class="grp"><div class="fl"><label>이름<input type="text" data-bind="ui.taskForm.title" value="${esc(f.title || '')}" placeholder="예: KSEF 제출" style="min-width:16rem"></label>
        <label>마감<input type="date" data-bind="ui.taskForm.due" value="${esc(f.due || '')}"></label></div>
        ${row('총 필요 시간', '이 일을 끝내는 데 드는 전체 시간', h.step('ui.taskForm.min', f.min, { hours: true, step: 30, min: 30, max: 6000, unit: '시간' }))}
        ${row('중요도', '', h.seg('ui.taskForm.prio', f.prio, [[3, '상'], [2, '중'], [1, '하']], 'int'))}
        ${h.sw('ui.taskForm.split', f.split, '나눠서 해도 돼요', '꺼두면 한 번에 몰아서 하도록 잡아요', true)}
        <div class="fl"><label>관련 과목 <select data-bind="ui.taskForm.sid">${subjOptions(S, f.sid || '', true)}</select></label></div></section>
      <button class="btn primary" data-action="addTask">추가</button>
      <div class="hint" style="margin-top:10px">공지문이 길면 <button class="link" data-action="tab" data-tab="notes">노트 탭</button>에서 ‘할일 프롬프트’로 Claude에게 정리시킨 뒤 붙여넣을 수도 있어요.</div></div>`;
  }

  // ---------- 달력 일정 ----------
  function milestone(S, id) {
    const i = S.milestones.findIndex(m => m.id === id);
    if (i < 0) return empty();
    const m = S.milestones[i], b = `milestones.${i}`;
    const hasTask = S.tasks.some(t => t.msId === m.id);
    return `<div class="panel detail"><div class="dh"><h2>${esc(m.title)}</h2><button class="btn sm ghost danger" data-action="delMs" data-i="${i}">삭제</button></div>
      <section class="grp"><div class="fl"><label>이름<input type="text" data-bind="${b}.title" data-render="1" value="${esc(m.title)}" style="min-width:16rem"></label></div>
        <div class="fl"><label>날짜<input type="date" data-bind="${b}.date" data-render="1" value="${esc(m.date)}"></label>
          <label>끝나는 날 <small class="muted">(며칠이면)</small><input type="date" data-bind="${b}.end" value="${esc(m.end || '')}"></label></div>
        ${row('종류', '', h.seg(`${b}.kind`, m.kind || 'etc', [['etc', '일반'], ['deadline', '마감'], ['exam', '시험']]))}</section>
      ${m.kind === 'deadline' && !hasTask ? `<button class="btn primary" data-action="msToTask" data-i="${i}">이 마감을 작업으로 추가해 시간 배정받기</button>` : ''}</div>`;
  }
  function newMs() {
    const f = A.ui.msForm || (A.ui.msForm = { kind: 'etc' });
    return `<div class="panel detail"><div class="dh"><h2>일정 추가</h2></div>
      <section class="grp"><div class="fl"><label>이름<input type="text" data-bind="ui.msForm.title" value="${esc(f.title || '')}" style="min-width:16rem"></label>
        <label>날짜<input type="date" data-bind="ui.msForm.date" value="${esc(f.date || '')}"></label></div>
        ${row('종류', '', h.seg('ui.msForm.kind', f.kind || 'etc', [['etc', '일반'], ['deadline', '마감'], ['exam', '시험']]))}</section>
      <button class="btn primary" data-action="addMs">추가</button></div>`;
  }
  const empty = () => `<div class="panel empty">왼쪽에서 항목을 고르거나 추가하세요.</div>`;

  A.views.work = function (S, PLAN) {
    let k = A.ui.workSel;
    const valid = key => { const [t, id] = key.split(':'); return (t === 'exam' && S.exams.some(e => e.id === id)) || (t === 'task' && S.tasks.some(x => x.id === id)) || (t === 'ms' && S.milestones.some(m => m.id === id))  || ['newexam', 'newtask', 'newms'].includes(key); };
    if (!k || !valid(k)) {
      const first = S.exams.slice().sort((a, b) => (a.date || '9').localeCompare(b.date || '9'))[0];
      k = first ? 'exam:' + first.id : 'newtask';
    }
    const [t, id] = k.split(':');
    const body = t === 'exam' ? exam(S, id, PLAN.today) : t === 'task' ? task(S, id, PLAN.today) : t === 'ms' ? milestone(S, id)
      : t === 'newexam' ? newExam(S) : t === 'newtask' ? newTask(S) : newMs();
    return `<div class="md"><nav class="navlist">${list(S, PLAN, k)}</nav><section class="mdmain">${h.alerts(S, PLAN).urgent}${body}</section></div>`;
  };

  // ---------- 액션 ----------
  const Ac = A.actions;
  Ac.worksel = el => { A.ui.workSel = el.dataset.k; A.render(); window.scrollTo(0, 0); };

  Ac.addExam = () => {
    const sid = h.val('ex-sid'), date = h.val('ex-date');
    if (!sid) return;
    const id = 'e_' + sid;
    A.S.exams.push({ id, sid, date: date || '', confirmed: !!date, scope: [], budgetMin: A.S.settings.minDefaults.exam, finalMin: A.S.settings.minDefaults.final, partial: 0, finalSpent: 0, finalDone: false });
    A.ui.workSel = 'exam:' + id; A.save(); A.render();
  };
  Ac.delExam = el => {
    const e = A.S.exams[+el.dataset.i], sb = e && P.subj(A.S, e.sid);
    if (!e || !window.confirm(`${sb ? sb.name : ''} 시험을 목록에서 지울까요?`)) return;
    A.S.exams.splice(+el.dataset.i, 1); A.ui.workSel = null; A.save(); A.render();
  };
  Ac.addChapters = el => {
    const e = A.S.exams.find(x => x.id === el.dataset.ex), ta = document.getElementById('ch-' + el.dataset.ex);
    if (!e || !ta) return;
    const lines = ta.value.split('\n').map(s => s.trim()).filter(Boolean);
    if (!lines.length) { A.toast('단원을 한 줄에 하나씩 입력하세요', true); return; }
    for (const l of lines) {
      const [title, min] = l.split('|').map(s => s.trim());
      e.scope.push({ id: P.uid(), title, min: parseInt(min, 10) || A.S.settings.minDefaults.chapter, done: false });
    }
    A.save(); A.render();
  };
  Ac.delChapter = el => {
    const e = A.S.exams.find(x => x.id === el.dataset.ex);
    if (e) { e.scope.splice(+el.dataset.i, 1); A.save(); A.render(); }
  };

  Ac.addTask = () => {
    const f = A.ui.taskForm || {}, title = (f.title || '').trim();
    if (!title || !(f.min > 0)) { A.toast('이름과 필요한 시간을 정하세요', true); return; }
    const id = P.uid(), total = f.min;
    A.S.tasks.push({
      id, title, due: f.due || '', totalMin: total, spent: 0, priority: f.prio || 2, sid: f.sid || '', msId: f.msId || '',
      minChunk: f.split ? 30 : Math.min(total, 180), maxPerDay: f.split ? 180 : Math.min(total, 240), items: [], done: false
    });
    A.ui.taskForm = null; A.ui.workSel = 'task:' + id;
    A.save(); A.render();
    A.toast('추가했어요. 오늘·계획 탭에 반영돼요.');
  };
  Ac.delTask = el => {
    const t = A.S.tasks[+el.dataset.i];
    if (!t || !window.confirm(`‘${t.title}’을(를) 지울까요?`)) return;
    A.S.tasks.splice(+el.dataset.i, 1); A.ui.workSel = null; A.save(); A.render();
  };

  Ac.addMs = () => {
    const f = A.ui.msForm || {};
    if (!f.date || !(f.title || '').trim()) { A.toast('날짜와 이름을 입력하세요', true); return; }
    const id = P.uid();
    A.S.milestones.push({ id, date: f.date, title: f.title.trim(), kind: f.kind || 'etc' });
    A.ui.msForm = null; A.ui.workSel = 'ms:' + id; A.save(); A.render();
  };
  Ac.delMs = el => { A.S.milestones.splice(+el.dataset.i, 1); A.ui.workSel = null; A.save(); A.render(); };
  Ac.msToTask = el => {
    const m = A.S.milestones[+el.dataset.i];
    A.ui.taskForm = { title: m.title.replace(/\s*마감$/, ''), due: m.date, min: 180, prio: 3, split: true, msId: m.id };
    A.ui.workSel = 'newtask'; A.setTab('work');
  };
})();

</script>
<script>
/* v_routine.js — 루틴 탭: 시간축이 있는 1주일 시간표에 루틴을 놓고(끌어서 요일·시각·길이), 오른쪽에서 세부사항까지 한 번에 정한다 */
(function () {
  'use strict';
  const A = window.App, P = window.Planner, h = A.h, esc = h.esc;
  const PPM = 1.2, SNAP = 5, DAYS = [0, 1, 2, 3, 4, 5, 6];
  const row = (label, desc, ctl) => `<div class="swrow"><span class="swt"><b>${label}</b>${desc ? `<small>${desc}</small>` : ''}</span>${ctl}</div>`;
  const ensure = r => { r.starts = r.starts || {}; r.durs = r.durs || {}; return r; };
  const subjOpts = (S, sel) => S.subjects.map(s => `<option value="${esc(s.id)}" ${s.id === sel ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
  const colorOf = (S, r) => { const sb = P.subj(S, r.sid); return sb ? sb.color : '#94a3b8'; };

  // 루틴·복습 편집 패널용 1자습·2자습 키 (그 요일 템플릿의 공부 시간대)
  const tmplBlocks = (S, day) => (day === 0 || day === 6 ? S.settings.weekendBlocks : S.settings.weekdayBlocks).map(b => [P.toMin(b[0]), P.toMin(b[1])]).filter(b => b[1] > b[0]);
  function tmplKeys(S, rid, day, action) {
    const bl = tmplBlocks(S, day);
    if (bl.length < 2) return '';
    return `<span class="sess">${bl.map(([a, b], i) => `<button type="button" class="sk" data-action="${action || 'rtsess'}" data-rid="${esc(rid)}" data-day="${day}" data-i="${i}" title="${i + 1}자습 (${P.t12(a)}~${P.t12(b)})으로 이동">${i + 1}자습으로</button>`).join('')}</span>`;
  }
  const reviewDef = (S, sid) => P.effMin(S, sid, 'review').min;
  // 과목별 '수업 후 복습': 시간표(수업 요일)에 맞춰 자동으로 생기고, 시각·길이는 과목에 요일별로 저장한다 (sb.rvStarts / sb.rvDurs)
  function reviewOccs(S) {
    const out = [];
    for (const sb of S.subjects) {
      if (!sb.review) continue;
      sb.rvStarts = sb.rvStarts || {}; sb.rvDurs = sb.rvDurs || {};
      const def = reviewDef(S, sb.id);
      for (let w = 1; w <= 5; w++) {
        if (!(S.timetable[w - 1] || []).includes(sb.id)) continue;
        out.push({
          r: { id: 'rv:' + sb.id, title: `${sb.short || sb.name} 복습`, sid: sb.id, amount: '수업 후 복습', isReview: true, min: def, on: true },
          d: w, start: sb.rvStarts[w] != null ? sb.rvStarts[w] : (sb.rvStart != null ? sb.rvStart : null), min: Math.max(5, sb.rvDurs[w] != null ? sb.rvDurs[w] : def)
        });
      }
    }
    return out;
  }
  // 요일별 한 번의 루틴(occurrence) 목록
  function occs(S) {
    const out = [];
    for (const r of S.routines) {
      if (r.on === false) continue;
      ensure(r);
      for (const d of r.days) out.push(Object.assign({ r, d }, P.occ(r, d)));
    }
    return out.concat(reviewOccs(S));
  }

  // ---------- 1주일 시간표 (시간축) ----------
  function gridHtml(S) {
    const all = occs(S);
    const avail = d => (d === 0 || d === 6 ? S.settings.weekendBlocks : S.settings.weekdayBlocks).map(b => [P.toMin(b[0]), P.toMin(b[1])]);
    let lo = 18 * 60;
    for (const d of DAYS) for (const [a] of avail(d)) lo = Math.min(lo, a);
    for (const o of all) if (o.start != null) lo = Math.min(lo, o.start);
    lo = Math.max(0, Math.floor((lo - 30) / 60) * 60);
    const hi = P.DAY_END, H = (hi - lo) * PPM;
    const total = d => all.filter(o => o.d === d).reduce((a, o) => a + o.min, 0);
    const isSel = o => A.ui.rtSel === o.r.id && A.ui.rtDay === o.d;
    const hours = [];
    for (let m = lo; m <= hi; m += 60) hours.push(m);

    const head = `<div class="wk-row wk-head"><span></span>${DAYS.map(d => `<div class="wk-dh ${d === 0 ? 'sun' : d === 6 ? 'sat' : ''}"><b>${P.DOW[d]}</b><small>${total(d) ? h.fmtMin(total(d)) : '&nbsp;'}</small></div>`).join('')}</div>`;
    const un = `<div class="wk-row wk-un"><span class="wk-lab">시간<br>미정</span>${DAYS.map(d => `<div class="wk-ucol" data-day="${d}">${all.filter(o => o.d === d && o.start == null).map(o =>
      `<div class="wu ${isSel(o) ? 'sel' : ''}" data-rid="${esc(o.r.id)}" data-day="${d}" data-d="${o.min}" style="--c:${colorOf(S, o.r)}" title="아래 시간표로 끌어 시각을 정하세요"><span>${esc(o.r.title)}</span><b>${o.min}분</b></div>`).join('')}</div>`).join('')}</div>`;
    const cols = DAYS.map(d => `<div class="wk-col" data-day="${d}" data-t0="${lo}">
        ${avail(d).map(([a, b]) => { const s = Math.max(a, lo); return b > s ? `<div class="wk-av" style="top:${(s - lo) * PPM}px;height:${(b - s) * PPM}px"></div>` : ''; }).join('')}
        ${hours.map(m => `<div class="wk-hr" style="top:${(m - lo) * PPM}px"></div>`).join('')}
        ${all.filter(o => o.d === d && o.start != null).map(o => {
    const c = colorOf(S, o.r), hpx = Math.max(o.min * PPM - 2, 20);
    return `<div class="wb ${isSel(o) ? 'sel' : ''} ${hpx < 44 ? 'sm' : ''}" data-rid="${esc(o.r.id)}" data-day="${d}" data-s="${o.start}" data-d="${o.min}" style="top:${(o.start - lo) * PPM}px;height:${hpx}px;--c:${c};--cb:${h.rgba(c, 0.22)}" title="${esc(o.r.title)}">
          <div class="tt">${esc(o.r.title)}</div><div class="tm">${P.range12(o.start, o.start + o.min)} · ${o.min}분</div>${o.r.amount ? `<div class="tp">${esc(o.r.amount)}</div>` : ''}<i class="wrz" title="아래쪽 끝을 끌어 길이 조절"></i></div>`;
  }).join('')}</div>`).join('');
    return `<div class="wk" data-t0="${lo}">${head}${un}<div class="wk-wrap"><div class="wk-body" style="height:${H}px"><div class="wk-hours">${hours.map(m => `<span style="top:${(m - lo) * PPM}px">${P.t12s(m)}</span>`).join('')}</div>${cols}</div></div></div>`;
  }

  // ---------- 오른쪽 패널 ----------
  function dayChips(r, i) {
    return [1, 2, 3, 4, 5, 6, 0].map(d => `<button type="button" class="dchip ${r.days.includes(d) ? 'on' : ''}" data-action="rtday" data-i="${i}" data-d="${d}">${P.DOW[d]}</button>`).join('');
  }
  function editor(S) {
    const r = S.routines.find(x => x.id === A.ui.rtSel);
    ensure(r);
    const i = S.routines.indexOf(r), b = `routines.${i}`, sb = P.subj(S, r.sid);
    const sorted = r.days.slice().sort((x, y) => x - y);
    const day = r.days.includes(A.ui.rtDay) ? A.ui.rtDay : (sorted.length ? sorted[0] : null);
    const preset = (name, days) => `<button type="button" class="btn sm" data-action="rtpreset" data-i="${i}" data-days="${days.join(',')}">${name}</button>`;
    const perDay = day == null ? '' : `<section class="grp"><h3>${P.DOW[day]}요일만 다르게 <small>예외로 따로 정할 때만 써요 — 평소엔 위의 ‘모든 요일’ 값이 반복돼요</small></h3>
        <div class="fl"><label>시작 시각${h.tsel(`${b}.starts.${day}`, r.starts[day] != null ? P.hm(r.starts[day]) : '', false, { none: r.start != null ? `기본값 (${P.t12(r.start)})` : '시간 미정', tmin: true })}</label>${tmplKeys(S, r.id, day)}</div>
        ${row('길이', `비워 두면 기본 ${r.min}분`, h.step(`${b}.durs.${day}`, r.durs[day], { step: 5, min: 5, max: 480, unit: '분', def: r.min }))}
        <div class="fl"><button class="btn sm" data-action="rtsameall" data-i="${i}" data-d="${day}">이 요일 값을 모든 요일의 기본으로</button><button class="btn sm ghost" data-action="rtresetday" data-i="${i}" data-d="${day}">이 요일 설정 지우기</button></div></section>`;
    return `<div class="panel detail">
      <div class="dh"><i class="dot big" style="background:${sb ? sb.color : '#94a3b8'}"></i><h2>${esc(r.title)}</h2><button class="btn sm ghost" data-action="rtclose">닫기</button><button class="btn sm ghost danger" data-action="delRoutine" data-i="${i}">삭제</button></div>
      <div class="hint">${esc(sb ? sb.name : '')} · ${P.daysText(r.days)}${r.start != null ? ' · ' + P.t12(r.start) + ' 시작' : ' · 시간 미정'} · ${r.min}분${r.amount ? ' · ' + esc(r.amount) : ''}</div>
      <section class="grp"><h3>무엇을</h3>
        <div class="fl"><label>이름<input type="text" data-bind="${b}.title" data-render="1" value="${esc(r.title)}" style="min-width:12rem"></label>
          <label>과목<select data-bind="${b}.sid" data-render="1">${subjOpts(S, r.sid)}</select></label></div>
        <div class="fl"><label class="wide">목표량 · 메모 <small class="muted">(예: 단어 30개 — 오늘 탭에도 보여요)</small><input type="text" data-bind="${b}.amount" data-render="1" value="${esc(r.amount || '')}"></label></div></section>
      <section class="grp"><h3>요일 · 시각 · 길이 <small>한 번 정하면 선택한 요일마다 반복돼요</small></h3>
        <div class="dchips">${dayChips(r, i)}</div>
        <div class="fl">${preset('매일', [0, 1, 2, 3, 4, 5, 6])}${preset('평일', [1, 2, 3, 4, 5])}${preset('주말', [6, 0])}</div>
        <div class="fl"><label>시작 시각 (모든 요일)${h.tsel(`${b}.start`, r.start != null ? P.hm(r.start) : '', false, { none: '시간 미정', tmin: true })}</label>${tmplKeys(S, r.id, r.days.find(d => d >= 1 && d <= 5) != null ? r.days.find(d => d >= 1 && d <= 5) : 1, 'rtsessdef')}</div>
        ${row('길이 (모든 요일)', '요일별로 따로 정하지 않았을 때', h.step(`${b}.min`, r.min, { step: 5, min: 5, max: 300, unit: '분' }))}</section>
      ${perDay}
      <section class="grp"><h3>기간</h3>
        <div class="fl"><label>시작<input type="date" data-bind="${b}.from" data-render="1" value="${esc(r.from || '')}"></label>
          <label>끝 <small class="muted">(비우면 계속)</small><input type="date" data-bind="${b}.until" data-render="1" value="${esc(r.until || '')}"></label></div>
        ${h.sw(`${b}.on`, r.on !== false, '이 루틴 켜기', '끄면 시간표와 계획에서 잠시 빠져요', true)}</section></div>`;
  }

  function reviewEditor(S) {
    const sb = P.subj(S, A.ui.rtSel.slice(3));
    if (!sb) return idle(S);
    sb.rvStarts = sb.rvStarts || {}; sb.rvDurs = sb.rvDurs || {}; sb.mins = sb.mins || {};
    const i = S.subjects.indexOf(sb), b = `subjects.${i}`, def = reviewDef(S, sb.id);
    const days = [1, 2, 3, 4, 5].filter(w => (S.timetable[w - 1] || []).includes(sb.id));
    const day = days.includes(A.ui.rtDay) ? A.ui.rtDay : days[0];
    const perDay = day == null ? '' : `<section class="grp"><h3>${P.DOW[day]}요일만 다르게 <small>예외로 따로 정할 때만 써요 — 평소엔 아래 ‘모든 수업 요일’ 값이 반복돼요</small></h3>
        <div class="fl"><label>시작 시각${h.tsel(`${b}.rvStarts.${day}`, sb.rvStarts[day] != null ? P.hm(sb.rvStarts[day]) : '', false, { none: sb.rvStart != null ? `기본값 (${P.t12(sb.rvStart)})` : '시간 미정', tmin: true })}</label>${tmplKeys(S, 'rv:' + sb.id, day)}</div>
        ${row('길이', `비워 두면 기본 ${def}분`, h.step(`${b}.rvDurs.${day}`, sb.rvDurs[day], { step: 5, min: 5, max: 240, unit: '분', def }))}
        <div class="fl"><button class="btn sm" data-action="rvsameall" data-sid="${esc(sb.id)}" data-d="${day}">이 요일 값을 모든 수업 요일의 기본으로</button><button class="btn sm ghost" data-action="rvresetday" data-sid="${esc(sb.id)}" data-d="${day}">이 요일 설정 지우기</button></div></section>`;
    return `<div class="panel detail">
      <div class="dh"><i class="dot big" style="background:${sb.color}"></i><h2>${esc(sb.name)} 복습</h2><button class="btn sm ghost" data-action="rtclose">닫기</button></div>
      <div class="hint">수업이 있는 날, 그 수업을 복습하는 시간이에요. 시간표(수업 요일)에 맞춰 자동으로 생겨요.</div>
      <section class="grp"><h3>수업 요일</h3><div class="dchips">${days.map(w => `<span class="dchip on static">${P.DOW[w]}</span>`).join('') || '<span class="muted">시간표에 이 과목 수업이 없어요</span>'}</div>
        <div class="hint">수업 요일은 <button class="link" data-action="tab" data-tab="settings">설정</button> → 시간표에서 바꿔요.</div></section>
      ${perDay}
      <section class="grp"><h3>복습 시각 · 설정 <small>수업 요일마다 반복돼요</small></h3>
        <div class="fl"><label>시작 시각 (모든 수업 요일)${h.tsel(`${b}.rvStart`, sb.rvStart != null ? P.hm(sb.rvStart) : '', false, { none: '시간 미정', tmin: true })}</label>${tmplKeys(S, 'rv:' + sb.id, days[0] != null ? days[0] : 1, 'rtsessdef')}</div>
        ${h.sw(`${b}.review`, sb.review, '수업 후 복습', '끄면 이 과목은 복습이 생기지 않아요', true)}
        ${row('기본 길이', `기록이 쌓이면 자동으로 보정돼요 (지금 ${def}분)`, h.step(`${b}.mins.review`, sb.mins.review, { step: 5, min: 5, max: 180, unit: '분', def: S.settings.minDefaults.review }))}</section></div>`;
  }
  function reviewList(S) {
    const subs = S.subjects.filter(sb => sb.review);
    if (!subs.length) return '';

  }

  function newForm(S) {
    const f = A.ui.rtNew;
    const chips = [1, 2, 3, 4, 5, 6, 0].map(d => `<button type="button" class="dchip ${f.days.includes(d) ? 'on' : ''}" data-action="rnday" data-d="${d}">${P.DOW[d]}</button>`).join('');

      <section class="grp"><div class="fl"><label class="wide">이름<input type="text" id="rn-title" data-bind="ui.rtNew.title" value="${esc(f.title)}" placeholder="예: 단어 암기, Math 문제풀이"></label></div>

        <div class="fl"><label class="wide">목표량 · 메모 <small class="muted">(선택)</small><input type="text" data-bind="ui.rtNew.amount" value="${esc(f.amount)}" placeholder="예: 단어 30개"></label></div></section>
      <section class="grp"><h3>언제, 얼마나</h3><div class="dchips">${chips}</div>
        <div class="fl"><label>시작 시각${h.tsel('ui.rtNew.start', f.start, false, { none: '시간 미정' })}</label></div>
        ${row('길이', '', h.step('ui.rtNew.min', f.min, { step: 5, min: 5, max: 300, unit: '분' }))}</section>
      <button class="btn primary" data-action="rncreate">만들기</button></div>`;
  }

  function satForm(S) {
    const f = A.ui.satForm || (A.ui.satForm = { date: '', vocab: true, rw: true, math: true, mock: true });
    return `<div class="panel detail"><div class="dh"><h2>SAT 준비 추가</h2><button class="btn sm ghost" data-action="rncancel">취소</button></div>
      <div class="hint">시험 날짜와 어떤 공부를 할지만 고르면 기본 루틴이 만들어져요. 시각·요일·길이는 왼쪽 시간표에서 끌어서 정해요. 시험 날짜는 캘린더에서 시험 라벨을 끌어 옮겨도 돼요.</div>
      <section class="grp"><div class="fl"><label>SAT 시험 날짜<input type="date" data-bind="ui.satForm.date" value="${esc(f.date)}"></label></div></section>
      <section class="grp"><h3>만들 루틴</h3>
        ${h.sw('ui.satForm.vocab', f.vocab, '단어 암기', '매일 20분 · 단어 30개', true)}
        ${h.sw('ui.satForm.rw', f.rw, 'Reading & Writing 문제풀이', '월·수·금 40분', true)}
        ${h.sw('ui.satForm.math', f.math, 'Math 문제풀이', '화·목·일 40분', true)}
        ${h.sw('ui.satForm.mock', f.mock, '모의고사', '토요일 3시간 (풀이 + 오답 정리)', true)}</section>
      <button class="btn primary" data-action="addSat">SAT 준비 만들기</button></div>`;
  }

  function idle(S) {
    return `<div class="panel detail"><div class="dh"><h2>루틴</h2></div>
      <div class="hint">왼쪽 시간표에서 <b>블록을 끌어</b> 요일·시각을 정하고, <b>아래쪽 끝을 끌어</b> 길이를 바꿔요. <b>빈 곳을 두 번 누르면</b> 그 시간에 새 루틴을 만들어요. ‘시간 미정’ 칸의 루틴은 아래 시간표로 끌어 내려 시각을 정하세요. 블록을 끌면 그 루틴의 <b>모든 요일이 함께 움직여 반복</b>돼요 (한 요일만 바꾸려면 <b>Alt 또는 Shift</b>를 누른 채 끌어요). 블록을 누르면 여기서 이름·과목·목표량·요일별 시간까지 고쳐요. <b>과목별 수업 후 복습</b>도 수업 요일마다 시간표에 올라와 있어서 똑같이 끌어서 시각·길이를 정해요.</div>
      ${S.routines.length ? `<h3>루틴 ${S.routines.length}개</h3>${S.routines.map(r => { const sb = P.subj(S, r.sid); return `<button class="mi" data-action="rtpick" data-id="${esc(r.id)}" style="--c:${colorOf(S, r)}"><i class="dot" style="background:${colorOf(S, r)}"></i><span class="mt">${esc(r.title)}</span><span class="muted small">${esc(sb ? sb.short || sb.name : '')} · ${P.daysText(r.days)}${r.on === false ? ' · 꺼짐' : ''}</span><span class="mm">${r.min}분</span></button>`; }).join('')}` : '<div class="hint">아직 루틴이 없어요. ‘＋ 새 루틴’ 또는 ‘＋ SAT 준비 추가’로 시작하세요.</div>'}${reviewList(S)}</div>`;
  }

  A.views.routine = function (S) {
    S.routines.forEach(ensure);
    let right;
    if (A.ui.rtMode === 'sat') right = satForm(S);
    else if (A.ui.rtNew) right = newForm(S);
    else if (A.ui.rtSel && String(A.ui.rtSel).startsWith('rv:')) right = reviewEditor(S);
    else if (A.ui.rtSel && S.routines.some(r => r.id === A.ui.rtSel)) right = editor(S);
    else right = idle(S);
    return `<div class="split rt-split"><section class="pane-l">
      <div class="rt-top"><h2>주간 루틴 시간표</h2><div class="rt-btns"><button class="btn sm primary" data-action="rtnew">＋ 새 루틴</button><button class="btn sm" data-action="rtsat">＋ SAT 준비 추가</button></div></div>
      <div class="rt-hint">블록을 끌면 그 루틴의 <b>모든 요일에 반복</b>돼요 · 한 요일만 바꾸려면 <b>Alt(또는 Shift)</b>를 누른 채 끌어요 · 아래 끝을 끌면 길이</div>
      <div class="wkscroll">${gridHtml(S)}</div></section><aside class="pane-r">${right}</aside></div>`;
  };

  // ---------- 모델 변경 ----------
  function resolve(start, dur, others) {
    start = Math.max(0, Math.min(P.DAY_END - dur, start));
    for (let it = 0; it < 8; it++) {
      const hit = others.find(([a, b]) => start < b && start + dur > a);
      if (!hit) break;
      const after = hit[1], before = hit[0] - dur;
      start = (before < 0 || after - start <= start - before) ? after : before;
      start = Math.max(0, Math.min(P.DAY_END - dur, start));
    }
    return start;
  }
  // 시간표에서 끌어 옮길 때의 규칙
  //  · 같은 요일에서 시각을 바꾸면 → 그 루틴의 '기본 시각'이 바뀌어 모든 요일에 반복 (그 요일에 따로 정한 값이 있으면 그 값만). opt.only(Alt/Shift) 면 그 요일만.
  //  · '시간 미정' 칩을 시간표에 놓으면 → 기본 시각이 정해져 모든 요일에 반복 (놓은 요일이 없었으면 요일도 추가)
  //  · 다른 요일로 끌면 → 그 한 번을 다른 요일로 옮김 · '시간 미정' 칸에 놓으면 → 시각을 모두 지움
  //  · 길이도 같은 규칙: 기본 길이가 바뀌고, opt.only 이거나 이미 따로 정한 요일이면 그 요일만
  A.moveOcc = function (rid, from, to, start, dur, opt) {
    opt = opt || {};
    const S = A.S, rv = String(rid).startsWith('rv:');
    const obj = rv ? P.subj(S, rid.slice(3)) : S.routines.find(x => x.id === rid);
    if (!obj) return;
    if (rv && from !== to) { A.toast('복습은 수업이 있는 요일에만 해요 (수업 요일은 설정 → 시간표에서 바꿔요)', true); A.render(); return; }
    if (rv) { obj.rvStarts = obj.rvStarts || {}; obj.rvDurs = obj.rvDurs || {}; obj.mins = obj.mins || {}; } else ensure(obj);
    const st = () => (rv ? obj.rvStarts : obj.starts), du = () => (rv ? obj.rvDurs : obj.durs);
    const defStart = rv ? obj.rvStart : obj.start, defMin = rv ? reviewDef(S, obj.id) : obj.min;
    if (start != null) {
      const others = occs(S).filter(o => o.d === to && o.start != null && !(o.r.id === rid && o.d === from)).map(o => [o.start, o.start + o.min]);
      start = resolve(start, dur, others);
    }
    if (start == null) {
      if (rv) { obj.rvStart = null; obj.rvStarts = {}; } else { obj.start = null; obj.starts = {}; }
    } else if (opt.fromTray) {
      if (rv) obj.rvStart = start; else { obj.start = start; if (!obj.days.includes(to)) obj.days.push(to); }
    } else if (from === to) {
      if (opt.only || st()[to] != null) st()[to] = start; else if (rv) obj.rvStart = start; else obj.start = start;
    } else {
      obj.days = obj.days.filter(x => x !== from); delete st()[from]; delete du()[from];
      if (!obj.days.includes(to)) obj.days.push(to);
      if (defStart != null && start === defStart) delete st()[to]; else st()[to] = start;
    }
    if (dur === defMin) delete du()[to];
    else if (opt.only || du()[to] != null || from !== to) du()[to] = dur;
    else if (rv) obj.mins.review = dur; else obj.min = dur;
    A.ui.rtSel = rid; A.ui.rtDay = to; A.ui.rtNew = null; A.ui.rtMode = null;
    A.save(); A.render();
  };

  // ---------- 끌기 (블록·미정 칩) ----------
  let drag = null;
  document.addEventListener('pointerdown', ev => {
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    if (ev.target.closest('[data-action]')) return;
    const el = ev.target.closest('.wb, .wu');
    if (!el || !el.closest('.wk')) return;
    const r = el.getBoundingClientRect(), isBlock = el.classList.contains('wb');
    drag = { el, isBlock, rid: el.dataset.rid, day: +el.dataset.day, s: isBlock ? +el.dataset.s : null, d: +el.dataset.d, x0: ev.clientX, y0: ev.clientY, grab: Math.min(ev.clientY - r.top, isBlock ? 9999 : 10), mode: ev.target.closest('.wrz') ? 'resize' : 'move', moved: false, h0: r.height };
    ev.preventDefault();
  });
  document.addEventListener('pointermove', ev => {
    if (!drag) return;
    const dx = ev.clientX - drag.x0, dy = ev.clientY - drag.y0;
    if (!drag.moved && Math.hypot(dx, dy) < 5) return;
    if (!drag.moved) { drag.moved = true; A.ui.dragging = true; drag.el.classList.add('drag'); }
    if (drag.mode === 'resize' && drag.isBlock) {
      const dm = Math.round(dy / PPM / SNAP) * SNAP, dur = Math.max(5, drag.d + dm);
      drag.el.style.height = Math.max(dur * PPM - 2, 20) + 'px';
      const tm = drag.el.querySelector('.tm'); if (tm) tm.textContent = `${P.range12(drag.s, drag.s + dur)} · ${dur}분`;
    } else drag.el.style.transform = `translate(${dx}px, ${dy}px)`;
  });
  function finish(ev, cancel) {
    if (!drag) return;
    const d = drag;
    drag = null; A.ui.dragging = false;
    d.el.classList.remove('drag'); d.el.style.transform = '';
    if (cancel) { A.render(); return; }
    if (!d.moved) { A.ui.rtSel = d.rid; A.ui.rtDay = d.day; A.ui.rtNew = null; A.ui.rtMode = null; A.render(); return; }
    if (d.mode === 'resize' && d.isBlock) {
      const dm = Math.round((ev.clientY - d.y0) / PPM / SNAP) * SNAP;
      A.moveOcc(d.rid, d.day, d.day, d.s, Math.max(5, d.d + dm), { only: ev.altKey || ev.shiftKey });
      return;
    }
    const els = document.elementsFromPoint(ev.clientX, ev.clientY);
    const col = els.find(e => e.classList && e.classList.contains('wk-col'));
    const un = els.find(e => e.classList && e.classList.contains('wk-ucol'));
    if (col) {
      const t0 = +col.dataset.t0, top = col.getBoundingClientRect().top;
      const start = Math.round((t0 + (ev.clientY - d.grab - top) / PPM) / SNAP) * SNAP;
      A.moveOcc(d.rid, d.day, +col.dataset.day, Math.max(0, start), d.d, { only: ev.altKey || ev.shiftKey, fromTray: !d.isBlock });
    } else if (un) A.moveOcc(d.rid, d.day, +un.dataset.day, null, d.d);
    else A.render();
  }
  document.addEventListener('pointerup', ev => finish(ev, false));
  document.addEventListener('pointercancel', ev => finish(ev, true));

  // 빈 곳을 두 번 누르면 그 요일·시각에 새 루틴
  function openNew(day, startMin) {
    const S = A.S;
    A.ui.rtMode = null; A.ui.rtSel = null;
    A.ui.rtNew = { title: '', sid: (P.subj(S, 'sat') ? 'sat' : (S.subjects[0] || {}).id) || '', days: [day], start: startMin == null ? '' : P.hm(Math.max(0, Math.min(P.DAY_END - 15, Math.round(startMin / 15) * 15))), min: 30, amount: '' };
    A.render();
    const t = document.getElementById('rn-title'); if (t) t.focus();
  }
  document.addEventListener('dblclick', ev => {
    const col = ev.target.closest('.wk-col');
    if (col && !ev.target.closest('.wb')) {
      const top = col.getBoundingClientRect().top;
      openNew(+col.dataset.day, +col.dataset.t0 + (ev.clientY - top) / PPM);
    }
    const un = ev.target.closest('.wk-ucol');
    if (un && !ev.target.closest('.wu')) openNew(+un.dataset.day, null);
  });

  // ---------- 액션 ----------
  const Ac = A.actions;
  Ac.rtnew = () => openNew(P.dow(P.today()), null);
  Ac.rtsat = () => { A.ui.rtMode = 'sat'; A.ui.rtSel = null; A.ui.rtNew = null; A.render(); };
  Ac.rncancel = () => { A.ui.rtMode = null; A.ui.rtNew = null; A.render(); };
  Ac.rtclose = () => { A.ui.rtSel = null; A.ui.rtDay = null; A.render(); };
  Ac.rtpick = el => { A.ui.rtSel = el.dataset.id; A.ui.rtDay = null; A.render(); };
  Ac.rnday = el => {
    const f = A.ui.rtNew, d = +el.dataset.d;
    f.days = f.days.includes(d) ? f.days.filter(x => x !== d) : f.days.concat(d);
    A.render();
  };
  Ac.rncreate = () => {
    const S = A.S, f = A.ui.rtNew, title = (h.val('rn-title') || f.title || '').trim();
    if (!title) { A.toast('이름을 입력하세요', true); return; }
    if (!f.days.length) { A.toast('요일을 하나 이상 고르세요', true); return; }
    if (!P.subj(S, f.sid)) { A.toast('과목을 고르세요', true); return; }
    const r = { id: P.uid(), title, sid: f.sid, days: f.days.slice(), min: f.min || 30, amount: (f.amount || '').trim(), from: P.today(), until: '', on: true, start: null, starts: {}, durs: {} };
    if (f.start) r.start = P.toMin(f.start);
    S.routines.push(r);
    A.ui.rtNew = null; A.ui.rtSel = r.id; A.ui.rtDay = r.days[0];
    A.save(); A.render(); A.toast('루틴을 만들었어요');
  };

  Ac.rtday = el => {
    const r = A.S.routines[+el.dataset.i], d = +el.dataset.d;
    if (!r) return;
    ensure(r);
    if (r.days.includes(d)) { r.days = r.days.filter(x => x !== d); delete r.starts[d]; delete r.durs[d]; } else r.days.push(d);
    A.ui.rtDay = r.days.includes(d) ? d : A.ui.rtDay;
    A.save(); A.render();
  };
  Ac.rtpreset = el => {
    const r = A.S.routines[+el.dataset.i];
    if (!r) return;
    ensure(r);
    const days = el.dataset.days.split(',').map(Number);
    for (const d of r.days) if (!days.includes(d)) { delete r.starts[d]; delete r.durs[d]; }
    r.days = days;
    A.save(); A.render();
  };
  Ac.rtsameall = el => {
    const r = A.S.routines[+el.dataset.i], d = +el.dataset.d;
    if (!r) return;
    ensure(r);
    const st = r.starts[d] != null ? r.starts[d] : r.start, du = r.durs[d] != null ? r.durs[d] : r.min;
    r.start = st != null ? st : null; r.min = du; r.starts = {}; r.durs = {};
    A.save(); A.render(); A.toast('이 요일 값을 모든 요일의 기본으로 만들었어요');
  };
  Ac.rtresetday = el => {
    const r = A.S.routines[+el.dataset.i], d = +el.dataset.d;
    if (!r) return;
    ensure(r); delete r.starts[d]; delete r.durs[d];
    A.save(); A.render();
  };
  Ac.rvsameall = el => {
    const sb = P.subj(A.S, el.dataset.sid), d = +el.dataset.d;
    if (!sb) return;
    sb.rvStarts = sb.rvStarts || {}; sb.rvDurs = sb.rvDurs || {}; sb.mins = sb.mins || {};
    const st = sb.rvStarts[d] != null ? sb.rvStarts[d] : sb.rvStart;
    sb.rvStart = st != null ? st : null;
    if (sb.rvDurs[d] != null) sb.mins.review = sb.rvDurs[d];
    sb.rvStarts = {}; sb.rvDurs = {};
    A.save(); A.render(); A.toast('이 요일 값을 모든 수업 요일의 기본으로 만들었어요');
  };
  Ac.rvresetday = el => {
    const sb = P.subj(A.S, el.dataset.sid), d = +el.dataset.d;
    if (!sb) return;
    sb.rvStarts = sb.rvStarts || {}; sb.rvDurs = sb.rvDurs || {};
    delete sb.rvStarts[d]; delete sb.rvDurs[d];
    A.save(); A.render();
  };
  Ac.rtsess = el => {
    const S = A.S, rid = el.dataset.rid, day = +el.dataset.day, i = +el.dataset.i, bl = tmplBlocks(S, day)[i];
    const all = occs(S), o = all.find(x => x.r.id === rid && x.d === day);
    if (!bl || !o) return;
    const taken = all.filter(x => x.d === day && x.start != null && x.r.id !== rid).map(x => [x.start, x.start + x.min]);
    const start = P.firstFit(bl[0], bl[1], taken, o.min);
    if (start == null) { A.toast(`${i + 1}자습(${P.t12(bl[0])}~${P.t12(bl[1])})에는 빈 자리가 부족해요`, true); return; }
    A.moveOcc(rid, day, day, start, o.min, { only: true });
  };
  Ac.rtsessdef = el => {
    const S = A.S, rid = el.dataset.rid, day = +el.dataset.day, i = +el.dataset.i, bl = tmplBlocks(S, day)[i];
    const all = occs(S), o = all.find(x => x.r.id === rid && x.d === day);
    if (!bl || !o) return;
    const taken = all.filter(x => x.d === day && x.start != null && x.r.id !== rid).map(x => [x.start, x.start + x.min]);
    const start = P.firstFit(bl[0], bl[1], taken, o.min);
    if (start == null) { A.toast(`${i + 1}자습(${P.t12(bl[0])}~${P.t12(bl[1])})에는 빈 자리가 부족해요`, true); return; }
    if (rid.startsWith('rv:')) { const sb = P.subj(S, rid.slice(3)); if (sb) sb.rvStart = start; }
    else { const r = S.routines.find(x => x.id === rid); if (r) r.start = start; }
    A.save(); A.render(); A.toast(`모든 요일 ${i + 1}자습 ${P.t12(start)} 시작으로 정했어요`);
  };
  Ac.delRoutine = el => {
    const r = A.S.routines[+el.dataset.i];
    if (!r || !window.confirm(`‘${r.title}’ 루틴을 지울까요?`)) return;
    A.S.routines.splice(+el.dataset.i, 1); A.ui.rtSel = null; A.ui.rtDay = null;
    A.save(); A.render();
  };

  Ac.addSat = () => {
    const f = A.ui.satForm || {}, S = A.S;
    if (!f.date) { A.toast('SAT 시험 날짜를 선택하세요', true); return; }
    if (f.date <= P.today()) { A.toast('시험 날짜는 오늘 이후여야 해요', true); return; }
    if (S.exams.some(e => e.id === 'e_sat')) { A.ui.rtMode = null; A.render(); A.toast('이미 SAT 준비가 있어요. 시간표에서 고치세요'); return; }
    if (!P.subj(S, 'sat')) {
      const used = new Set(S.subjects.map(x => x.color)), color = P.COLORS.find(c => !used.has(c)) || P.COLORS[S.subjects.length % P.COLORS.length];
      S.subjects.push({ id: 'sat', short: 'SAT', name: 'SAT', folder: 'SAT', aliases: ['SAT', '새트'], review: false, preview: false, weight: 4, hard: false, mins: {}, color });
    }
    // 시험 항목은 날짜 표시용 (공부 시간은 루틴으로만 잡는다)
    S.exams.push({ id: 'e_sat', sid: 'sat', label: '준비', date: f.date, confirmed: true, scope: [], budgetMin: 0, finalMin: 0, partial: 0, finalSpent: 0, finalDone: false });
    const until = P.addDays(f.date, -1);
    const mk = (title, days, min, amount) => S.routines.push({ id: P.uid(), title, sid: 'sat', days, min, amount, from: P.today(), until, on: true, start: null, starts: {}, durs: {} });
    let n = 0;
    if (f.vocab) { mk('단어 암기', [0, 1, 2, 3, 4, 5, 6], 20, '단어 30개'); n++; }
    if (f.rw) { mk('Reading & Writing 문제풀이', [1, 3, 5], 40, ''); n++; }
    if (f.math) { mk('Math 문제풀이', [2, 4, 0], 40, ''); n++; }
    if (f.mock) { mk('모의고사', [6], 180, '풀이 + 오답 정리'); n++; }
    A.ui.satForm = null; A.ui.rtMode = null; A.ui.rtSel = null;
    A.save(); A.render(); A.toast(`SAT 준비를 만들었어요 (루틴 ${n}개). ‘시간 미정’ 칸에서 아래 시간표로 끌어 시각을 정하세요`);
  };
})();

</script>
<script>
/* v_alloc.js — 할당 탭: 번호 묶음(WS 1~10)·이름 목록(R&W 세트들)을 만들어 두고 날짜에 하나씩 배정한다.
   배정 = 그 항목에 묶인 일정(S.custom, c.alloc = { a, i })을 만드는 것. 시각을 안 정하면 그날 빈 시간에 자동 배치되고, 못 끝낸 건 오늘로 이월된다.
   (엔진: planner.js 의 P.allocUnits / allocStats / allocSpread / autoAllocMin) */
(function () {
  'use strict';
  const A = window.App, P = window.Planner, h = A.h, esc = h.esc, Ac = A.actions;
  const newId = () => 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 4);
  const row = (label, desc, ctl) => `<div class="swrow"><span class="swt"><b>${label}</b>${desc ? `<small>${desc}</small>` : ''}</span>${ctl}</div>`;

  // ---------- 배정 / 해제 (다른 화면에서도 쓴다) ----------
  A.assignUnit = function (aid, iid, date, quiet) {
    const S = A.S, a = S.allocs.find(x => x.id === aid), it = a && a.items.find(x => x.id === iid);
    if (!it) return false;
    if (date < P.today()) { A.toast('지난 날짜에는 배정할 수 없어요', true); return false; }
    if (it.done) { A.toast('이미 끝낸 항목이에요', true); return false; }
    const c = S.custom.find(x => x.alloc && x.alloc.a === aid && x.alloc.i === iid && !x.done);
    if (c) { if (c.date === date) return true; c.date = date; c.start = null; }          // 다른 날로 옮기면 시각은 비워 자동 배치
    else {
      A.freezeDay(date);                                                                     // 그날의 다른 블록은 제자리에 둔다
      S.custom.push({ id: P.uid(), date, title: it.label, kind: 'todo', start: null, dur: it.min || a.min, done: false, alloc: { a: aid, i: iid } });
    }
    if (!quiet) { A.save(); A.render(); }
    return true;
  };
  // 배정된 일정 줄을 ‘배정 대기’ 칸으로 끌어오면 배정을 푼다
  A.unassignDrag = function (v) {
    const S = A.S, id = v.slice(v.indexOf('|') + 1).slice(11);                              // 'cu|<일정id>'
    const i = S.custom.findIndex(c => 'cu|' + c.id === id);
    if (i < 0 || !S.custom[i].alloc || S.custom[i].done) { A.toast('배정된 할당 항목만 대기로 돌릴 수 있어요', true); return; }
    const c = S.custom.splice(i, 1)[0];
    A.save(); A.render();
    A.toast(`배정을 풀었어요 · ${c.title}`, false, { fn: () => { S.custom.push(c); A.save(); A.render(); } });
  };

  // ---------- 계획 탭: 배정 대기 칸 ----------
  h.allocTray = S => {
    const groups = S.allocs.map(a => ({ a, w: P.allocUnits(S, a).filter(u => u.state === 'waiting') })).filter(g => g.w.length);
    if (!groups.length) return '';
    const n = groups.reduce((a, g) => a + g.w.length, 0);
    return `<div class="alloc-tray" title="칩을 날짜 칸으로 끌어 놓으면 그날 계획에 들어가요. 배정된 항목은 달력에서 끌어 옮기고, 이 칸으로 끌어오면 배정이 풀려요"><div class="at-h"><b>배정 대기 ${n}개</b><span class="muted small">칩을 날짜 칸으로 끌어 놓으세요</span>
      <button class="btn sm ghost right" data-action="tab" data-tab="alloc">할당 관리 ›</button></div>
      <div class="at-body">${groups.map(g => `<div class="at-g"><span class="at-n" style="--c:${g.a.color}">${esc(g.a.title)}</span>${g.w.map(u => `<span class="at-chip" draggable="true" data-drag="alloc|0000-00-00|${esc(g.a.id)}:${esc(u.item.id)}" style="--c:${g.a.color}">${esc(u.item.label)}</span>`).join('')}</div>`).join('')}</div></div>`;
  };

  // ---------- 홈: 할당 현황 ----------
  h.allocHome = (S, today) => {
    const L = S.allocs.map(a => ({ a, st: P.allocStats(S, a, today) })).filter(x => x.st.total && x.st.done < x.st.total);
    if (!L.length) return '';
    return `<div class="panel home-alloc"><div class="ph"><h2>할당 현황</h2><button class="btn sm ghost" data-action="tab" data-tab="alloc">관리 ›</button></div>
      ${L.slice(0, 5).map(({ a, st }) => {
    const pct = Math.round(st.done / st.total * 100), n = st.next;
    const nx = n ? `다음 ${esc(n.item.label)} · ${n.date ? `${h.md(n.date)}${n.date < today ? ' (밀림)' : ''}` : '배정 안 됨'}` : '';
    return `<div class="hal" role="button" tabindex="0" data-action="alopen" data-id="${esc(a.id)}"><div class="hal-h"><i class="dot" style="background:${a.color}"></i><b>${esc(a.title)}</b><span class="muted small">${st.done}/${st.total}${st.waiting ? ` · 대기 ${st.waiting}` : ''}</span></div>
          <div class="mprog hal-p"><i style="width:${pct}%;background:${a.color}"></i></div><div class="muted small">${nx}${st.late ? ' · <b class="bad">마감보다 늦게 배정됐어요</b>' : ''}</div></div>`;
  }).join('')}</div>`;
  };

  // ---------- 할당 탭 ----------
  const selKey = S => {
    const id = A.ui.allocSel;
    if (id === 'new') return 'new';
    if (S.allocs.some(a => a.id === id)) return id;
    return S.allocs[0] ? S.allocs[0].id : 'new';
  };

  function nav(S, k) {
    const today = P.today();
    return `<div class="navgroup">할당</div>${S.allocs.map(a => {
      const st = P.allocStats(S, a, today), pct = st.total ? Math.round(st.done / st.total * 100) : 0;
      return `<button class="navi li ${k === a.id ? 'on' : ''}" data-action="alsel" data-id="${esc(a.id)}"><i class="dot" style="background:${a.color}"></i><span class="lt">${esc(a.title)}</span><small>${st.done}/${st.total}${st.waiting ? ` · 대기 ${st.waiting}` : ''}</small><span class="mprog"><i style="width:${pct}%;background:${a.color}"></i></span></button>`;
    }).join('')}
      <button class="navi add ${k === 'new' ? 'on' : ''}" data-action="alsel" data-id="new">＋ 할당 만들기</button>`;
  }

  function unitRow(a, u, today) {
    const it = u.item, ids = `data-id="${esc(a.id)}" data-i="${esc(it.id)}"`;
    const fin = `<button class="btn sm ghost" data-action="alfin" ${ids} title="이미 했어요 (완료로 표시)">✓</button>`;
    const del = `<button class="btn sm ghost" data-action="aldelitem" ${ids} title="이 항목 지우기">✕</button>`;
    let status, ctl;
    if (u.state === 'done') {
      status = `<span class="als ok">✓ 완료${it.doneDate ? ' · ' + h.md(it.doneDate) : ''}</span>`;
      ctl = `<button class="btn sm ghost" data-action="alundo" ${ids}>되돌리기</button>`;
    } else if (u.state === 'assigned') {
      const late = u.date < today;
      status = `<span class="als ${late ? 'bad' : ''}">${h.md(u.date)} 배정${late ? ` · ${P.diffDays(u.date, today)}일 밀림` : ''}</span>`;
      ctl = `<input type="date" class="alp" data-alassign="${esc(a.id)}:${esc(it.id)}" value="${u.date < today ? today : u.date}" min="${today}" title="날짜를 바꾸면 옮겨져요"><button class="btn sm ghost" data-action="alunassign" ${ids}>풀기</button>${fin}${del}`;
    } else {
      status = '<span class="als muted">대기</span>';
      ctl = `<input type="date" class="alp" data-alassign="${esc(a.id)}:${esc(it.id)}" value="" min="${today}" title="날짜를 고르면 배정돼요">${fin}${del}`;
    }
    return `<div class="alu ${u.state}"><span class="aln">${esc(it.label)}</span>${status}<span class="alc">${ctl}</span></div>`;
  }

  function detail(S, a) {
    const today = P.today(), st = P.allocStats(S, a, today), i = S.allocs.indexOf(a), b = `allocs.${i}`;
    const U = P.allocUnits(S, a), pct = st.total ? Math.round(st.done / st.total * 100) : 0, per = A.ui.allocPer || 0;
    const eta = st.last ? `배정된 마지막 날 ${h.md(st.last)}${a.due ? (st.late ? ` · <b class="bad">마감(${h.md(a.due)})보다 늦어요</b>` : ` · 마감(${h.md(a.due)}) 안에 끝나요`) : ''}` : '';
    const spread = st.waiting ? `<section class="grp"><h3>자동 나눠주기 <small>대기 중인 ${st.waiting}개를 ${a.due ? `마감(${h.md(a.due)})까지` : '앞으로 2주 안에'} 공부 시간이 있는 날에 나눠요</small></h3>
        <div class="fl">${h.seg('ui.allocPer', per, [[0, '자동'], [1, '하루 1개'], [2, '하루 2개'], [3, '하루 3개']], 'int')}<button class="btn primary" data-action="allocspread" data-id="${esc(a.id)}">대기 ${st.waiting}개 배정하기</button></div>
        <div class="hint">배정한 뒤에 달력에서 끌어 옮기거나, 아래 목록에서 날짜를 바꿔 고칠 수 있어요.</div></section>` : '';
    return `<div class="panel detail">
      <div class="dh"><i class="dot big" style="background:${a.color}"></i><h2>${esc(a.title)}</h2><button class="btn sm ghost danger" data-action="aldel" data-id="${esc(a.id)}">삭제</button></div>
      <div class="prog"><i style="width:${pct}%;background:${a.color}"></i></div>
      <div class="hint">완료 ${st.done} · 배정 ${st.assigned}${st.overdue ? ` (밀린 ${st.overdue})` : ''} · 대기 ${st.waiting} / 전체 ${st.total}${st.min ? ` · 남은 ${h.fmtMin(st.min)}` : ''}</div>
      ${eta ? `<div class="hint">${eta}</div>` : ''}
      ${spread}
      <section class="grp"><h3>항목 <small>${st.total}개 · 날짜를 고르면 배정, 달력에서 끌어도 돼요</small></h3>
        <div class="allist">${U.map(u => unitRow(a, u, today)).join('')}</div>
        <div class="fl"><input type="text" id="al-more" data-enter="al-more-btn" maxlength="40" placeholder="항목 추가 (비우면 다음 번호)"><button class="btn" id="al-more-btn" data-action="aladd" data-id="${esc(a.id)}">추가</button></div></section>
      <section class="grp"><h3>설정</h3>
        <div class="fl"><label>이름<input type="text" data-bind="${b}.title" data-render="1" value="${esc(a.title)}" style="min-width:14rem"></label>
          <label>마감 <small class="muted">(선택)</small><input type="date" data-bind="${b}.due" data-render="1" value="${esc(a.due || '')}"></label></div>
        ${row('한 개당 시간', '새로 배정할 때 잡히는 길이 (이미 배정된 것도 같이 바뀌어요)', `<span class="stp"><button type="button" data-action="almin" data-id="${esc(a.id)}" data-d="-5">−</button><input type="number" value="${a.min}" readonly><em>분</em><button type="button" data-action="almin" data-id="${esc(a.id)}" data-d="5">＋</button></span>`)}
        <div class="fl"><span class="muted small">색</span>${h.swatches(`${b}.color`, a.color)}</div></section></div>`;
  }

  function newForm(S) {
    const f = A.ui.allocForm || (A.ui.allocForm = { mode: 'num', from: 1, to: 10, min: 40, due: '', title: '', prefix: '', list: '', color: P.COLORS[S.allocs.length % P.COLORS.length] });
    return `<div class="panel detail"><div class="dh"><h2>할당 만들기</h2></div>
      <div class="hint">번호가 있는 묶음(예: WS 1~10)이나 이름이 제각각인 세트 목록(예: R&amp;W 세트들)을 만들어 두고, 달력에서 날짜에 하나씩 배정해요.</div>
      <section class="grp"><div class="fl"><label class="wide">이름<input type="text" id="al-title" data-bind="ui.allocForm.title" maxlength="40" value="${esc(f.title)}" placeholder="예: 단어 WS, R&amp;W 문제집"></label></div>
        <div class="fl">${h.seg('ui.allocForm.mode', f.mode, [['num', '번호 묶음'], ['list', '이름 목록']])}</div>
        ${f.mode === 'num'
    ? `<div class="fl"><label>이름표 앞글자 <small>(비우면 이름을 써요)</small><input type="text" id="al-prefix" data-bind="ui.allocForm.prefix" maxlength="20" value="${esc(f.prefix)}" placeholder="예: WS"></label></div>
        ${row('번호 범위', '예: 1 ~ 10', `<span class="rng">${h.step('ui.allocForm.from', f.from, { step: 1, min: 1, max: 500, unit: '번' })}<span class="muted">~</span>${h.step('ui.allocForm.to', f.to, { step: 1, min: 1, max: 500, unit: '번' })}</span>`)}`
    : `<div class="fl"><label class="wide">목록 <small>(한 줄에 하나씩)</small><textarea id="al-list" data-bind="ui.allocForm.list" rows="7" placeholder="Module 1 Easy&#10;Module 1 Hard&#10;Module 2 Easy">${esc(f.list)}</textarea></label></div>`}</section>
      <section class="grp">${row('한 개당 시간', '배정하면 기본으로 잡히는 길이', h.step('ui.allocForm.min', f.min, { step: 5, min: 5, max: 240, unit: '분' }))}
        <div class="fl"><label>마감 <small>(선택)</small><input type="date" data-bind="ui.allocForm.due" value="${esc(f.due)}"></label></div>
        <div class="fl"><span class="muted small">색</span>${h.swatches('ui.allocForm.color', f.color)}</div></section>
      <button class="btn primary" data-action="alcreate">만들기</button></div>`;
  }

  A.views.alloc = function (S) {
    const k = selKey(S);
    const body = k === 'new' ? newForm(S) : detail(S, S.allocs.find(a => a.id === k));
    return `<div class="md"><nav class="navlist">${nav(S, k)}</nav><section class="mdmain">${body}</section></div>`;
  };

  // ---------- 액션 ----------
  Ac.alsel = el => { A.ui.allocSel = el.dataset.id; if (el.dataset.id === 'new') A.ui.allocForm = null; A.render(); window.scrollTo(0, 0); };
  Ac.alopen = el => { A.ui.allocSel = el.dataset.id; A.setTab('alloc'); };

  Ac.alcreate = () => {
    const S = A.S, f = A.ui.allocForm;
    if (!f) return;
    const title = h.val('al-title').trim();
    if (!title) { A.toast('이름을 적어 주세요', true); return; }
    let labels = [];
    if (f.mode === 'list') labels = h.val('al-list').split('\n').map(x => x.trim()).filter(Boolean);
    else {
      const from = +f.from, to = +f.to, pre = h.val('al-prefix'), base = pre.trim() ? pre : title + ' ';
      if (!(to >= from)) { A.toast('번호 범위를 확인해 주세요 (끝 번호가 시작보다 작아요)', true); return; }
      for (let n = from; n <= to; n++) labels.push(`${base}${/\s$/.test(base) ? '' : ' '}${n}`.trim());
    }
    if (!labels.length) { A.toast('항목이 하나도 없어요', true); return; }
    if (labels.length > 200) { A.toast('한 번에 200개까지만 만들 수 있어요', true); return; }
    const min = Math.max(5, +f.min || 40);
    const a = { id: newId(), title, color: f.color, min, due: f.due || '', items: labels.map((label, i) => ({ id: String(i + 1), label, min, done: false })) };
    S.allocs.push(a);
    A.ui.allocSel = a.id; A.ui.allocForm = null;
    A.save(); A.render();
    A.toast(`${title} ${labels.length}개를 만들었어요. 달력에서 날짜로 끌어 배정하세요`);
  };

  Ac.aldel = el => {
    const S = A.S, i = S.allocs.findIndex(a => a.id === el.dataset.id), a = S.allocs[i];
    if (!a || !window.confirm(`‘${a.title}’ 할당을 지울까요? 배정된 일정도 같이 지워져요 (이미 끝낸 기록은 남아요).`)) return;
    S.custom = S.custom.filter(c => !(c.alloc && c.alloc.a === a.id && !c.done));
    S.allocs.splice(i, 1);
    A.ui.allocSel = null;
    A.save(); A.render();
  };

  Ac.almin = el => {
    const a = A.S.allocs.find(x => x.id === el.dataset.id);
    if (!a) return;
    const old = a.min, nw = Math.max(5, Math.min(240, old + +el.dataset.d));
    if (nw === old) return;
    a.min = nw;
    for (const it of a.items) if (!it.done && it.min === old) it.min = nw;                       // 직접 길이를 바꾼 건 그대로 둔다
    for (const c of A.S.custom) if (c.alloc && c.alloc.a === a.id && !c.done && c.dur === old) c.dur = nw;
    A.save(); A.render();
  };

  Ac.aladd = el => {
    const a = A.S.allocs.find(x => x.id === el.dataset.id);
    if (!a) return;
    let label = h.val('al-more').trim();
    if (!label) {                                                                                 // 마지막 항목 이름의 끝 번호를 하나 올린다
      const last = a.items.length ? a.items[a.items.length - 1].label : '', m = /^(.*?)(\d+)\s*$/.exec(last);
      label = m ? `${m[1]}${+m[2] + 1}` : `${a.title} ${a.items.length + 1}`;
    }
    const id = String(a.items.reduce((mx, x) => Math.max(mx, +x.id || 0), 0) + 1);
    a.items.push({ id, label, min: a.min, done: false });
    A.save(); A.render();
    const n = document.getElementById('al-more'); if (n) n.focus();
  };

  Ac.aldelitem = el => {
    const S = A.S, a = S.allocs.find(x => x.id === el.dataset.id), i = a ? a.items.findIndex(x => x.id === el.dataset.i) : -1;
    if (i < 0) return;
    const it = a.items.splice(i, 1)[0], removed = S.custom.filter(c => c.alloc && c.alloc.a === a.id && c.alloc.i === it.id && !c.done);
    S.custom = S.custom.filter(c => !removed.includes(c));
    A.save(); A.render();
    A.toast(`지웠어요 · ${it.label}`, false, { fn: () => { a.items.splice(Math.min(i, a.items.length), 0, it); S.custom.push(...removed); A.save(); A.render(); } });
  };

  Ac.alunassign = el => {
    const S = A.S, i = S.custom.findIndex(c => c.alloc && c.alloc.a === el.dataset.id && c.alloc.i === el.dataset.i && !c.done);
    if (i < 0) return;
    const c = S.custom.splice(i, 1)[0];
    A.save(); A.render();
    A.toast(`배정을 풀었어요 · ${c.title}`, false, { fn: () => { S.custom.push(c); A.save(); A.render(); } });
  };

  // 이미 했던 것을 완료로 표시 / 되돌리기
  Ac.alfin = el => {
    const S = A.S, a = S.allocs.find(x => x.id === el.dataset.id), it = a && a.items.find(x => x.id === el.dataset.i);
    if (!it) return;
