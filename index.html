<style>
:root {

}
/* 화면 모드: 기본은 시스템(Windows 설정)을 따르고, 앱의 버튼으로 data-theme 를 라이트/다크로 고정할 수 있다 */

    --brand: #8c94ff; --brand-soft: #232846; --brand-ink: #0e1117;
    --ok: #4ade80; --ok-soft: #12301f; --warn: #fbbf24; --warn-soft: #352a10; --bad: #f87171; --bad-soft: #3a1a1a;

  }
}
:root[data-theme="dark"] {

  --brand: #8c94ff; --brand-soft: #232846; --brand-ink: #0e1117;
  --ok: #4ade80; --ok-soft: #12301f; --warn: #fbbf24; --warn-soft: #352a10; --bad: #f87171; --bad-soft: #3a1a1a;
  --shadow: none;
}
* { box-sizing: border-box; }
html { color-scheme: light dark; }

:root[data-theme="dark"] { color-scheme: dark; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: calc(var(--fs) * var(--fscale, 1))/1.55 var(--font); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
main.wrap { padding-top: 16px; padding-bottom: 80px; }
h2 { font-size: 16px; margin: 0 0 10px; }

/* header */

.blk { display: flex; align-items: center; gap: 8px; margin: 6px 0; }

/* cards in today */
.item { border-left: 4px solid var(--c, #64748b); }
.item.running { box-shadow: 0 0 0 2px var(--brand); }
.item .head { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; }
.item .title { font-weight: 700; font-size: 15.5px; }

.tag { font-size: 11px; font-weight: 700; background: var(--brand-soft); color: var(--brand); padding: 0 6px; border-radius: 6px; flex: none; }
details { margin: 4px 0; } summary { cursor: pointer; font-size: 13.5px; color: var(--muted); font-weight: 600; }
details ul { margin: 4px 0 4px 4px; padding-left: 18px; font-size: 14px; }
.finish { margin-top: 8px; padding: 8px 10px; background: var(--bg); border-radius: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

.donelist .r:last-child { border: 0; }

.ms:last-child { border: 0; }

.fields input:not([type=checkbox]), .fields select { width: 100%; }

.ch { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.ch input[type=text] { flex: 1; }
.ch .done { text-decoration: line-through; color: var(--muted); }

.tbl th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; padding: 4px 6px; white-space: nowrap; }

.tbl input[type=text], .tbl input:not([type]), .tbl select { width: 100%; min-width: 70px; }

.tbl input[type=color] { width: 30px; height: 26px; padding: 0; border: 0; background: none; }
.scroll { overflow-x: auto; }
.load { cursor: pointer; } .load:hover td { background: var(--brand-soft); }
.lbar { position: relative; height: 14px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); min-width: 160px; overflow: hidden; display: flex; }
.lbar i { height: 100%; display: block; }

.wk { color: var(--bad); } .sat { color: #2563eb; }

#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); background: #1f2937; color: #fff; padding: 9px 16px; border-radius: 10px; opacity: 0; pointer-events: none; transition: .2s; font-size: 14px; z-index: 50; max-width: 90vw; }

<style>
/* layout.css — 좌우 분할 · 타임라인 · 캘린더 (style.css 뒤에 로드되어 덮어씀) */
.wrap { max-width: 1320px; padding: 0 20px; }
.single { max-width: 1040px; margin: 0 auto; }
h1 { letter-spacing: -.02em; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(390px, 480px); gap: 24px; align-items: start; }
.cal-split { grid-template-columns: minmax(0, 1.6fr) minmax(370px, 1fr); }
.pane-r { position: sticky; top: 78px; }
@media (max-width: 1000px) { .split, .cal-split { grid-template-columns: minmax(0, 1fr); } .pane-r { position: static; } .wrap { padding: 0 12px; } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
.ph { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.ph h2 { margin: 0; font-size: 17px; display: flex; gap: 8px; align-items: center; }
.ph .btn { margin-left: auto; }
.tlwrap { max-height: calc(100vh - 230px); overflow-y: auto; margin-top: 10px; padding: 8px 2px 8px 0; }

.dayhead h1 { font-size: 30px; margin: 0 0 6px; line-height: 1.2; }
.dayhead h1 span { color: var(--muted); font-weight: 500; font-size: 20px; }
.stats { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 26px; margin: 14px 0 16px; }
.stats > div { display: flex; flex-direction: column; }
.stats span { font-size: 12px; color: var(--muted); }

/* 왼쪽 할 일 목록 */
.list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }

.ri-main { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.ri-t { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.tbtn:hover { border-color: var(--brand); color: var(--brand); }
.tbtn.run { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.ri-b { padding: 2px 14px 12px 52px; border-top: 1px dashed var(--line); }

.empty { background: var(--card); border: 1px dashed var(--line); border-radius: 12px; }

/* 오른쪽 시간대별 타임라인 */

.tb { position: absolute; left: 5px; right: 5px; border-radius: 9px; border-left: 4px solid var(--c); background: var(--cb); padding: 3px 9px 4px; overflow: hidden; z-index: 2; touch-action: none; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }

.more { font-size: 11px; color: var(--muted); }
.ln { display: flex; align-items: center; gap: 5px; font-size: 12px; line-height: 1.3; min-width: 0; }

.ln em { font-style: normal; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ln b { font-weight: 600; color: var(--muted); font-size: 11px; white-space: nowrap; }
.ln.rv em { color: var(--muted); }
.cell .ft { margin-top: auto; display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; }
.cell .ft b { font-size: 13px; }
.mini { display: flex; height: 5px; border-radius: 3px; background: var(--bg); overflow: hidden; }
.mini i { display: block; height: 100%; }
.k-rev { background: #3b82f6; } .k-exam { background: #6366f1; } .k-task { background: #f59e0b; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; font-size: 12.5px; align-items: center; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.mini-list { display: flex; flex-direction: column; gap: 4px; margin: 6px 0 8px; }
.mi { display: flex; align-items: center; gap: 8px; padding: 6px 9px; border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 9px; background: var(--card); cursor: pointer; text-align: left; font: inherit; color: inherit; }
.mi.sel { outline: 2px solid var(--brand); outline-offset: -1px; }
.mi .mt { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mi .mm { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 760px) {
  .cell { min-height: 74px; padding: 5px; }
  .cell .ln em, .cell .ln b, .cell .more, .cell .ft b { display: none; }
  .cell .lns { flex-direction: row; flex-wrap: wrap; gap: 3px; }
  .cell .ev { font-size: 10px; padding: 0 4px; }
  .dayhead h1 { font-size: 24px; }
  .ri-b { padding-left: 14px; }
}

/* 짧은 블록은 제목과 시간을 한 줄로 */
.tb.sm { display: flex; align-items: center; gap: 8px; padding-top: 0; padding-bottom: 0; }
.tb.sm .tt { flex: 0 1 auto; min-width: 0; }
.tb.sm .tm { flex: none; }
.tb.sm .rz { height: 6px; }
.tb.sm .rz::after { bottom: 1px; height: 2px; }
.tb.sm.pin .tt::after { content: ""; }

/* ================= 설정 · 시험과제: 목록에서 골라 들어가는 구조 ================= */
.md { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px; align-items: start; }

.navlist { position: sticky; top: 78px; display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 100px); overflow: auto; padding-right: 4px; }
.navgroup { font-size: 12px; font-weight: 700; color: var(--muted); margin: 14px 8px 4px; }
.navgroup:first-child { margin-top: 0; }
.navi { display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: 10px; border: 0; background: none; text-align: left; cursor: pointer; font: inherit; color: inherit; }
.navi:hover { background: var(--card); }
.navi.on { background: var(--brand-soft); color: var(--brand); font-weight: 700; }
.navi small { margin-left: auto; color: var(--muted); font-size: 11.5px; font-weight: 500; }
.navi.add { color: var(--brand); font-weight: 600; }
.navi.li { flex-wrap: wrap; row-gap: 3px; }
.navi.li .lt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.navi.li small { flex-basis: 100%; margin: 0 0 0 19px; }
.mprog { flex-basis: 100%; height: 4px; background: var(--line); border-radius: 3px; margin-left: 19px; overflow: hidden; }
.mprog i { display: block; height: 100%; background: var(--brand); border-radius: 3px; }
.detail .dh { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.dh h2 { margin: 0; font-size: 21px; flex: 1; }
.dot.big { width: 16px; height: 16px; }
.btn.danger:hover { color: var(--bad); border-color: var(--bad); }
.grp { border-top: 1px solid var(--line); padding: 16px 0 6px; margin-top: 14px; }
.grp h3 { margin: 0 0 8px; font-size: 14.5px; color: var(--ink); font-weight: 700; }
.grp h3 small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.fl { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 18px; margin: 8px 0; }
.fl label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); }
.fl label.wide { flex: 1; min-width: 260px; }
.fl label.wide input { width: 100%; }
.swrow { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-bottom: 1px dashed var(--line); }
.swrow:last-child { border-bottom: 0; }
.swt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.swt b { font-size: 14.5px; }
.swt small { color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.sw { position: relative; flex: none; width: 46px; height: 26px; }
.sw input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
.sw i { position: absolute; inset: 0; background: var(--line); border-radius: 99px; transition: .15s; }
.sw i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
.sw input:checked + i { background: var(--brand); }
.sw input:checked + i::after { left: 23px; }
.stp { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); flex: none; }
.stp button { width: 36px; height: 36px; border: 0; background: var(--bg); cursor: pointer; font-size: 18px; color: var(--ink); }
.stp button:hover { background: var(--brand-soft); color: var(--brand); }
.stp input { width: 4rem; border: 0; text-align: center; border-radius: 0; padding: 6px 2px; font-weight: 700; background: transparent; -moz-appearance: textfield; appearance: textfield; }
.stp input::-webkit-outer-spin-button, .stp input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.stp input:focus { outline: none; background: var(--brand-soft); }
.stp em { font-style: normal; color: var(--muted); font-size: 12.5px; padding-right: 10px; margin-left: -2px; white-space: nowrap; }
.segb { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
.segb button { border: 0; background: var(--card); padding: 8px 15px; cursor: pointer; font-weight: 600; color: var(--muted); }
.segb button + button { border-left: 1px solid var(--line); }
.segb button.on { background: var(--brand); color: var(--brand-ink); }
.swatches { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 2px; }
.swatches button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
.swatches button.on { outline: 2px solid var(--ink); outline-offset: 2px; }
.daybar { position: relative; height: 18px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; margin: 4px 0 24px; }
.daybar i { position: absolute; top: 0; bottom: 0; background: var(--brand); opacity: .75; border-radius: 5px; }
.daybar span { position: absolute; top: 21px; transform: translateX(-50%); font-size: 11px; color: var(--muted); }
.tr { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.tsel { padding: 7px 8px; min-width: 7.2rem; }
table.tt select { width: 100%; min-width: 92px; border-width: 2px; padding: 8px 6px; }
.fix input[type=text] { width: 10rem; }
.detail textarea { margin: 6px 0; }
.detail .ch { margin: 4px 0; }
.detail .prog { margin: 10px 0 4px; }

/* 좁은 화면: 왼쪽 목록은 가로로 넘기는 칩 줄이 된다 */
@media (max-width: 900px) {
  .md { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .navlist { position: static; max-height: none; flex-direction: row; gap: 6px; overflow-x: auto; overflow-y: hidden; padding: 0 0 8px; margin: 0 -2px; scrollbar-width: thin; }
  .navgroup { display: none; }
  .navi, .navi.li { flex: none; flex-wrap: nowrap; padding: 7px 13px; background: var(--card); border: 1px solid var(--line); border-radius: 99px; white-space: nowrap; }
  .navi.on { border-color: var(--brand); }
  .navi small, .mprog { display: none; }
  .navi.li .lt { overflow: visible; }
  .panel { padding: 14px; }
  .dh h2 { font-size: 18px; }
  .swrow { flex-wrap: wrap; }
  .fl label.wide { min-width: 0; flex-basis: 100%; }
}

/* 아주 좁은 화면(폰): 상단 바를 한 줄로 */
.wrap.bar { min-width: 0; }
@media (max-width: 640px) {
  #top .bar { gap: 6px; height: 50px; }
  .brand { font-size: 14px; }
  .dd, #savestate { display: none; }
  nav { margin-left: auto; }
  .tab { padding: 7px 8px; font-size: 13px; white-space: nowrap; }
  .wrap { padding: 0 10px; }
  main.wrap { padding-top: 12px; }
  .dayhead h1 { font-size: 24px; }
  .stats { gap: 8px 16px; }
  .calhead h1 { font-size: 22px; }
  .detail .ch { flex-wrap: wrap; }
}

@media (max-width: 640px) { .tr > span:last-child { display: none; } .tsel { min-width: 6rem; } }

/* ===== v3: 시간표 블록 다듬기 + 하루 일정 추가/삭제 ===== */
.tl { background-image: repeating-linear-gradient(135deg, transparent 0 7px, rgba(128, 128, 128, .13) 7px 8px); border-radius: 6px; }
.tl .av { background: var(--card); opacity: 1; border-radius: 0; box-shadow: inset 2px 0 0 var(--brand-soft); }
.tb { background: linear-gradient(var(--cb), var(--cb)), var(--card); }
.tb.job { background-image: repeating-linear-gradient(135deg, rgba(255, 255, 255, .0) 0 6px, rgba(128, 128, 128, .16) 6px 7px), linear-gradient(var(--cb), var(--cb)); background-color: var(--card); }
.tb.cu-event { background-image: repeating-linear-gradient(45deg, rgba(128, 128, 128, .18) 0 5px, transparent 5px 10px); background-color: var(--card); border-left-color: #64748b; }
.tb.cu-todo { border-left-style: dashed; }
.tb .rz { opacity: 0; transition: opacity .12s; }
.tb:hover .rz, .tb.sel .rz, .tb.drag .rz { opacity: 1; }
.tb.sm .rz { display: none; }
.tb.sm:hover .rz, .tb.sm.sel .rz { display: block; }
.tools { display: none; position: absolute; right: 5px; top: 3px; gap: 4px; z-index: 3; }
.tb:hover .tools, .tb.sel .tools { display: inline-flex; }
.tools button { border: 0; border-radius: 6px; padding: 1px 7px; font-size: 10.5px; background: var(--card); color: var(--muted); cursor: pointer; box-shadow: 0 0 0 1px var(--line); }
.tools button:hover { color: var(--brand); }
.tools button.del:hover { color: var(--bad); }
.tlwrap { scrollbar-width: thin; }
.tltools { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 8px; }
.addform { margin: 8px 0 12px; padding: 12px; background: var(--bg); border-radius: 12px; }
.skipped { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0 10px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 3px 10px; font-size: 12px; cursor: pointer; color: inherit; }
.chip:hover { border-color: var(--brand); }
.tlleg { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.tlleg i.lg { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -2px; border: 1px solid var(--line); }
.tlleg i.lg.rv { background: rgba(79, 70, 229, .25); }
.tlleg i.lg.job { background-image: repeating-linear-gradient(135deg, transparent 0 3px, rgba(128, 128, 128, .5) 3px 4px); background-color: rgba(79, 70, 229, .15); }
.tlleg i.lg.ev { background-image: repeating-linear-gradient(45deg, rgba(128, 128, 128, .5) 0 3px, transparent 3px 6px); }
.ck-sp { width: 30px; flex: none; }

/* 상단 메뉴용 nav 스타일이 왼쪽 목록(nav.navlist)에 새어 들어가지 않게 */
nav.navlist { margin-left: 0; width: auto; }


/* ===== v4: 과목 블록(복습·예습·시험 대비 통합), 캘린더 드래그 ===== */
.tb .tp { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb.sm .tp { display: none; }
.part { padding: 8px 0 4px; border-top: 1px dashed var(--line); }
.part:first-of-type { border-top: 0; }
.part-h { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.part-h small { color: var(--muted); }
.part-h .btn { margin-left: auto; }
.cell:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
.ln[data-drag], .ev[data-drag] { cursor: grab; }
.ln[data-drag]:hover, .ev[data-drag]:hover { background: var(--brand-soft); border-radius: 6px; }
.dragging { opacity: .4; }
.cell.dropok { outline: 2px dashed var(--brand); outline-offset: -2px; background: var(--brand-soft); }


/* 루틴: 요일 칩 */
.dchips { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 10px; }
.dchip { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 700; color: var(--muted); }
.dchip:hover { border-color: var(--brand); }
.dchip.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }


/* 주간 루틴표 */
.weekgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; margin: 10px 0; }
.wcol { min-height: 190px; border: 1px dashed var(--line); border-radius: 12px; padding: 8px; background: var(--card); display: flex; flex-direction: column; gap: 4px; }
.wcol.heavy { border-color: var(--bad); background: var(--bad-soft); }
.wcol.dropok, .wpal.dropok { outline: 2px dashed var(--brand); outline-offset: -2px; background: var(--brand-soft); }
.wh { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; }
.wh small { color: var(--muted); font-size: 11.5px; }
.wchip { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 9px; border: 1px solid var(--line); border-left: 4px solid var(--c); background: var(--card); cursor: grab; font-size: 12.5px; user-select: none; }
.wchip:hover { border-color: var(--brand); border-left-color: var(--c); }
.wchip.off { opacity: .5; }
.wchip .wt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; cursor: pointer; }
.wchip b { color: var(--muted); font-weight: 600; font-size: 11.5px; white-space: nowrap; }
.wchip .x { padding: 0 4px; cursor: pointer; }
.wadd { margin-top: auto; text-align: center; font-size: 12px; color: var(--brand); cursor: pointer; padding: 5px; border-radius: 8px; }
.wadd:hover { background: var(--brand-soft); }
.wpick { display: flex; flex-wrap: wrap; gap: 4px; padding-top: 4px; }
.wpal { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; border: 1px dashed var(--line); border-radius: 12px; min-height: 52px; }
.wpal .wchip { min-width: 150px; }


/* 탭이 6개라 아주 좁은 화면에서는 제목을 숨겨 한 줄에 맞춘다 */
@media (max-width: 640px) {
  .brand { display: none; }
  nav { margin: 0 auto; }
  .tab { padding: 7px 7px; }
}


/* ===== 루틴 탭: 시간축 주간 시간표 ===== */
.rt-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.rt-top h2 { margin: 0; font-size: 19px; flex: 1; }
.rt-btns { display: flex; gap: 6px; }
.wkscroll { overflow-x: auto; padding-bottom: 6px; }
.wk { min-width: 640px; }
.wk-row, .wk-body { display: grid; grid-template-columns: 46px repeat(7, minmax(0, 1fr)); gap: 4px; }
.wk-head { position: sticky; top: 0; }
.wk-dh { text-align: center; padding: 4px 0; border-radius: 8px; background: var(--card); border: 1px solid var(--line); }
.wk-dh b { display: block; font-size: 14px; }
.wk-dh small { color: var(--muted); font-size: 11px; }
.wk-dh.sun b { color: var(--bad); } .wk-dh.sat b { color: #2563eb; }
.wk-un { margin: 4px 0; align-items: stretch; }
.wk-lab { font-size: 10.5px; color: var(--muted); text-align: right; padding-right: 4px; line-height: 1.2; align-self: center; }
.wk-ucol { min-height: 40px; border: 1px dashed var(--line); border-radius: 8px; padding: 3px; display: flex; flex-direction: column; gap: 3px; background: var(--card); }
.wu { display: flex; align-items: center; gap: 4px; padding: 3px 6px; border-radius: 7px; border: 1px solid var(--line); border-left: 4px solid var(--c); background: var(--card); font-size: 11.5px; cursor: grab; touch-action: none; user-select: none; }
.wu span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.wu b { color: var(--muted); font-weight: 600; font-size: 10.5px; }
.wu.sel { outline: 2px solid var(--brand); }
.wk-wrap { max-height: calc(100vh - 290px); overflow-y: auto; border-radius: 8px; scrollbar-width: thin; }
@media (max-width: 1000px) { .wk-wrap { max-height: 70vh; } }
.wk-hours { position: relative; }
.wk-hours span { position: absolute; right: 4px; transform: translateY(-50%); font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.wk-col { position: relative; border-radius: 8px; background-image: repeating-linear-gradient(135deg, transparent 0 7px, rgba(128, 128, 128, .13) 7px 8px); overflow: hidden; }
.wk-av { position: absolute; left: 0; right: 0; background: var(--card); box-shadow: inset 2px 0 0 var(--brand-soft); }
.wk-hr { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
.wb { position: absolute; left: 2px; right: 2px; border-radius: 7px; border-left: 4px solid var(--c); background: linear-gradient(var(--cb), var(--cb)), var(--card); padding: 2px 6px; overflow: hidden; cursor: grab; touch-action: none; user-select: none; box-shadow: 0 1px 2px rgba(0, 0, 0, .1); z-index: 2; }
.wb .tt { font-weight: 700; font-size: 11.5px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wb .tm { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wb .tp { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wb.sm .tm, .wb.sm .tp { display: none; }
.wb.sel { outline: 2px solid var(--brand); z-index: 3; }
.wb .wrz { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; cursor: ns-resize; opacity: 0; }
.wb .wrz::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 20px; height: 3px; margin-left: -10px; border-radius: 2px; background: var(--ink); opacity: .35; }
.wb:hover .wrz, .wb.sel .wrz { opacity: 1; }
.wb.drag, .wu.drag { z-index: 20; pointer-events: none; box-shadow: 0 8px 22px rgba(0, 0, 0, .3); opacity: .92; }


.dchip.static { cursor: default; width: auto; min-width: 42px; padding: 0 10px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; }


/* 시각 미정 칸이 길어지면 안에서 스크롤 (복습이 많아도 표가 밀려 내려가지 않게) */
.wk-un { max-height: 132px; overflow-y: auto; scrollbar-width: thin; }
.wk-ucol { align-content: flex-start; }


/* 1자습·2자습 간단 이동 키 */
.sess { display: inline-flex; gap: 3px; flex: none; align-items: center; }
.sk { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 2px 8px; font-size: 11px; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap; line-height: 1.5; }
.sk:hover { border-color: var(--brand); color: var(--brand); }
.sk.on { background: var(--brand-soft); color: var(--brand); border-color: var(--brand); }
.ri-h .sess { margin-left: 2px; }
.tools .sess { margin-right: 2px; }
.tools .sk { padding: 0 6px; font-size: 10.5px; box-shadow: none; }
.fl .sess { align-self: flex-end; margin-bottom: 6px; }

.rt-hint { font-size: 12.5px; color: var(--muted); margin: -2px 0 8px; }

/* 토스트에 붙는 되돌리기 버튼 */
#toast.act { pointer-events: auto; }
.toast-undo { margin-left: 12px; border: 1px solid rgba(255,255,255,.5); background: transparent; color: #fff; border-radius: 99px; padding: 2px 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
.toast-undo:hover { background: rgba(255,255,255,.18); }

/* ---------- 홈: 다가오는 일정(D-day) ---------- */
.home-split { grid-template-columns: minmax(0, 1fr) minmax(300px, 390px); }
.home-filter { margin: 6px 0 12px; overflow-x: auto; }
.uplist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
.up { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--c, var(--line)); border-radius: 14px; padding: 10px 14px 10px 10px; cursor: pointer; box-shadow: var(--shadow); }
.up:hover { border-color: var(--brand); border-left-color: var(--c, var(--brand)); }
.up.imp { --c: var(--brand); }

<script>window.__STANDALONE__ = true; window.__PROMPTS__ = {"note": "첨부한 수업 녹취 노트(다글로 txt)를 읽고, 아래 [출력 양식]으로만 출력해줘.\n양식 밖의 설명·인사말은 쓰지 말고, 결과 전체를 코드블록(```) 하나로 감싸서 줘.\n\n[규칙]\n1. 과목과 날짜는 파일명에서 읽어. (예: \"2026. 9. 7. AP 미시경제.txt\" → 과목: AP 미시경제 / 날짜: 2026-09-07) 파일명에 없으면 비워둬.\n2. 녹취에는 수업과 무관한 잡담, 출석·공지, 음성 인식 오류가 섞여 있어. 수업 내용만 정리해.\n3. 문맥상 인식 오류가 의심되는 용어는 올바른 용어로 고치되, 뒤에 [확인필요]를 붙여.\n4. 녹취에 없는 내용은 만들지 마. 교재 쪽수·문제 번호도 선생님이 직접 말한 것만 써.\n5. \"복습 체크리스트\"는 실제로 해야 할 행동 단위로 3~8개. 항목 맨 앞에 [개념] [암기] [문제] [이해] [심화] 중 하나를 붙이고, 끝에 예상 시간 (N분)을 붙여.\n6. \"예습 체크리스트\"는 선생님이 다음 수업 범위·숙제·준비물을 말한 경우에만 써. 없으면 \"- (없음)\" 한 줄만 써.\n7. \"헷갈린 부분\"은 선생님이 반복해서 강조했거나, 학생이 질문했거나, 설명이 번복·모호했던 지점이야.\n\n[출력 양식]\n=== 복습노트 ===\n과목: <과목명>\n날짜: <YYYY-MM-DD>\n## 요약\n- <수업 흐름 3~6줄>\n## 핵심 개념\n- <용어>: <한 줄 설명>\n## 복습 체크리스트\n- [ ] [개념] <할 일> (5분)\n- [ ] [문제] <할 일> (15분)\n## 헷갈린 부분\n- <내용>\n## 예습 체크리스트\n- [ ] <할 일> (10분)\n=== 끝 ===\n", "task": "아래 공지문·안내(대회, 과제, 프로젝트)를 읽고, [출력 양식]으로만 출력해줘.\n양식 밖의 설명·인사말은 쓰지 말고, 결과 전체를 코드블록(```) 하나로 감싸서 줘.\n\n[규칙]\n1. 마감일은 YYYY-MM-DD로 써. 공지에 없으면 비워둬. 마감 시각이 있으면 제목 뒤에 괄호로 적어.\n2. 예상시간은 \"고등학생 한 명이 혼자 한다\"고 가정한 현실적인 총 소요 시간이야. 반드시 \"N시간\" 또는 \"N분\"으로 단위를 붙여. 공지에 시간이 없으면 일반적인 작업량으로 추정해서 써.\n3. 쪼개기: 여러 날에 나눠 해도 되면 \"가능\", 한 번에 몰아서 해야 하면 \"불가\".\n4. 중요도: 상 / 중 / 하 중 하나.\n5. \"세부\"는 단계별 할 일 3~8개. 각 항목 끝에 (N분) 또는 (N시간)을 붙여.\n6. 공지에 없는 내용은 만들지 마.\n\n[출력 양식]\n=== 할일 ===\n제목: <이름>\n마감: <YYYY-MM-DD>\n예상시간: <N시간>\n쪼개기: <가능|불가>\n중요도: <상|중|하>\n## 세부\n- [ ] <할 일> (2시간)\n- [ ] <할 일> (90분)\n=== 끝 ===\n"};</script>
<script>
/* 기말 플래너 — 계획 엔진 (순수 함수, 브라우저/Node 공용)
 *
 * 흐름: 상태(S) → jobs(시험·과제) + 필수 항목(복습·예습) → 일별 시뮬레이션 → 타임라인 배치
 */
(function (root) {
  'use strict';
  const P = {};
  const FRONT = 1.2; // 마감까지 균등 배분량의 120%를 앞당겨 배정해 여유를 만든다
  const pad = n => String(n).padStart(2, '0');

  // ---------- 날짜 / 시간 ----------
  P.pad = pad;
  P.DOW = ['일', '월', '화', '수', '목', '금', '토'];
  P.fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  P.parse = s => { const a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2], 12); };
  P.addDays = (s, n) => { const d = P.parse(s); d.setDate(d.getDate() + n); return P.fmt(d); };
  P.diffDays = (a, b) => Math.round((P.parse(b) - P.parse(a)) / 864e5);
  P.dow = s => P.parse(s).getDay();
  // 공부하는 하루는 새벽 2시에 바뀐다: 자정~2시는 아직 ‘어제’의 연장이고(시각은 24:00~26:00), 가용 시간·일정도 26:00(= 새벽 2시)까지 정할 수 있다
  P.DAY_ROLL = 120;          // 날짜가 바뀌는 시각(분) = 새벽 2시
  P.DAY_END = 26 * 60;       // 하루의 끝(분) = 다음날 새벽 2시
  P.today = () => P.fmt(new Date(Date.now() - P.DAY_ROLL * 60000));
  P.nowMin = () => { const d = new Date(), m = d.getHours() * 60 + d.getMinutes(); return m < P.DAY_ROLL ? m + 1440 : m; };
  P.toMin = hm => { const m = /^(\d{1,2}):(\d{2})$/.exec(hm || ''); return m ? +m[1] * 60 + +m[2] : NaN; };
  P.hm = min => `${pad(Math.floor(min / 60))}:${pad(min % 60)}`;
  // 화면 표시용 12시간제 (저장·계산은 24시간제 분/'HH:MM' 그대로)
  P.t12 = min => { min = Math.round(min); const hh = Math.floor(min / 60) % 24, mm = min % 60; return `${hh % 12 || 12}:${pad(mm)} ${hh < 12 ? 'AM' : 'PM'}`; };
  P.t12s = min => { min = Math.round(min); const hh = Math.floor(min / 60) % 24; return min % 60 ? P.t12(min) : `${hh % 12 || 12} ${hh < 12 ? 'AM' : 'PM'}`; };
  P.t12str = hm => { const m = P.toMin(hm); return isNaN(m) ? "" : P.t12(m); };
  P.range12 = (a, b) => { const x = P.t12(a), y = P.t12(b); return x.slice(-2) === y.slice(-2) ? `${x.slice(0, -3)}–${y}` : `${x}–${y}`; };
  P.uid = () => Math.random().toString(36).slice(2, 9);
  P.ceil5 = x => Math.ceil(x / 5 - 1e-9) * 5;
  P.floor5 = x => Math.floor(x / 5 + 1e-9) * 5;
  P.round5 = x => Math.round(x / 5) * 5;
  P.median = arr => {
    const a = arr.slice().sort((x, y) => x - y), n = a.length;
    if (!n) return 0;
    return n % 2 ? a[(n - 1) / 2] : (a[n / 2 - 1] + a[n / 2]) / 2;
  };
  P.subj = (S, id) => (S.subjects || []).find(s => s.id === id);

  P.COLORS = ['#4f46e5', '#0891b2', '#16a34a', '#d97706', '#dc2626', '#9333ea',
    '#db2777', '#0d9488', '#65a30d', '#475569', '#ea580c', '#2563eb'];

  // ---------- 기본 상태 ----------
  P.defaultSettings = function (env) {
    env = env || {};
    return {
      startDate: P.today(),
      classEnd: '2026-12-10',          // 이 날짜 이후엔 수업(복습·예습) 없음 — 기말 기간
      weekdayBlocks: [['18:30', '21:00'], ['21:30', '24:00']],
      weekendBlocks: [['08:00', '24:00']],
      theme: 'system',                 // 화면 모드: system(Windows 설정 따라감) | light | dark
      palette: 'indigo', font: 'system', style: 'base',   // 테마: 색 팔레트 · 글꼴 · 스타일 (설정 → 테마)
      reviewCapOn: false,              // 켜면 하루 복습·예습 상한(reviewCapMin)과 남은 시간 안에서만 넣고 나머지는 ‘빠진 항목’으로. 끄면(기본) 전부 넣는다
      reviewCapMin: 180,               // 하루 복습+예습 상한 (reviewCapOn 일 때만)
      planFillPct: 85,                 // 가용 시간의 몇 %까지만 계획에 채울지
      breakOn: true, focusMin: 50, breakMin: 10,
      hardFirst: true,                 // 어려운 과목을 먼저 배치
      carryAll: true,                  // 체크리스트 노트를 등록한 복습은 끝내거나 뺄 때까지 계속 이월
      lookback: 2,                     // 노트가 없는 복습(시간표 기준)은 며칠 전 수업까지 다시 보여줄지 (carryAll 이 꺼지면 모든 복습에 적용)
      bufferDays: 3,                   // 시험 N일 전까지 범위를 끝낸다
      finalDays: 4,                    // 시험 N일 전부터 직전 정리를 시작한다
      maxJobsPerDay: 3,
      autoAvg: true,                   // 쌓인 기록의 중앙값으로 예상 시간 보정
      minDefaults: { review: 20, preview: 15, chapter: 90, final: 120, exam: 480 },
      studyRoot: env.studyRoot || '',
      inbox: env.inbox || ''
    };
  };

  P.defaultState = function (env) {
    env = env || {};
    const mk = (id, short, name, folder, aliases, o) =>
      Object.assign({ id, short, name, folder, aliases, review: false, preview: false, weight: 3, hard: false, mins: {} }, o || {});
    const subjects = [
      mk('se', '세생', '세포생물학의 이해', '세포생물학의 이해', ['세생', '세포생물학', '세포생물'], { review: true, weight: 3 }),
      mk('mic', 'AP미경', 'AP 미시경제', 'AP Missy Economics', ['AP미경', 'AP미시경제', '미시경제', 'AP Micro', 'APMicro'], { review: true, weight: 4 }),
      mk('eng', 'AP영어', 'AP 영어학', 'AP 영어학', ['AP영어', 'AP영어학', '영어학'], { review: true, weight: 3 }),
      mk('chem', 'AP화학', 'AP 화학', 'AP 화학', ['AP화학', '화학'], { review: true, preview: true, weight: 5, hard: true }),
      mk('calc', 'AP미적', 'AP 미적분학 II', 'AP 미적분학 II', ['AP미적', 'AP미적분', '미적분'], { review: true, weight: 4, hard: true }),
      mk('self', '성자이', '성격과 자기 이해', '성격과 자기 이해', ['성자이', '성격과자기이해'], { review: true, weight: 2 }),
      mk('stat', 'AP통계', 'AP 통계학', 'AP 통계학', ['AP통계', 'AP통계학', '통계학'], { review: true, weight: 4 }),
      mk('career', '진직', '진직', '', ['진직']),
      mk('fp', '융프', '융합프로젝트', '', ['융프', '융합프로젝트']),
      mk('pe', '체육', '체육', '', ['체육']),
      mk('rafi', '라피네', '라피네', '', ['라피네']),
      mk('psy', '프시케', '프시케', '', ['프시케'])
    ];
    subjects.forEach((s, i) => { s.color = P.COLORS[i % P.COLORS.length]; });
    // 시험 시간표가 나오기 전 임시 날짜 — 시험 기간(12/11~12/18)에 분산한 가정값 (확정 체크 전까지 '미확정'으로 표시)
    const assumed = { se: '2026-12-11', mic: '2026-12-14', eng: '2026-12-15', chem: '2026-12-16', calc: '2026-12-17', self: '2026-12-17', stat: '2026-12-18' };
    const exams = subjects.filter(s => s.review).map(s => ({
      id: 'e_' + s.id, sid: s.id, date: assumed[s.id] || '2026-12-11', confirmed: false,
      scope: [], budgetMin: 480, finalMin: 120, partial: 0, finalSpent: 0, finalDone: false
    }));
    return {
      version: 1,
      settings: P.defaultSettings(env),
      subjects,
      // [요일 월~금][1~8교시]
      timetable: [
        ['', 'calc', 'calc', 'mic', 'fp', 'stat', 'self', 'chem'],
        ['se', 'se', 'career', '', 'chem', 'stat', 'stat', 'self'],
        ['mic', 'self', 'se', 'se', 'eng', 'eng', 'rafi', 'rafi'],
        ['eng', 'calc', '', 'self', 'mic', 'mic', 'psy', 'psy'],
        ['chem', 'chem', 'fp', 'fp', 'pe', 'pe', 'eng', 'stat']
      ],
      dayOverrides: { '2026-12-18': { off: true, note: '귀가 (13:30)' } },
      fixed: [{ id: 'f_mirror', title: 'MIRROR 정기회의', dow: 0, start: '', end: '' }],
      milestones: [
        { id: 'm1', date: '2026-12-11', end: '2026-12-18', title: '1,2학년 기말고사', kind: 'exam' },
        { id: 'm2', date: '2026-12-18', title: '귀가 (13:30)', kind: 'etc' },
        { id: 'm3', date: '2026-12-22', title: 'KSEF 제출 마감', kind: 'deadline' },
        { id: 'm4', date: '2026-12-24', title: '귀가', kind: 'etc' },
        { id: 'm5', date: '2026-12-28', title: '포스터 및 최종보고서 마감', kind: 'deadline' }
      ],
      exams,
      tasks: [],
      lessons: {},     // 'YYYY-MM-DD|sid' → { note, file, importedAt }
      progress: {},    // 'rev|date|sid' / 'pre|date|sid' → { done, actual, doneDate } | { skipped }
      checks: {},      // 체크리스트 항목 상태 'key:i' → true
      acc: {},         // 타이머로 누적된 분 (완료 전)
      work: [],        // 시험·과제에 쓴 시간 기록
      log: [],         // 통계용 기록 { ts,date,key,kind,sid,est,act,src }
      manual: {},      // 손으로 고정한 시간 { 'YYYY-MM-DD': { entryId: { start, dur } | { skip: true } } }
      routines: [],    // 반복 공부(루틴) [{ id, title, sid, days:[0~6], min, amount, from, until, on }]
      layout: {},      // 손댄 날의 블록 위치 고정 { 'YYYY-MM-DD': { entryId: start } } — 한 블록을 옮겨도 나머지가 따라 움직이지 않게
      custom: [],      // 내가 추가한 하루 일정 [{ id, date, title, kind: 'todo'|'event', start(분), dur(분), done }]
      allocs: [],      // 할당(번호 묶음·이름 목록을 날짜에 나눠 배정) [{ id, title, color, min, due, items: [{ id, label, min, done, doneDate }] }]
      important: [],   // 중요 할 일 [{ id, date, title, done }] — 계획 탭에서 날짜별로 적고, 홈 화면에 D-day 로 나온다
      timer: null
    };
  };

  // ---------- 할당 (WS 1~10, R&W 세트처럼 번호 있는 묶음을 날짜에 하나씩 배정) ----------
  // 배정 = 그 항목에 묶인 일정(S.custom 의 c.alloc = { a: 할당id, i: 항목id })이 있는 것. 일정을 지우면 다시 ‘대기’로 돌아간다.
  // 일정에 시각(c.start)이 없으면 그날 빈 시간에 자동 배치되고, 못 끝낸 것은 오늘로 이월된다.
  P.allocFind = function (S, ref) {
    const a = ref && (S.allocs || []).find(x => x.id === ref.a);
    const item = a && a.items.find(x => x.id === ref.i);
    return item ? { a, item } : null;
  };
  P.allocUnits = function (S, a) {
    return a.items.map(item => {
      const c = item.done ? null : (S.custom || []).find(x => x.alloc && x.alloc.a === a.id && x.alloc.i === item.id && !x.done) || null;
      return { item, custom: c, state: item.done ? 'done' : c ? 'assigned' : 'waiting', date: c ? c.date : (item.done ? item.doneDate || null : null) };
    });
  };
  P.allocStats = function (S, a, today) {
    const U = P.allocUnits(S, a);
    const asg = U.filter(u => u.state === 'assigned');
    const done = U.filter(u => u.state === 'done').length, waiting = U.filter(u => u.state === 'waiting').length;
    const dates = asg.map(u => (u.date < today ? today : u.date)).sort();
    const last = dates.length ? dates[dates.length - 1] : null;
    const next = U.find(u => u.state !== 'done') || null;
    return { total: U.length, done, assigned: asg.length, waiting, last, next, overdue: asg.filter(u => u.date < today).length,
      late: !!(a.due && last && last > a.due), min: U.filter(u => u.state !== 'done').reduce((s, u) => s + (u.item.min || a.min || 0), 0) };
  };
  // 대기 중인 n개를 날짜에 나눈다. days = P.plan().days, perDay=0 이면 가능한 날에 고르게(앞날이 조금 더), 아니면 하루 perDay개씩 앞에서부터
  P.allocSpread = function (days, today, due, n, perDay) {
    const lim = due && due >= today ? due : P.addDays(today, 13);
    const el = days.filter(D => D.date >= today && D.date <= lim && D.raw > 0).map(D => D.date);
    if (!el.length || n <= 0) return { dates: [], perDay: 0, eligible: el.length };
    const dates = [];
    if (perDay > 0) { for (const d of el) for (let k = 0; k < perDay && dates.length < n; k++) dates.push(d); }
    else { const base = Math.floor(n / el.length), extra = n % el.length; el.forEach((d, i) => { for (let k = 0; k < base + (i < extra ? 1 : 0); k++) dates.push(d); }); }
    return { dates, perDay: perDay > 0 ? perDay : Math.ceil(n / el.length), eligible: el.length };
  };
  // 시각을 정하지 않은(자동 배치) 할당 일정의 그날 분량 — 못 끝낸 지난 날 것은 오늘로 이월되어 함께 센다
  P.autoAllocMin = function (S, date, isToday) {
    return (S.custom || []).filter(c => c.alloc && !c.done && ((c.date === date && c.start == null) || (isToday && c.date < date))).reduce((a, c) => a + c.dur, 0);
  };

  // 기존 할 일(중요 할 일 'imp:<id>' · 과제 'task:<id>')에 일정(S.custom, c.ref)으로 시간을 잡아 둔 ‘해결 예정’. 아직 안 끝낸 오늘 이후 것만, 빠른 순서
  P.scheduledFor = function (S, ref, today) {
    return (S.custom || []).filter(c => c.ref === ref && !c.done && c.start != null && c.date >= today)
      .sort((a, b) => a.date.localeCompare(b.date) || a.start - b.start);
  };

  // 공유용(HTML 파일·링크) 처음 상태: 과목·시간표·시험·일정 없이 빈 화면으로 시작한다 (사용법 안내를 따라 채운다)
  P.emptyState = function () {
    const s = P.defaultState({});
    s.subjects = [];
    s.timetable = Array.from({ length: 5 }, () => Array(8).fill(''));
    s.exams = []; s.milestones = []; s.fixed = []; s.dayOverrides = {};
    return s;
  };

  // 홈 화면용: 앞으로 남은(또는 아직 못 끝낸) 일정을 날짜순으로 모은다.
  // kind: imp 중요 할 일 · task 마감·대회 · exam 시험 · etc 달력 일정. 기간 일정(기말고사 등)은 시작 전엔 시작일, 진행 중엔 오늘 기준.
  P.upcoming = function (S, today) {
    const L = [], ORDER = { imp: 0, task: 1, exam: 2, etc: 3 };
    for (const it of S.important || []) {
      if (it.done || !it.date) continue;
      L.push({ id: 'imp:' + it.id, kind: 'imp', date: it.date, eff: it.date, title: it.title, overdue: it.date < today, impId: it.id });
    }
    for (const t of S.tasks) if (!t.done && t.due && t.due >= today) L.push({ id: 'task:' + t.id, kind: 'task', date: t.due, eff: t.due, title: t.title });
    for (const e of S.exams) {
      const sb = P.subj(S, e.sid);
      if (!sb || !e.date || e.date < today) continue;
      L.push({ id: 'exam:' + e.id, kind: 'exam', date: e.date, eff: e.date, title: `${sb.name} 시험`, color: sb.color, unconfirmed: !e.confirmed });
    }
    for (const a of S.allocs || []) {
      const st = P.allocStats(S, a, today);
      if (!a.due || a.due < today || st.done >= st.total) continue;
      L.push({ id: 'al:' + a.id, kind: 'task', date: a.due, eff: a.due, title: `${a.title} (${st.done}/${st.total})`, color: a.color });
    }
    for (const m of S.milestones) {
      const end = m.end || m.date;
      if (!m.date || end < today) continue;
      const kind = m.kind === 'exam' ? 'exam' : m.kind === 'deadline' ? 'task' : 'etc';
      L.push({ id: 'ms:' + m.id, kind, date: m.date, end: m.end || null, eff: m.date < today ? today : m.date, ongoing: m.date <= today, title: m.title });
    }
    return L.sort((a, b) => a.eff.localeCompare(b.eff) || ORDER[a.kind] - ORDER[b.kind] || a.title.localeCompare(b.title));
  };

  // ---------- 용량 ----------
  function subtract(iv, s, e) {
    const out = [];
    for (const [a, b] of iv) {
      if (e <= a || s >= b) { out.push([a, b]); continue; }
      if (s > a) out.push([a, s]);
      if (e < b) out.push([e, b]);
    }
    return out;
  }
  function clip(iv, from) {
    return iv.map(([a, b]) => [Math.max(a, from), b]).filter(([a, b]) => b > a);
  }
  P.clip = clip;

  P.fixedHits = function (f, date) {
    if (f.date) return f.date === date;
    if (f.dow == null || f.dow === '') return false;
    return +f.dow === P.dow(date) && (!f.until || date <= f.until) && (!f.from || date >= f.from);
  };

  // 그날의 공부 시간대(자습 시간: 1자습, 2자습 …): 설정·날짜별 예외로 정한 구간. 고정 일정·내 일정을 빼기 전
  P.baseBlocks = function (S, date) {
    const ov = (S.dayOverrides || {})[date];
    if (ov && ov.off) return [];
    const w = P.dow(date), weekend = w === 0 || w === 6;
    const base = ov && ov.blocks && ov.blocks.length ? ov.blocks : (weekend ? S.settings.weekendBlocks : S.settings.weekdayBlocks);
    return base.map(b => [P.toMin(b[0]), P.toMin(b[1])]).filter(b => b[1] > b[0]);
  };
  // 구간 [a,b) 안에서 dur 분이 들어가는 가장 이른 시작 (taken: 이미 차지한 [시작,끝] 목록). 들어갈 자리가 없으면 null
  P.firstFit = function (a, b, taken, dur) {
    const t = taken.filter(([x, y]) => y > a && x < b).sort((p, q) => p[0] - q[0]);
    let start = a;
    for (const [x, y] of t) { if (x - start >= dur) break; start = Math.max(start, y); }
    return start + dur <= b ? start : null;
  };

  P.blocksFor = function (S, date) {
    let iv = P.baseBlocks(S, date);
    const w = P.dow(date);
    for (const f of S.fixed || []) {
      const s = P.toMin(f.start), e = P.toMin(f.end);
      if (!(e > s) || !P.fixedHits(f, date)) continue;
      iv = subtract(iv, s, e);
    }
    for (const c of S.custom || []) {
      if (c.date !== date || c.done || c.start == null) continue;
      iv = subtract(iv, c.start, c.start + c.dur);
    }
    return iv;
  };

  function effMinutes(S, iv) {
    const st = S.settings;
    let tot = 0;
    for (const [a, b] of iv) {
      const L = b - a;
      tot += st.breakOn ? Math.floor(L * st.focusMin / (st.focusMin + st.breakMin)) : L;
    }
    return tot;
  }

  // ---------- 수업 / 시간표 ----------
  P.lessonsOn = function (S, date) {
    const w = P.dow(date);
    if (w === 0 || w === 6) return [];
    const ov = (S.dayOverrides || {})[date];
    if (ov && ov.off) return [];
    if (S.settings.classEnd && date > S.settings.classEnd) return [];
    const row = S.timetable[w - 1] || [];
    const out = [];
    row.forEach((id, i) => {
      if (!id) return;
      let o = out.find(x => x.sid === id);
      if (!o) { o = { sid: id, periods: [] }; out.push(o); }
      o.periods.push(i + 1);
    });
    return out;
  };

  P.nextSchoolDay = function (S, date) {
    for (let i = 1; i <= 14; i++) {
      const d = P.addDays(date, i);
      if (P.lessonsOn(S, d).length) return d;
    }
    return null;
  };

  // ---------- 예상 시간 (직접 입력 → 기록이 쌓이면 중앙값 반영) ----------
  P.sampleStats = function (S, sid, kind) {
    const xs = (S.log || []).filter(l => l.sid === sid && l.kind === kind && l.act > 0).slice(-8).map(l => l.act);
    return { n: xs.length, median: xs.length ? P.median(xs) : 0 };
  };
  P.effMin = function (S, sid, kind) {
    const sb = P.subj(S, sid);
    const manual = (sb && sb.mins && sb.mins[kind]) || S.settings.minDefaults[kind] || 20;
    const st = P.sampleStats(S, sid, kind);
    if (S.settings.autoAvg && st.n >= 3) {
      const w = st.n / (st.n + 3);
      return { min: Math.max(5, P.round5(w * st.median + (1 - w) * manual)), manual, n: st.n, median: st.median, auto: true };
    }
    return { min: manual, manual, n: st.n, median: st.median, auto: false };
  };
  P.stats = function (S) {
    const rows = [];
    for (const sb of S.subjects) {
      for (const kind of ['review', 'preview']) {
        if (!sb[kind]) continue;
        rows.push(Object.assign({ sb, kind }, P.effMin(S, sb.id, kind)));
      }
    }
    let est = 0, act = 0;
    for (const l of S.log || []) if (l.est > 0 && l.act > 0) { est += l.est; act += l.act; }
    return { rows, ratio: est ? act / est : null, nlog: (S.log || []).length };
  };

  function itemsMin(items) {
    return Math.max(10, P.round5(items.reduce((a, i) => a + (i.min != null ? i.min : 5), 0)));
  }

  // 못 끝낸 복습을 며칠 전 수업까지 훑어볼지. carryAll(기본)이면 최대 60일(시작일 이전 제외) — 이 중 노트 없는 복습은 reviewItems 에서 lookback 일까지만 남긴다
  P.carryDays = function (S, date) {
    const st = S.settings;
    if (st.carryAll === false) return Math.max(0, st.lookback || 0);
    return Math.max(st.lookback || 0, Math.min(60, Math.max(0, P.diffDays(st.startDate, date))));
  };

  // 복습노트 합치기: 이미 있는 노트 뒤에 새 내용을 덧붙인다 (같은 항목은 건너뜀). 기존 항목의 순서·번호는 그대로라 체크 상태가 유지된다.
  // 반환: { note, added: 새로 붙은 체크리스트·예습 항목 수, addedAny: 새로 붙은 것이 하나라도 있는지 }
  P.mergeNote = function (oldNote, nw) {
    const txt = x => String(typeof x === 'string' ? x : (x && x.text) || '').trim();
    const cat = (a, b) => {
      a = a || []; b = b || [];
      const seen = new Set(a.map(txt));
      const add = b.filter(x => { const k = txt(x); if (!k || seen.has(k)) return false; seen.add(k); return true; });
      return { list: a.concat(add), n: add.length };
    };
    const note = { priority: nw.priority || (oldNote && oldNote.priority) || '' };
    let added = 0, addedAny = false;
    for (const k of ['summary', 'concepts', 'items', 'questions', 'preview']) {
      const r = cat(oldNote && oldNote[k], nw[k]);
      note[k] = r.list;
      if (r.n) addedAny = true;
      if (k === 'items' || k === 'preview') added += r.n;
    }
    return { note, added, addedAny };
  };

  // ---------- 복습 / 예습 (필수 항목) ----------
  P.reviewItems = function (S, date, isToday) {
    const out = [], st = S.settings;
    const look = isToday ? P.carryDays(S, date) : 0;
    for (let k = 0; k <= look; k++) {
      const d = P.addDays(date, -k);
      const found = [];
      for (const h of P.lessonsOn(S, d)) {
        const L = S.lessons[d + '|' + h.sid];
        if (d >= st.startDate || (L && L.note)) found.push({ sid: h.sid, periods: h.periods });
      }
      for (const key of Object.keys(S.lessons || {})) {
        if (!key.startsWith(d + '|')) continue;
        const sid = key.slice(11);
        if (S.lessons[key].note && !found.find(x => x.sid === sid)) found.push({ sid, periods: [] });
      }
      for (const { sid, periods } of found) {
        const sb = P.subj(S, sid);
        if (!sb || !sb.review) continue;
        const key = `rev|${d}|${sid}`;
        const pg = (S.progress || {})[key] || {};
        if (pg.skipped) continue;
        if (pg.done && !(isToday && pg.doneDate === date)) continue;
        const note = S.lessons[d + '|' + sid] && S.lessons[d + '|' + sid].note;
        if (k > (st.lookback || 0) && !(note && note.items && note.items.length)) continue;   // 노트 없는 복습은 lookback 일까지만 이월 (쌓이는 것 방지)
        let est, estInfo = null;
        if (note && note.items && note.items.some(i => i.min != null)) est = itemsMin(note.items);
        else { estInfo = P.effMin(S, sid, 'review'); est = estInfo.min; }
        const ldow = P.dow(d);
        if (sb.rvDurs && sb.rvDurs[ldow] != null) { est = Math.max(5, sb.rvDurs[ldow]); estInfo = null; }          // 루틴 시간표에서 정한 길이
        const fixedStart = k === 0 ? (sb.rvStarts && sb.rvStarts[ldow] != null ? sb.rvStarts[ldow] : (sb.rvStart != null ? sb.rvStart : null)) : null;           // 그날 수업의 복습은 정한 시각에 고정
        out.push({ key, kind: 'review', sid, date: d, periods, est, estInfo, note, overdue: k, fixedStart, done: !!pg.done, actual: pg.actual || 0 });
      }
    }
    return out;
  };

  P.previewSource = function (S, sid, upto) {
    let best = null;
    for (const key of Object.keys(S.lessons || {})) {
      const d = key.slice(0, 10), s = key.slice(11);
      if (s !== sid || d > upto) continue;
      const items = (S.lessons[key].note && S.lessons[key].note.preview) || [];
      if (items.length && (!best || d > best.date)) best = { date: d, items };
    }
    return best;
  };

  P.previewItems = function (S, date, isToday) {
    const target = P.nextSchoolDay(S, date);
    if (!target) return [];
    const out = [];
    for (const h of P.lessonsOn(S, target)) {
      const sb = P.subj(S, h.sid);
      if (!sb || !sb.preview) continue;
      const key = `pre|${target}|${h.sid}`;
      const pg = (S.progress || {})[key] || {};
      if (pg.skipped) continue;
      if (pg.done && !(isToday && pg.doneDate === date)) continue;
      const src = P.previewSource(S, h.sid, date);
      let est, estInfo = null;
      if (src && src.items.some(i => i.min != null)) est = itemsMin(src.items);
      else { estInfo = P.effMin(S, h.sid, 'preview'); est = estInfo.min; }
      out.push({ key, kind: 'preview', sid: h.sid, date: target, periods: h.periods, est, estInfo, src, done: !!pg.done, actual: pg.actual || 0 });
    }
    return out;
  };

  // ---------- 루틴 (매일/요일별로 반복하는 공부: 단어, 문제풀이, 모의고사 …) ----------
  P.daysText = days => {
    const d = (days || []).slice().sort((a, b) => a - b), k = d.join(',');
    if (d.length === 7) return '매일';
    if (k === '1,2,3,4,5') return '평일';
    if (k === '0,6') return '주말';
    return d.map(x => P.DOW[x]).join('·');
  };
  // 루틴이 그 요일에 갖는 시각(없으면 null = 시간 미정)과 길이. 요일별로 따로 정할 수 있다 (r.starts[요일], r.durs[요일])
  P.occ = (r, dow) => ({
    start: r.starts && r.starts[dow] != null ? r.starts[dow] : (r.start != null ? r.start : null),   // 요일별 예외 > 루틴 기본 시각(모든 요일에 반복) > 미정
    min: Math.max(5, (r.durs && r.durs[dow] != null) ? r.durs[dow] : (r.min || 30))
  });
  P.routineItems = function (S, date, isToday) {
    const out = [], ov = (S.dayOverrides || {})[date];
    if (ov && ov.off) return out;
    const w = P.dow(date);
    for (const r of S.routines || []) {
      if (r.on === false || !(r.days || []).includes(w) || !P.subj(S, r.sid)) continue;
      if (r.from && date < r.from) continue;
      if (r.until && date > r.until) continue;
      const key = `rt|${date}|${r.id}`;
      const pg = (S.progress || {})[key] || {};
      if (pg.skipped) continue;
      if (pg.done && !(isToday && pg.doneDate === date)) continue;
      const oc = P.occ(r, w);
      out.push({ key, kind: 'routine', sid: r.sid, date, est: oc.min, fixedStart: oc.start, routine: r, done: !!pg.done, actual: pg.actual || 0, estInfo: null });
    }
    return out;
  };

  // ---------- 시험 / 과제 (마감이 있는 작업) ----------
  P.examTotal = function (S, e) {
    const st = S.settings;
    if (e.scope && e.scope.length) return e.scope.reduce((a, c) => a + (c.min || st.minDefaults.chapter), 0);
    return e.budgetMin != null ? e.budgetMin : st.minDefaults.exam;
  };
  P.examRemaining = function (S, e) {
    const st = S.settings;
    const undone = e.scope && e.scope.length
      ? e.scope.filter(c => !c.done).reduce((a, c) => a + (c.min || st.minDefaults.chapter), 0)
      : (e.budgetMin != null ? e.budgetMin : st.minDefaults.exam);
    return Math.max(0, undone - (e.partial || 0));
  };
  P.spentOn = (S, key, date) => (S.work || []).filter(w => w.key === key && w.date === date).reduce((a, w) => a + w.min, 0);

  P.jobs = function (S, today) {
    const st = S.settings, out = [];
    for (const e of S.exams || []) {
      const sb = P.subj(S, e.sid);
      if (!sb || !e.date || e.date <= today) continue;
      const buf = Math.max(1, e.buffer != null ? e.buffer : st.bufferDays);
      const last = P.addDays(e.date, -1);
      let dl = P.addDays(e.date, -buf);
      if (dl < today) dl = today;
      const id = 'exam|' + e.id, fid = 'final|' + e.id;
      const rem = P.examRemaining(S, e);
      if (rem > 0 || P.spentOn(S, id, today) > 0) {
        out.push({ id, kind: 'exam', sid: e.sid, title: `${sb.name} ${e.label || '기말 대비'}`, release: today, deadline: dl, rem, minChunk: 30, maxPerDay: 150, weight: sb.weight || 3, hard: !!sb.hard, ref: e });
      }
      if (!e.finalDone) {
        const frem = Math.max(0, (e.finalMin != null ? e.finalMin : st.minDefaults.final) - (e.finalSpent || 0));
        let rel = P.addDays(e.date, -Math.max(1, st.finalDays || 4));
        if (rel < today) rel = today;
        if (frem > 0 || P.spentOn(S, fid, today) > 0) {
          out.push({ id: fid, kind: 'final', sid: e.sid, title: `${sb.name} 직전 정리`, release: rel, deadline: last, rem: frem, minChunk: 30, maxPerDay: 120, weight: (sb.weight || 3) + 1, hard: !!sb.hard, ref: e });
        }
      }
    }
    for (const t of S.tasks || []) {
      if (t.done) continue;
      const id = 'task|' + t.id;
      const rem = Math.max(0, (t.totalMin || 0) - (t.spent || 0));
      if (!(rem > 0 || P.spentOn(S, id, today) > 0)) continue;
      let dl = t.due || P.addDays(today, 30);
      if (dl < today) dl = today;
      let rel = t.start && t.start > today ? t.start : today;
      if (rel > dl) rel = dl;
      const w = { 1: 2, 2: 3, 3: 5 }[t.priority || 2];
      out.push({ id, kind: 'task', sid: t.sid || '', title: t.title, release: rel, deadline: dl, rem, minChunk: Math.min(t.minChunk || 30, 180), maxPerDay: t.maxPerDay || 180, weight: w, hard: false, ref: t });
    }
    return out;
  };

  // ---------- 일별 계획 ----------
  P.manualOf = (S, date) => (S.manual && S.manual[date]) || {};
  P.subjSkipped = (man, date, sid) => !!(man['st|' + date + '|' + sid] && man['st|' + date + '|' + sid].skip);

  P.plan = function (S, opts) {
    opts = opts || {};
    const today = opts.today || P.today();
    const nowMin = opts.nowMin != null ? opts.nowMin : P.nowMin();
    const st = S.settings;
    const jobs = P.jobs(S, today);
    let horizon = 28;
    for (const j of jobs) horizon = Math.max(horizon, P.diffDays(today, j.deadline) + 1);
    for (const c of S.custom || []) if (c.date >= today) horizon = Math.max(horizon, P.diffDays(today, c.date) + 1);
    horizon = Math.min(horizon, 150);

    const days = [];
    for (let t = 0; t < horizon; t++) {
      const date = P.addDays(today, t);
      let blocks = P.blocksFor(S, date);
      if (t === 0) blocks = clip(blocks, Math.ceil(nowMin / 5) * 5);
      const raw = blocks.reduce((a, b) => a + b[1] - b[0], 0);
      const cap = Math.floor(effMinutes(S, blocks) * st.planFillPct / 100);
      days.push({ date, t, blocks, raw, cap, nowMin: t === 0 ? Math.ceil(nowMin / 5) * 5 : 0, mandatory: [], done: [], dropped: [], work: [], used: 0, entries: [] });
    }
    // 날짜별 '남는 용량' = 가용 − 복습·예습 예상치. 시험·과제는 이 용량에 비례해 나눠 배정한다 (주말처럼 긴 날에 더 많이)
    for (const D of days) {
      const isToday = D.t === 0;
      const manD = P.manualOf(S, D.date);
      const all = P.reviewItems(S, D.date, isToday).concat(P.previewItems(S, D.date, isToday)).filter(x => !(manD[x.key] && manD[x.key].skip) && !(x.kind === 'review' && manD['rr' + x.key.slice(3)] && manD['rr' + x.key.slice(3)].skip) && !P.subjSkipped(manD, D.date, x.sid));
      const doneMin = all.filter(x => x.done).reduce((a, x) => a + (x.actual || 0), 0);
      const pendMin = all.filter(x => !x.done).reduce((a, x) => a + x.est, 0);
      const rtMin = P.routineItems(S, D.date, isToday)
        .filter(x => !x.done && !(manD[x.key] && manD[x.key].skip) && !P.subjSkipped(manD, D.date, x.sid)).reduce((a, x) => a + x.est, 0) + P.autoAllocMin(S, D.date, isToday);
      const mand = (st.reviewCapOn ? Math.min(pendMin, Math.max(0, Math.min(D.cap - rtMin, st.reviewCapMin - doneMin))) : pendMin) + rtMin;
      D.free = D.cap - mand >= 15 ? D.cap - mand : 0;
    }
    const freeSum = (t0, dl) => {
      let c = 0;
      for (let t = t0; t < days.length && days[t].date <= dl; t++) c += days[t].free;
      return c;
    };

    const sim = jobs.map((j, i) => {
      const sp = P.spentOn(S, j.id, today);
      return Object.assign({}, j, { sp, cur: j.rem + sp, owed: ((i * 0.37) % 1) * j.minChunk });
    });
    const deficits = [];
    const rank = x => (x.kind === 'review' ? (x.overdue ? 2 : 0) : 1);
    const wt = x => (P.subj(S, x.sid) || {}).weight || 3;

    for (const D of days) {
      const isToday = D.t === 0;
      // 1) 필수 항목: 복습·예습 (하루 상한 적용). 사용자가 그 과목 블록을 옮기거나 늘렸다면 항상 포함
      const man = P.manualOf(S, D.date);
      const all = P.reviewItems(S, D.date, isToday).concat(P.previewItems(S, D.date, isToday))
        .filter(x => !(man[x.key] && man[x.key].skip) && !(x.kind === 'review' && man['rr' + x.key.slice(3)] && man['rr' + x.key.slice(3)].skip) && !P.subjSkipped(man, D.date, x.sid));
      D.skipped = Object.keys(man).filter(k => man[k].skip);
      D.done = all.filter(x => x.done);
      const pending = all.filter(x => !x.done);
      const rts = P.routineItems(S, D.date, isToday)
        .filter(x => !(man[x.key] && man[x.key].skip) && !(man['rb' + x.key.slice(2)] && man['rb' + x.key.slice(2)].skip) && !P.subjSkipped(man, D.date, x.sid));
      const rtPending = rts.filter(x => !x.done);
      const am = P.autoAllocMin(S, D.date, isToday);
      const rtMin = rtPending.reduce((a, x) => a + x.est, 0) + am;
      D.done = D.done.concat(rts.filter(x => x.done));
      const doneMin = D.done.filter(x => x.kind !== 'routine').reduce((a, x) => a + (x.actual || 0), 0);
      const allow = st.reviewCapOn ? Math.max(0, Math.min(D.cap - rtMin, st.reviewCapMin - doneMin)) : Infinity;   // 상한을 끄면 복습·예습은 전부 넣는다 (시간에 못 들어가면 ‘시간 못 정함’)
      pending.sort((a, b) => rank(a) - rank(b) || (b.overdue || 0) - (a.overdue || 0) || wt(b) - wt(a));   // 이월된 복습은 오래된 것부터
      const pinSid = x => !!man['st|' + D.date + '|' + x.sid] || x.fixedStart != null;
      let used = 0;
      for (const it of pending) if (pinSid(it)) { D.mandatory.push(it); used += it.est; }
      for (const it of pending) {
        if (pinSid(it)) continue;
        if (used + it.est <= allow) { D.mandatory.push(it); used += it.est; } else D.dropped.push(it);
      }
      for (const it of rtPending) { D.mandatory.push(it); used += it.est; }
      used += am;
      D.used = used;
      let remCap = D.cap - used;

      // 2) 시험·과제: 마감까지 남은 날짜로 균등 배분 (+ 이월되는 몫). 길이를 고정한 작업은 그 길이대로
      const reviewMin = {};
      for (const it of D.mandatory) reviewMin[it.sid] = (reviewMin[it.sid] || 0) + it.est;
      const act = sim.filter(j => j.cur > 0.5 && j.release <= D.date && D.date <= j.deadline &&
        !(man[j.id] && man[j.id].skip) && !(j.sid && P.subjSkipped(man, D.date, j.sid)));
      // 사용자가 정한 길이: 작업 자체의 길이, 또는 과목 블록 전체 길이에서 복습·예습을 뺀 만큼을 시험 대비에 배정
      const forcedDur = j => {
        const ov = man[j.id];
        if (ov && ov.dur) return ov.dur;
        const os = j.sid && man['st|' + D.date + '|' + j.sid];
        if (os && os.dur && j.kind === 'exam') return Math.max(0, os.dur - (reviewMin[j.sid] || 0));
        return null;
      };
      const forced = act.filter(j => forcedDur(j) != null);
      const auto = act.filter(j => forcedDur(j) == null);
      let njobs = 0;
      for (const j of forced) {
        const sp = isToday ? j.sp : 0;
        const amt = Math.min(forcedDur(j), P.ceil5(j.cur));
        if (amt < 5) continue;
        const todo = Math.max(0, amt - sp);
        D.work.push({ job: j, min: amt, sp, todo, pinned: true });
        remCap -= todo; j.cur = Math.max(0, j.cur - amt); j.owed = 0; njobs++;
      }
      for (const j of auto) {
        const den = freeSum(D.t, j.deadline);
        j.share = den > 0 ? Math.min(j.cur, FRONT * j.cur * D.free / den) : 0;
        j.need = Math.min(j.cur, j.owed + j.share);
        j.last = D.date === j.deadline || freeSum(D.t + 1, j.deadline) === 0;
      }
      auto.sort((a, b) => (+b.last - +a.last) ||
        (b.need * (0.8 + 0.08 * b.weight) - a.need * (0.8 + 0.08 * a.weight)));
      for (const j of auto) {
        const sp = isToday ? j.sp : 0;
        let amt = 0;
        const trigger = j.last || j.need >= j.minChunk || j.need >= j.cur - 1;
        if (trigger && (njobs < st.maxJobsPerDay || j.last) && remCap + sp >= 5) {
          amt = Math.min(P.ceil5(j.need), P.ceil5(j.cur), j.maxPerDay, P.floor5(remCap + sp));
          if (amt < Math.min(j.minChunk, j.cur) && !j.last) amt = 0;
        }
        if (amt >= 5) {
          D.work.push({ job: j, min: amt, sp, todo: Math.max(0, amt - sp) });
          remCap -= Math.max(0, amt - sp);
          j.cur = Math.max(0, j.cur - amt);
          j.owed = Math.max(0, Math.min(j.cur, j.need - amt));
          njobs++;
        } else {
          j.owed = j.need;
        }
      }
      if (isToday) {
        // 오늘 이미 한 만큼이 계획보다 크면 그 초과분도 소진으로 처리
        for (const j of sim) {
          const w = D.work.find(x => x.job === j);
          const planned = w ? w.min : 0;
          if (j.sp > planned) j.cur = Math.max(0, j.cur - (j.sp - planned));
        }
      }
      for (const j of sim) {
        if (j.deadline === D.date && j.cur > 4) deficits.push({ job: j, amount: Math.round(j.cur), date: D.date });
      }
      P.place(S, D);
    }
    return { today, days, jobs: sim, deficits };
  };

  // ---------- 타임라인 배치 ----------
  // 한 과목의 복습·예습·시험 대비는 하루에 블록 하나(과목 블록)로 합친다. 대회·과제와 내 일정은 따로.
  // 순서: ① 내 일정 ② 직접 옮긴 블록 ③ 이전에 놓였던 자리를 그대로 지키는 블록(layout) ④ 나머지는 가장 이른 빈 구간에 자동 배치.
  // ③ 덕분에 한 블록을 옮겨도 다른 블록이 따라 움직이지 않는다. 자리가 겹치는 블록만 자동 배치로 돌아간다.
  // 블록 길이를 target 분으로 줄일 때 각 부분(복습·예습·시험 대비)의 분을 비례해서(5분 단위) 줄인다
  function shrinkParts(parts, target) {
    const tot = parts.reduce((a, p) => a + p.min, 0);
    if (!(tot > target) || tot <= 0) return;
    let left = target;
    if (target < 5 * parts.length) { for (const p of parts) { const m = Math.min(p.min, left); p.min = m; left -= m; } return; }     // 너무 짧으면 앞부분부터 채운다
    parts.forEach((p, i) => {
      const rest = parts.length - 1 - i;
      const m = rest === 0 ? left : Math.max(5, Math.min(P.round5(p.min * target / tot), left - 5 * rest));    // 뒤 부분에 최소 5분씩은 남긴다
      p.min = m; left -= m;
    });
  }

  P.place = function (S, D) {
    const st = S.settings, man = P.manualOf(S, D.date), layout = (S.layout && S.layout[D.date]) || null, entries = [];
    const groups = {};
    const grp = sid => {
      if (!groups[sid]) {
        const sb = P.subj(S, sid);
        groups[sid] = { id: 'st|' + D.date + '|' + sid, kind: 'study', sid, min: 0, hard: !!(sb && sb.hard), order: 0, parts: [] };
        entries.push(groups[sid]);
      }
      return groups[sid];
    };
    for (const it of D.mandatory) {
      if ((it.kind === 'routine' || it.kind === 'review') && it.fixedStart != null) {
        const rid = it.kind === 'routine' ? 'rb' + it.key.slice(2) : 'rr' + it.key.slice(3), ov = man[rid], dur = ov && ov.dur ? ov.dur : it.est;
        const sbj = P.subj(S, it.sid);
        entries.push({ id: rid, kind: 'study', sid: it.sid, min: dur, baseMin: it.est, extra: Math.max(0, dur - it.est), shrunk: Math.max(0, it.est - dur), hard: it.kind === 'review' && !!(sbj && sbj.hard), order: 0, parts: [{ k: it.kind, min: Math.min(it.est, dur), item: it }], spentExam: 0, fixedRoutine: true, fixedStart: it.fixedStart });
        continue;
      }
      const g = grp(it.sid); g.parts.push({ k: it.kind, min: it.est, item: it }); g.min += it.est;
    }
    for (const w of D.work) {
      if (w.todo < 5) continue;
      const j = w.job;
      if (j.kind === 'task') { entries.push({ id: j.id, kind: 'task', sid: j.sid, min: w.todo, planned: w.min, spent: w.sp, hard: false, order: 2, job: j }); continue; }
      const g = grp(j.sid); g.parts.push({ k: j.kind, min: w.todo, job: j, w }); g.min += w.todo;
    }
    const PO = { review: 0, preview: 1, routine: 2, exam: 3, final: 4 };
    for (const g of Object.values(groups)) {
      g.parts.sort((a, b) => PO[a.k] - PO[b.k]);
      g.baseMin = g.min;
      const ov = man[g.id];
      if (ov && ov.dur) {
        g.min = ov.dur;                                              // 직접 정한 길이 (계획보다 줄이는 것도 된다)
        if (g.min < g.baseMin) shrinkParts(g.parts, g.min);          // 줄이면 복습·예습·시험 대비가 비례해서 줄어든다
      }
      g.extra = Math.max(0, g.min - g.baseMin);
      g.shrunk = Math.max(0, g.baseMin - g.min);
      g.spentExam = g.parts.reduce((a, p) => a + (p.w ? p.w.sp : 0), 0);
    }
    for (const c of S.custom || []) {
      if (c.done) continue;
      const carried = !!c.alloc && D.t === 0 && c.date < D.date;               // 못 끝낸 할당은 오늘로 이월
      if (c.date !== D.date && !carried) continue;
      if (c.start == null && !c.alloc) continue;
      entries.push({ id: 'cu|' + c.id, kind: 'custom', sid: '', min: c.dur, hard: false, order: c.alloc ? 1.5 : 4, custom: c, carried, overdue: carried ? P.diffDays(c.date, D.date) : 0 });
    }
    D.customDone = (S.custom || []).filter(c => (c.date === D.date || c.doneDate === D.date) && c.done && c.kind === 'todo');
    for (const e of entries) {
      const ov = man[e.id];
      e.manual = !e.custom && !!ov;
      e.pinStart = e.custom ? (e.carried ? null : e.custom.start) : (ov && ov.start != null ? ov.start : (e.fixedRoutine ? e.fixedStart : null));
      e.frozenStart = (e.pinStart == null && layout && layout[e.id] != null && layout[e.id] >= (D.nowMin || 0)) ? layout[e.id] : null;
      e.pinned = false; e.frozen = false; e.pieces = []; e.unplaced = 0;
    }
    let free = D.blocks.map(([a, b]) => ({ a, b, run: 0 }));
    const taken = [];
    const carve = (e, s) => {
      const f = s + e.min;
      e.pieces.push([s, f]); taken.push([s, f]);
      const nf = [];
      for (const I of free) {
        if (f <= I.a || s >= I.b) { nf.push(I); continue; }
        if (s > I.a) nf.push({ a: I.a, b: s, run: I.run });
        if (f < I.b) nf.push({ a: f, b: I.b, run: 0 });
      }
      free = nf;
    };
    const soft = e => e.fixedRoutine && !(man[e.id] && man[e.id].start != null);
    for (const e of entries) if (e.pinStart != null && !soft(e)) { e.pinned = true; carve(e, e.pinStart); }
    // 시각이 정해진 루틴끼리 겹치면 뒤의 것은 자동 배치로 돌린다
    for (const e of entries.filter(x => x.pinStart != null && soft(x)).sort((a, b) => a.pinStart - b.pinStart)) {
      if (taken.some(([a, b]) => e.pinStart < b && e.pinStart + e.min > a)) { e.pinStart = null; continue; }
      e.pinned = true; carve(e, e.pinStart);
    }
    for (const e of entries.filter(x => x.frozenStart != null).sort((a, b) => a.frozenStart - b.frozenStart)) {
      const s = e.frozenStart, f = s + e.min;
      if (taken.some(([a, b]) => s < b && f > a)) continue;     // 겹치면 이 블록만 자동 배치로
      e.pinned = true; e.frozen = true; carve(e, s);
    }
    const brk = I => (st.breakOn && I.run >= st.focusMin ? st.breakMin : 0);
    const auto = entries.filter(e => !e.pinned)
      .sort((a, b) => (st.hardFirst ? (+b.hard - +a.hard) : 0) || (a.order - b.order));
    for (const e of auto) {
      let rem = e.min;
      for (const I of free) {
        const gap = brk(I);
        if (I.b - I.a >= gap + rem) {
          const s = I.a + gap;
          e.pieces.push([s, s + rem]);
          I.run = (gap ? 0 : I.run) + rem; I.a = s + rem; rem = 0;
          break;
        }
      }
      for (const I of free) {
        if (rem <= 0) break;
        const gap = brk(I), room = I.b - I.a - gap;
        if (room < 5) continue;
        const take = Math.min(rem, room), s = I.a + gap;
        e.pieces.push([s, s + take]);
        I.run = (gap ? 0 : I.run) + take; I.a = s + take; rem -= take;
      }
      e.unplaced = rem;
    }
    entries.sort((a, b) => (a.pieces.length ? a.pieces[0][0] : 1e9) - (b.pieces.length ? b.pieces[0][0] : 1e9));
    D.entries = entries;
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = P;
  else root.Planner = P;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* 노트 양식 파서 — Claude가 출력한 `=== 복습노트 ===` / `=== 할일 ===` 텍스트를 구조화한다.
 * 양식이 조금 어긋나도(코드블록, 전각 콜론, 번호 목록 등) 최대한 읽도록 너그럽게 작성.
 */
(function (root) {
  'use strict';
  const Pr = {};
  const pad = n => String(n).padStart(2, '0');

  Pr.normDate = function (s, ref) {
    if (!s) return '';
    s = String(s).trim();
    let m = s.match(/(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/);
    if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
    m = s.match(/(\d{1,2})\s*[/월.\-]\s*(\d{1,2})\s*일?/);
    if (m) return `${(ref || new Date()).getFullYear()}-${pad(m[1])}-${pad(m[2])}`;
    return '';
  };

  // "1시간 30분", "45분", "1.5h" → 분. 인식 못 하면 null
  Pr.duration = function (s) {
    if (s == null) return null;
    s = String(s);
    let min = 0, found = false;
    const h = s.match(/(\d+(?:\.\d+)?)\s*(?:시간|hours?|hr|h)(?![a-z])/i);
    if (h) { min += parseFloat(h[1]) * 60; found = true; }
    const m = s.match(/(\d+(?:\.\d+)?)\s*(?:분|min|m)(?![a-z])/i);
    if (m) { min += parseFloat(m[1]); found = true; }
    return found ? Math.round(min) : null;
  };

  function stripFence(text) {
    return String(text).replace(/\r/g, '').replace(/^﻿/, '')
      .split('\n').filter(l => !/^\s*```/.test(l)).join('\n');
  }

  function extractBlock(text, name) {
    const m = new RegExp('={2,}\\s*' + name + '\\s*={2,}').exec(text);
    if (!m) return null;
    const rest = text.slice(m.index + m[0].length);
    const e = /={2,}\s*끝\s*={2,}/.exec(rest);
    return e ? rest.slice(0, e.index) : rest;
  }

  function parseHeader(lines) {
    const h = {};
    for (const l of lines) {
      const m = l.match(/^\s*[-*]?\s*([가-힣A-Za-z ]{1,10})\s*[:：]\s*(.*)$/);
      if (m) h[m[1].replace(/\s+/g, '')] = m[2].trim();
    }
    return h;
  }

  function plain(l) {
    return l.trim().replace(/^(?:[-*•·]|\d+[.)])\s*/, '').replace(/^\[( |x|X|✓|✔)\]\s*/, '').trim();
  }

  function parseItem(raw) {
    let t = plain(raw), tag = '', min = null, m;
    m = t.match(/^\[([^\]\[]{1,8})\]\s*/);
    if (m) { tag = m[1].trim(); t = t.slice(m[0].length); }
    else {
      m = t.match(/^(개념|암기|문제|이해|심화|정리|풀이|서술)\s*[:：]\s*/);
      if (m) { tag = m[1]; t = t.slice(m[0].length); }
    }
    m = t.match(/\s*[(（]([^()（）]{1,14})[)）]\s*$/);
    if (m) {
      const d = Pr.duration(m[1]);
      if (d != null) { min = d; t = t.slice(0, m.index).trim(); }
    }
    if (min == null) {
      m = t.match(/\s+[~약]?\s*(\d+)\s*분\s*$/);
      if (m) { min = +m[1]; t = t.slice(0, m.index).trim(); }
    }
    return { text: t.trim(), tag, min };
  }

  function sectionKey(title) {
    const t = title.replace(/\s+/g, '');
    if (/예습/.test(t)) return 'preview';
    if (/헷갈|질문|확인|약점|모르/.test(t)) return 'questions';
    if (/체크|할일|복습/.test(t)) return 'items';
    if (/핵심|개념|용어|키워드/.test(t)) return 'concepts';
    if (/요약|정리|내용|개요/.test(t)) return 'summary';
    if (/세부|단계|작업/.test(t)) return 'items';
    return 'other';
  }

  const isNone = s => /^\(?\s*없음\s*\)?\.?$/.test(s);
  const headingOf = l => {
    const m = l.match(/^\s*#{1,4}\s+(.*)$/) || l.match(/^\s*\*\*([^*]+)\*\*\s*$/);
    return m ? m[1] : null;
  };

  Pr.detect = function (text) {
    const t = String(text || '');
    if (/={2,}\s*할\s*일\s*={2,}/.test(t)) return 'task';
    if (/={2,}\s*복습\s*노트\s*={2,}/.test(t)) return 'note';
    if (/^\s*#{1,4}\s*.*(체크리스트|요약)/m.test(t) && /\[[ xX]\]/.test(t)) return 'note';
    return null;
  };

  Pr.parseNote = function (raw, ref) {
    const text = stripFence(raw);
    let body = extractBlock(text, '복습\\s*노트');
    if (body == null) body = text;
    const lines = body.split('\n');
    const warnings = [];
    let i = 0;
    const head = [];
    for (; i < lines.length; i++) { if (headingOf(lines[i]) != null) break; head.push(lines[i]); }
    const hd = parseHeader(head);
    const res = {
      type: 'note', subject: hd['과목'] || '', date: Pr.normDate(hd['날짜'] || '', ref),
      priority: hd['우선순위'] || '', summary: [], concepts: [], items: [], questions: [], preview: [], warnings
    };
    let key = null;
    for (; i < lines.length; i++) {
      const l = lines[i];
      if (!l.trim()) continue;
      const hh = headingOf(l);
      if (hh != null) { key = sectionKey(hh); continue; }
      if (!key || key === 'other') continue;
      if (key === 'items' || key === 'preview') {
        const it = parseItem(l);
        if (it.text && !isNone(it.text)) res[key].push(it);
      } else {
        const t = plain(l);
        if (t && !isNone(t)) res[key].push(t);
      }
    }
    if (!res.subject) warnings.push('과목을 찾지 못했어요. 아래에서 직접 고르세요.');
    if (!res.date) warnings.push('날짜를 찾지 못했어요. 아래에서 직접 입력하세요.');
    if (!res.items.length) warnings.push('복습 체크리스트 항목이 없어요.');
    if (!res.summary.length && !res.concepts.length && !res.items.length) warnings.push('내용을 거의 읽지 못했어요. 양식을 확인하세요.');
    return res;
  };

  function priorityOf(s) {
    s = String(s || '').trim();
    if (/^(상|높|high|3)/i.test(s)) return 3;
    if (/^(하|낮|low|1)/i.test(s)) return 1;
    return 2;
  }

  Pr.parseTask = function (raw, ref) {
    const text = stripFence(raw);
    let body = extractBlock(text, '할\\s*일');
    if (body == null) body = text;
    const lines = body.split('\n');
    const warnings = [];
    let i = 0;
    const head = [];
    for (; i < lines.length; i++) { if (headingOf(lines[i]) != null) break; head.push(lines[i]); }
    const hd = parseHeader(head);
    const items = [];
    for (; i < lines.length; i++) {
      const l = lines[i];
      if (!l.trim() || headingOf(l) != null) continue;
      const it = parseItem(l);
      if (it.text && !isNone(it.text)) items.push({ text: it.text, tag: it.tag, min: it.min, done: false });
    }
    let totalMin = null;
    const est = hd['예상시간'] || hd['소요시간'] || '';
    if (est) {
      totalMin = Pr.duration(est);
      if (totalMin == null && /^\s*\d+(\.\d+)?\s*$/.test(est)) {
        const n = parseFloat(est);
        totalMin = Math.round(n <= 40 ? n * 60 : n);
        warnings.push('예상시간 단위가 없어 ' + (n <= 40 ? '시간' : '분') + '으로 읽었어요.');
      }
    }
    if (totalMin == null) {
      const s = items.reduce((a, x) => a + (x.min || 0), 0);
      if (s) { totalMin = s; warnings.push('예상시간이 없어 세부 항목의 합으로 계산했어요.'); }
    }
    const res = {
      type: 'task', title: hd['제목'] || '', due: Pr.normDate(hd['마감'] || '', ref), start: Pr.normDate(hd['시작'] || '', ref),
      totalMin: totalMin || 0, splittable: !/불가|아니|^no|false/i.test(hd['쪼개기'] || ''),
      priority: priorityOf(hd['중요도']), items, warnings
    };
    if (!res.title) warnings.push('제목을 찾지 못했어요.');
    if (!res.due) warnings.push('마감일을 찾지 못했어요.');
    if (!res.totalMin) warnings.push('예상 시간을 찾지 못했어요.');
    return res;
  };

  Pr.parse = function (text, ref) {
    const kind = Pr.detect(text);
    if (kind === 'task') return Pr.parseTask(text, ref);
    if (kind === 'note') return Pr.parseNote(text, ref);
    return null;
  };

  // 과목 별칭 매칭 (공백·기호 제거 후 가장 긴 별칭 포함 여부)
  Pr.norm = s => String(s || '').toLowerCase().replace(/[\s\-_·.,()[\]]+/g, '');
  Pr.matchSubject = function (subjects, title) {
    const t = Pr.norm(title);
    if (!t) return '';
    let best = '', bl = 0;
    for (const sb of subjects) {
      const names = [sb.name, sb.short, sb.folder].concat(sb.aliases || []);
      for (const n of names) {
        const a = Pr.norm(n);
        if (a && t.includes(a) && a.length > bl) { best = sb.id; bl = a.length; }
      }
    }
    return best;
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = Pr;
  else root.NoteParser = Pr;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* core.js — 상태 로드/저장, 렌더 루프, 이벤트 위임, 타이머, 시간 기록 */
(function () {
  'use strict';
  const P = window.Planner;
  const A = window.App = {
    S: null, ENV: {}, PLAN: null, views: {}, actions: {}, onShow: {}, h: {},
    ui: { tab: 'today', finish: null, imp: { text: '', parsed: null }, inbox: null, imports: null, prompts: {}, openLesson: '', taskForm: null,
      open: null, sel: null, calMonth: null, calSel: null, dragging: false }
  };
  const h = A.h;
  const TABS = [['home', '홈'], ['today', '오늘'], ['plan', '계획'], ['routine', '루틴'], ['alloc', '할당'], ['work', '시험·과제'], ['notes', '노트'], ['settings', '설정']];

  // ---------- 헬퍼 ----------
  h.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  h.fmtMin = m => {
    m = Math.round(m);
    if (m < 60) return m + '분';
    const hh = Math.floor(m / 60), r = m % 60;
    return r ? `${hh}시간 ${r}분` : `${hh}시간`;
  };
  h.md = d => { const x = P.parse(d); return `${x.getMonth() + 1}/${x.getDate()}(${P.DOW[x.getDay()]})`; };
  h.val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  h.dday = (d, today) => { const n = P.diffDays(today || P.today(), d); return n === 0 ? 'D-day' : n > 0 ? `D-${n}` : `D+${-n}`; };
  h.fmtStamp = iso => { const d = new Date(iso); if (isNaN(d)) return ''; const hh = d.getHours(); return `${d.getMonth() + 1}/${d.getDate()} ${hh % 12 || 12}:${P.pad(d.getMinutes())} ${hh < 12 ? 'AM' : 'PM'}`; };
  h.clock = ms => {
    const s = Math.max(0, Math.floor(ms / 1000)), hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
    return (hh ? hh + ':' + P.pad(mm) : P.pad(mm)) + ':' + P.pad(ss);
  };
  h.copy = async text => {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (e2) { /* noop */ }
      ta.remove(); return ok;
    }
  };
  const getPath = (o, path) => path.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
  const setPath = (o, path, v) => { const p = path.split('.'); let t = o; for (let i = 0; i < p.length - 1; i++) t = t[p[i]]; t[p[p.length - 1]] = v; };

  A.getPath = getPath; A.setPath = setPath;

  async function api(path, body) {
    const opt = body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
    const r = await fetch(path, opt);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || r.statusText);
    return j;
  }
  A.api = api;

  // undo = { label, fn }: 토스트에 되돌리기 버튼을 붙인다 (잠시 더 오래 보인다)
  A.toast = (msg, bad, undo) => {
    const el = document.getElementById('toast');
    el.textContent = msg;
    if (undo) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'toast-undo'; b.textContent = undo.label || '되돌리기';
      b.onclick = () => { clearTimeout(A._tt); el.className = ''; undo.fn(); };
      el.appendChild(b);
    }
    el.className = 'show' + (bad ? ' bad' : '') + (undo ? ' act' : '');
    clearTimeout(A._tt); A._tt = setTimeout(() => { el.className = ''; }, undo ? 7000 : 3600);
  };

  // ---------- 저장 ----------
  let saveTimer = null, dirty = false;
  const setStatus = t => { const el = document.getElementById('savestate'); if (el) el.textContent = t; };
  const LSKEY = 'study-planner-state-v1';
  async function flush() {
    clearTimeout(saveTimer);
    if (!dirty) return;
    dirty = false;
    if (A.LOCAL) {                                                                  // 단독 실행: 이 브라우저 저장소에 저장
      try { localStorage.setItem(LSKEY, JSON.stringify(A.S)); setStatus('저장됨'); }
      catch (e) { setStatus('저장 실패'); A.toast('이 브라우저에서는 저장이 안 돼요 — 설정 → 백업에서 백업 파일을 내려받아 두세요', true); }
      return;
    }
    try { await api('/api/state', A.S); setStatus('저장됨'); }
    catch (e) { dirty = true; setStatus('저장 실패'); A.toast('저장 실패: ' + e.message, true); }
  }
  A.flush = flush;
  let roToastAt = 0;
  A.save = () => {
    if (A.RO) {                                                                    // 보기 전용 사이트: 고친 내용은 저장하지 않는다
      if (Date.now() - roToastAt > 8000) { roToastAt = Date.now(); A.toast('보기 전용이에요 — 고친 내용은 저장되지 않고 새로고침하면 사라져요', true); }
      return;
    }
    dirty = true; setStatus('저장 중…'); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 300);
  };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
  window.addEventListener('beforeunload', () => {
    if (dirty && A.LOCAL) { flush(); return; }
    if (dirty && navigator.sendBeacon) navigator.sendBeacon('/api/state', new Blob([JSON.stringify(A.S)], { type: 'application/json' }));
  });

  // ---------- 렌더 ----------
  function renderHeader() {
    const S = A.S, today = P.today();
    const next = S.exams.filter(e => e.date && e.date >= today).sort((a, b) => a.date.localeCompare(b.date))[0];
