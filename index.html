    const prev = document.getElementById('savestate');
    const keep = prev ? prev.textContent : '';
    document.getElementById('top').innerHTML = `
      <div class="wrap bar">
        <div class="brand" data-action="tab" data-tab="home" title="홈으로">기말 플래너${next ? `<span class="dd">${h.dday(next.date)} · 첫 시험 ${h.md(next.date)}</span>` : ''}</div>
        <nav>${TABS.map(([k, n]) => `<button class="tab ${A.ui.tab === k ? 'on' : ''}" data-action="tab" data-tab="${k}">${n}</button>`).join('')}</nav>
        <span id="savestate" class="muted small">${h.esc(keep)}</span>
        <button type="button" class="btn sm ghost themebtn" data-action="theme" title="화면 모드 바꾸기 (자동 → 라이트 → 다크)">${THEMES[S.settings.theme] ? THEMES[S.settings.theme][0] : THEMES.system[0]}<span class="tm-t"> ${(THEMES[S.settings.theme] || THEMES.system)[1]}</span></button>
      </div>
      ${A.RO ? `<div class="wrap robanner">👁 보기 전용 · ${A.ENV.publishedAt ? `마지막 업데이트 ${h.fmtStamp(A.ENV.publishedAt)}` : '올려 둔 복사본'} <span class="muted small">— 체크·수정은 PC의 앱에서 해요</span></div>` : ''}
      ${h.cloudBanner ? h.cloudBanner() : ''}
      ${S.timer ? `<div class="wrap timerbar"><span>⏱ <b>${h.esc(S.timer.label)}</b> <span data-timerbar></span></span><button class="btn sm" data-action="timerstop">정지</button></div>` : ''}`;
    document.documentElement.style.setProperty('--hdr', document.getElementById('top').offsetHeight + 'px');   // 고정되는 칸이 헤더(타이머 줄 포함) 아래에 붙도록
    const nv = document.querySelector('#top nav'), on = nv && nv.querySelector('.tab.on');   // 좁은 화면: 현재 탭이 보이도록 탭 줄을 맞춘다
    if (on && nv.scrollWidth > nv.clientWidth) nv.scrollLeft = Math.max(0, on.getBoundingClientRect().left - nv.getBoundingClientRect().left + nv.scrollLeft - 24);
  }

  A.render = function () {
    if (!A.S) return;
    A.PLAN = P.plan(A.S);
    renderHeader();
    const y = window.scrollY;
    const w0 = document.querySelector('.tlwrap'), t0 = w0 && w0.querySelector('.tl');
    const keep = w0 && t0 ? { date: t0.dataset.date, top: w0.scrollTop } : null;
    const wk0 = document.querySelector('.wk-wrap'), wkTop = wk0 ? wk0.scrollTop : null;
    document.getElementById('main').innerHTML = (A.views[A.ui.tab] || A.views.today)(A.S, A.PLAN);
    window.scrollTo(0, y);
    const w1 = document.querySelector('.tlwrap'), t1 = w1 && w1.querySelector('.tl');
    if (w1 && t1) {
      if (keep && keep.date === t1.dataset.date) w1.scrollTop = keep.top;
      else {
        const target = t1.querySelector('.now') || t1.querySelector('.tb');
        if (target) w1.scrollTop = Math.max(0, target.offsetTop - 60);
      }
    }
    const wk1 = document.querySelector('.wk-wrap');
    if (wk1) {
      if (wkTop != null) wk1.scrollTop = wkTop;
      else { const f = wk1.querySelector('.wb'); wk1.scrollTop = f ? Math.max(0, f.offsetTop - 80) : Math.max(0, (18 * 60 - (+wk1.closest('.wk').dataset.t0)) * 1.2 - 40); }
    }
    tick();
  };
  let pending = false, mouseDown = false;
  A.renderSoon = () => { if (mouseDown) pending = true; else A.render(); };
  document.addEventListener('mousedown', () => { mouseDown = true; }, true);
  document.addEventListener('mouseup', () => {
    mouseDown = false;
    if (pending) setTimeout(() => { if (pending) { pending = false; A.render(); } }, 0);
  }, true);

  function tick() {
    const S = A.S;
    if (!S) return;
    document.querySelectorAll('[data-timer]').forEach(el => {
      const k = el.dataset.timer;
      let ms = (S.acc[k] || 0) * 60000;
      if (S.timer && S.timer.key === k) ms += Date.now() - S.timer.startedAt;
      el.textContent = ms >= 1000 ? h.clock(ms) : '';
    });
    const tb = document.querySelector('[data-timerbar]');
    if (tb && S.timer) tb.textContent = h.clock(Date.now() - S.timer.startedAt);
  }
  setInterval(tick, 1000);
  setInterval(() => {
    const ae = document.activeElement;
    if (!document.hidden && !A.ui.dragging && (A.ui.tab === 'home' || A.ui.tab === 'today' || A.ui.tab === 'plan') && !(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))) A.render();
  }, 60000);

  // ---------- 이벤트 위임 ----------
  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-action]');
    if (!el) return;
    const fn = A.actions[el.dataset.action];
    if (!fn) return;
    try { fn(el, ev); } catch (e) { console.error(e); A.toast('오류: ' + e.message, true); }
  });

  // data-enter="버튼id" 인 입력칸에서 Enter 를 누르면 그 버튼을 누른다 (한글 조합 중의 Enter 는 무시)
  document.addEventListener('keydown', ev => {
    const el = ev.target;
    if (ev.key !== 'Enter' || ev.isComposing || ev.keyCode === 229 || !el.dataset || !el.dataset.enter) return;
    const b = document.getElementById(el.dataset.enter);
    if (b) { ev.preventDefault(); b.click(); }
  });

  document.addEventListener('change', ev => {
    const el = ev.target.closest('[data-bind]');
    if (!el) return;
    const type = el.dataset.type || 'str', path = el.dataset.bind;
    let v;
    if (el.type === 'checkbox') v = el.checked;
    else if (type === 'int') { v = parseInt(el.value, 10); if (isNaN(v)) v = null; }
    else if (type === 'tmin') v = el.value ? P.toMin(el.value) : null;     // 'HH:MM' 선택 → 분 (비우면 null)
    else if (type === 'hours') { v = Math.round(parseFloat(el.value) * 60); if (isNaN(v)) v = 0; }
    else if (type === 'list') v = el.value.split(',').map(s => s.trim()).filter(Boolean);
    else if (type === 'hm') {
      const m = /^(\d{1,2}):(\d{2})$/.exec(el.value.trim());
      if (el.value.trim() === '') v = '';
      else if (!m || +m[1] > 24 || +m[2] > 59 || (+m[1] === 24 && +m[2] > 0)) {
        A.toast('시간은 HH:MM 형식으로 입력하세요 (예: 18:30)', true);
        el.value = getPath(path.startsWith('ui.') ? A : A.S, path) || '';
        return;
      } else { v = P.pad(+m[1]) + ':' + m[2]; el.value = v; }
    } else v = el.value;
    const isUi = path.startsWith('ui.');
    setPath(isUi ? A : A.S, path, v);
    if (!isUi) A.save();
    if (el.hasAttribute('data-render')) A.renderSoon();
  });
  document.addEventListener('input', ev => { if (ev.target.id === 'imp-text') A.ui.imp.text = ev.target.value; });

  // ---------- 탭 ----------
  A.setTab = function (tab) {
    if (!A.views[tab]) tab = 'today';
    if (tab !== A.ui.tab) A.ui.evForm = null;      // 열어 둔 일정 입력 폼은 탭을 옮기면 닫는다
    A.ui.tab = tab;
    if (location.hash.slice(1) !== tab) history.replaceState(null, '', '#' + tab);
    if (A.onShow[tab]) A.onShow[tab]();
    A.render();
    window.scrollTo(0, 0);
  };
  A.actions.tab = el => A.setTab(el.dataset.tab);

  // ---------- 화면 모드 (자동 = Windows 설정을 따름 / 라이트 / 다크) ----------
  const THEMES = { system: ['◐', '자동'], light: ['☀', '라이트'], dark: ['☾', '다크'] };
  A.applyTheme = t => {
    t = THEMES[t] ? t : 'system';
    const r = document.documentElement;
    if (t === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', t);
    try { localStorage.setItem('planner-theme', t); } catch (e) { /* 저장소를 못 쓰면 이번 접속에만 적용 */ }
  };
  A.setTheme = t => { A.S.settings.theme = THEMES[t] ? t : 'system'; A.applyTheme(A.S.settings.theme); if (!A.RO) A.save(); A.render(); };
  A.actions.theme = () => {
    const order = Object.keys(THEMES), cur = THEMES[A.S.settings.theme] ? A.S.settings.theme : 'system';
    const next = order[(order.indexOf(cur) + 1) % order.length];
    A.setTheme(next);
    A.toast(`화면 모드: ${THEMES[next][1]}${next === 'system' ? ' (Windows 설정을 따라요)' : ''}`);
  };
  A.actions.settheme = el => A.setTheme(el.dataset.val);

  // ---------- 테마: 색 팔레트 · 글꼴 · 스타일 ----------
  // 고른 값은 설정(S.settings)과 이 기기(localStorage 'planner-look')에 함께 저장 → 다음에 열 때 index.html 머리 스크립트가 바로 적용해 깜빡이지 않는다
  const BASEFONT = '"Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif';
  A.LOOKS = {
    palette: { indigo: ['기본', ['#4f46e5', '#eceeff', '#f4f5f8']], ocean: ['바다', ['#0369a1', '#e0f2fe', '#f2f7fa']], forest: ['숲', ['#15803d', '#e3f4e8', '#f3f7f3']],
      sunset: ['노을', ['#ea580c', '#ffedd5', '#faf6f2']], sakura: ['벚꽃', ['#db2777', '#fce7f3', '#faf4f6']], lavender: ['라벤더', ['#7c3aed', '#f1e8ff', '#f6f4fa']], mono: ['모노', ['#334155', '#e8ebf0', '#f4f4f5']] },
    font: { system: ['기본', '', ''], noto: ['노토 산스', 'Noto+Sans+KR:wght@400;600;700', "'Noto Sans KR'"], gowun: ['고운 돋움', 'Gowun+Dodum', "'Gowun Dodum'"],
      myeongjo: ['나눔 명조', 'Nanum+Myeongjo:wght@400;700;800', "'Nanum Myeongjo', serif"], jua: ['주아', 'Jua', "'Jua'"], pen: ['손글씨', 'Nanum+Pen+Script', "'Nanum Pen Script'"] },
    style: { base: ['기본', '둥근 카드'], flat: ['각지게', '선과 직각'], soft: ['둥글게', '알약 버튼'], compact: ['촘촘하게', '한 화면에 더 많이'] }
  };
  const pick = (k, v) => (A.LOOKS[k][v] ? v : Object.keys(A.LOOKS[k])[0]);
  A.applyLook = function (st) {
    const r = document.documentElement, pal = pick('palette', st.palette), font = pick('font', st.font), sty = pick('style', st.style);
    if (pal === 'indigo') r.removeAttribute('data-palette'); else r.setAttribute('data-palette', pal);
    if (sty === 'base') r.removeAttribute('data-style'); else r.setAttribute('data-style', sty);
    if (font === 'system') r.removeAttribute('data-font'); else r.setAttribute('data-font', font);
    const f = A.LOOKS.font[font];
    r.style.setProperty('--font', f[2] ? f[2] + ', ' + BASEFONT : BASEFONT);
    let link = document.getElementById('font-css');
    if (f[1]) {                                                   // 고른 글꼴만 구글 폰트에서 불러온다 (인터넷이 없으면 기본 글꼴로 보임)
      const href = 'https://fonts.googleapis.com/css2?family=' + f[1] + '&display=swap';
      if (!link) { link = document.createElement('link'); link.id = 'font-css'; link.rel = 'stylesheet'; document.head.appendChild(link); }
      if (link.getAttribute('href') !== href) link.setAttribute('href', href);
    } else if (link) link.remove();
    try { localStorage.setItem('planner-look', JSON.stringify({ palette: pal, font, style: sty })); } catch (e) { /* noop */ }
  };
  A.setLook = function (k, v) {
    A.S.settings[k] = pick(k, v);
    A.applyLook(A.S.settings);
    if (!A.RO) A.save();
    A.render();
  };
  A.actions.setlook = el => A.setLook(el.dataset.k, el.dataset.v);
  A.actions.resetlook = () => { for (const k of ['palette', 'font', 'style']) A.S.settings[k] = Object.keys(A.LOOKS[k])[0]; A.applyLook(A.S.settings); if (!A.RO) A.save(); A.render(); };
  A.actions.timerstop = () => A.timerStop();
  window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (t && t !== A.ui.tab) A.setTab(t); });

  // ---------- 타이머 / 시간 기록 ----------
  const isJob = k => /^(exam|final|task)\|/.test(k);
  A.isJob = isJob;

  A.timerStart = function (key, label) {
    const S = A.S;
    if (S.timer && S.timer.key === key) return;
    if (S.timer) A.timerStop(true);
    S.timer = { key, label, startedAt: Date.now() };
    A.save(); A.render();
  };
  A.timerStop = function (silent) {
    const S = A.S, t = S.timer;
    if (!t) return;
    let m = (Date.now() - t.startedAt) / 60000;
    S.timer = null;
    if (m > 180) {
      const a = window.prompt(`타이머가 ${Math.round(m)}분 동안 켜져 있었어요. 실제로 몇 분 공부했나요?`, '0');
      m = Math.max(0, parseFloat(a) || 0);
    }
    if (isJob(t.key)) { if (m >= 0.5) A.addWork(t.key, Math.max(1, Math.round(m)), 'timer'); }
    else S.acc[t.key] = (S.acc[t.key] || 0) + m;
    if (!silent) { A.save(); A.render(); }
  };

  function applyJobMinutes(jobId, delta) {
    const S = A.S, [kind, id] = jobId.split('|');
    if (kind === 'exam' || kind === 'final') {
      const e = S.exams.find(x => x.id === id);
      if (!e) return '';
      if (kind === 'exam') e.partial = Math.max(0, (e.partial || 0) + delta);
      else e.finalSpent = Math.max(0, (e.finalSpent || 0) + delta);
      return e.sid;
    }
    const t = S.tasks.find(x => x.id === id);
    if (!t) return '';
    t.spent = Math.max(0, (t.spent || 0) + delta);
    return t.sid || '';
  }
  A.addWork = function (jobId, min, src, quiet) {
    const S = A.S, today = P.today();
    if (S.timer && S.timer.key === jobId && src !== 'timer') S.timer = null; // 직접 기록하면 같은 작업의 타이머는 버린다
    const sid = applyJobMinutes(jobId, min);
    S.work.push({ date: today, key: jobId, min, src, ts: Date.now() });
    S.log.push({ ts: Date.now(), date: today, key: jobId, kind: jobId.split('|')[0], sid, est: 0, act: min, src });
    if (!quiet) { A.save(); A.render(); }
  };
  A.undoWork = function (jobId) {
    const S = A.S, today = P.today();
    let i = -1;
    for (let k = S.work.length - 1; k >= 0; k--) if (S.work[k].key === jobId && S.work[k].date === today) { i = k; break; }
    if (i < 0) return;
    const w = S.work.splice(i, 1)[0];
    applyJobMinutes(jobId, -w.min);
    for (let k = S.log.length - 1; k >= 0; k--) if (S.log[k].key === jobId && S.log[k].ts === w.ts) { S.log.splice(k, 1); break; }
    A.save(); A.render();
  };

  // 기존 할 일에 묶인 일정(c.ref)을 끝내면 그 할 일도 처리: 중요 할 일은 끝냄, 과제는 걸린 시간을 기록
  A.linkDone = (c, actual) => {
    if (c.alloc) { const f = P.allocFind(A.S, c.alloc); if (f && !f.item.done) { f.item.done = true; f.item.doneDate = P.today(); c.allocDone = true; } }   // 할당 항목 완료
    if (!c.ref) return;
    const S = A.S, i = c.ref.indexOf(':'), kind = c.ref.slice(0, i), id = c.ref.slice(i + 1);
    if (kind === 'imp') { const it = S.important.find(x => x.id === id); if (it && !it.done) { it.done = true; c.refDone = true; } }
    else if (kind === 'task' && S.tasks.some(t => t.id === id && !t.done)) { A.addWork('task|' + id, actual, 'done', true); c.refWork = actual; }
  };
  A.linkUndo = c => {
    if (c.allocDone) { const f = P.allocFind(A.S, c.alloc); if (f) { f.item.done = false; delete f.item.doneDate; } delete c.allocDone; }
    delete c.doneDate;
    if (!c.ref) return;
    const S = A.S, i = c.ref.indexOf(':'), kind = c.ref.slice(0, i), id = c.ref.slice(i + 1);
    if (c.refDone) { const it = S.important.find(x => x.id === id); if (it) it.done = false; delete c.refDone; }
    if (c.refWork) { delete c.refWork; A.undoWork('task|' + id); }
  };
  A.finishItem = function (key, actual) {
    const S = A.S, parts = key.split('|');
    if (parts[0] === 'st' || parts[0] === 'rb' || parts[0] === 'rr') return A.finishStudy(key, actual);
    actual = Math.max(1, Math.round(actual));
    if (S.timer && S.timer.key === key) S.timer = null;
    delete S.acc[key];
    const e = A.PLAN.days[0].entries.find(x => x.id === key);
    if (parts[0] === 'cu') {                       // 내가 추가한 공부 할 일
      const c = S.custom.find(x => x.id === parts[1]);
      if (c) { c.done = true; c.actual = actual; c.doneDate = P.today(); A.linkDone(c, actual); }
      S.log.push({ ts: Date.now(), date: P.today(), key, kind: 'custom', sid: '', est: e ? e.min : 0, act: actual, src: 'done' });
    } else {
      const kind = parts[0] === 'rev' ? 'review' : 'preview', sid = parts[2];
      S.progress[key] = { done: true, actual, doneDate: P.today(), ts: Date.now() };
      S.log.push({ ts: Date.now(), date: P.today(), key, kind, sid, est: e ? e.min : 0, act: actual, src: 'done' });
    }
    A.ui.finish = null;
    A.save(); A.render();
  };
  // 과목 블록 완료: 걸린 시간을 부분(복습·예습·시험 대비)의 계획 시간 비율로 나눠 기록한다
  A.finishStudy = function (key, actual) {
    const S = A.S, today = P.today();
    const e = A.PLAN.days[0].entries.find(x => x.id === key);
    if (!e) return;
    actual = Math.max(1, Math.round(actual));
    if (S.timer && S.timer.key === key) S.timer = null;
    delete S.acc[key];
    const total = e.parts.reduce((a, p) => a + p.min, 0) || 1;
    let left = actual;
    e.parts.forEach((p, i) => {
      const share = i === e.parts.length - 1 ? left : Math.max(0, Math.min(left, Math.round(actual * p.min / total)));
      left -= share;
      if (p.item) {
        const act = Math.max(1, share);
        S.progress[p.item.key] = { done: true, actual: act, doneDate: today, ts: Date.now() };
        S.log.push({ ts: Date.now(), date: today, key: p.item.key, kind: p.k, sid: e.sid, est: p.min, act, src: 'done' });
      } else if (share > 0) A.addWork(p.job.id, share, 'done', true);
    });
    A.ui.finish = null;
    A.save(); A.render();
  };
  A.undoItem = function (key) {
    const S = A.S;
    if (key.startsWith('cu|')) { const c = S.custom.find(x => x.id === key.slice(3)); if (c) { c.done = false; delete c.actual; A.linkUndo(c); } }
    else delete S.progress[key];
    for (let k = S.log.length - 1; k >= 0; k--) if (S.log[k].key === key) { S.log.splice(k, 1); break; }
    A.save(); A.render();
  };

  A.toggleChapter = function (exId, i, done) {
    const e = A.S.exams.find(x => x.id === exId);
    if (!e || !e.scope[i]) return;
    const c = e.scope[i];
    c.done = !!done;
    if (done) e.partial = Math.max(0, (e.partial || 0) - (c.min || A.S.settings.minDefaults.chapter));
    A.save(); A.render();
  };

  // ---------- 손으로 고정한 시간 ----------
  // 다른 곳(클라우드)에서 받은 상태로 통째로 바꾼다
  A.replaceState = function (st) {
    A.S = migrate(st);
    A.applyTheme(A.S.settings.theme);
    A.applyLook(A.S.settings);
    A.save(); A.render();
  };
  A.setManual = function (date, id, patch) {
    const S = A.S;
    S.manual[date] = S.manual[date] || {};
    S.manual[date][id] = Object.assign({}, S.manual[date][id], patch);
    A.save(); A.render();
  };
  A.clearManual = function (date, id) {
    const S = A.S;
    const revive = m => { for (const k of (m && m.skippedKeys) || []) if (S.progress[k] && S.progress[k].byBlock) delete S.progress[k]; };   // 블록을 빼며 ‘안 함’ 처리했던 복습·예습
    if (id) revive(S.manual[date] && S.manual[date][id]); else for (const m of Object.values(S.manual[date] || {})) revive(m);
    if (id) {
      if (S.manual[date]) { delete S.manual[date][id]; if (!Object.keys(S.manual[date]).length) delete S.manual[date]; }
      if (S.layout[date]) { delete S.layout[date][id]; if (!Object.keys(S.layout[date]).length) delete S.layout[date]; }
    } else { delete S.manual[date]; delete S.layout[date]; }
    A.save(); A.render();
  };
  // 한 블록을 옮기거나 빼기 전에 그날 나머지 블록의 현재 자리를 고정해 둔다 → 다른 블록이 따라 움직이지 않는다
  A.freezeDay = function (date) {
    const S = A.S;
    if (S.layout[date]) return;
    const D = A.PLAN.days.find(x => x.date === date);
    if (!D) return;
    const L = {};
    for (const e of D.entries) if ((!e.custom || (e.custom.start == null && !e.carried)) && e.pieces.length === 1) L[e.id] = e.pieces[0][0];
    S.layout[date] = L;
  };

  // ---------- 로더 ----------
  A.loadInbox = async function () {
    if (A.RO || A.LOCAL) { A.ui.inbox = { files: [], error: '이 화면에서는 파일 정리를 쓸 수 없어요' }; return; }
    await flush(); // 서버는 저장된 설정(폴더 경로)을 읽으므로 먼저 저장을 끝낸다
    try { A.ui.inbox = await api('/api/inbox'); } catch (e) { A.ui.inbox = { files: [], error: e.message }; }
    if (A.ui.tab === 'notes') A.renderSoon();
  };
  A.loadImports = async function () {
    if (A.RO || A.LOCAL) { A.ui.imports = { files: [] }; return; }
    await flush();
    try { A.ui.imports = await api('/api/imports'); } catch (e) { A.ui.imports = { files: [], error: e.message }; }
    if (A.ui.tab === 'notes') A.renderSoon();
  };

  // ---------- 부팅 ----------
  function migrate(S) {
    const D = P.defaultState(A.ENV), DS = P.defaultSettings(A.ENV);
    S.settings = Object.assign({}, DS, S.settings || {});
    S.settings.minDefaults = Object.assign({}, DS.minDefaults, S.settings.minDefaults || {});
    for (const k of ['subjects', 'timetable', 'fixed', 'milestones', 'exams', 'tasks', 'work', 'log', 'custom', 'routines', 'important', 'allocs']) if (!Array.isArray(S[k])) S[k] = D[k];
    for (const k of ['dayOverrides', 'lessons', 'progress', 'checks', 'acc', 'layout']) if (!S[k] || typeof S[k] !== 'object') S[k] = {};
    for (const r of S.routines) { r.starts = r.starts || {}; r.durs = r.durs || {}; }
    for (const sb of S.subjects) { sb.rvStarts = sb.rvStarts || {}; sb.rvDurs = sb.rvDurs || {}; }
    // 한 번만: 예전엔 시각이 요일마다 따로 저장됐다. 정해 둔 시각이 전부 같으면 ‘모든 요일의 기본’으로 승격해 반복되게 한다.
    S.migr = S.migr && typeof S.migr === 'object' ? S.migr : {};
    if (!S.migr.defaultStart) {
      const same = o => { const v = Object.values(o); return v.length > 0 && v.every(x => x === v[0]) ? v[0] : null; };
      for (const r of S.routines) {
        const t = same(r.starts), m = same(r.durs);
        if (r.start == null && t != null) { r.start = t; r.starts = {}; }
        if (m != null && m !== r.min) { r.min = m; r.durs = {}; }
      }
      for (const sb of S.subjects) {
        const t = same(sb.rvStarts);
        if (sb.rvStart == null && t != null) { sb.rvStart = t; sb.rvStarts = {}; }
      }
      S.migr.defaultStart = true;
      A._migrated = true;
    }
    if (!('timer' in S)) S.timer = null;
    if (!S.manual || typeof S.manual !== 'object') S.manual = {};
    if (JSON.stringify(S.settings.weekendBlocks) === JSON.stringify([['18:30', '21:00'], ['21:30', '24:00']])) S.settings.weekendBlocks = [['08:00', '24:00']];
    const t0 = P.today();
    for (const d of Object.keys(S.manual)) if (d < t0) delete S.manual[d];
    for (const d of Object.keys(S.layout)) if (d < t0) delete S.layout[d];
    if (!S.settings.studyRoot && A.ENV.studyRoot) S.settings.studyRoot = A.ENV.studyRoot;
    if (!S.settings.inbox && A.ENV.inbox) S.settings.inbox = A.ENV.inbox;
    return S;
  }

  A.boot = async function () {
    try {
      // 서버가 없는 곳(GitHub Pages 등)이면 올려 둔 복사본(snapshot.json)을 보기 전용으로 연다
      const local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname), forceRO = !local || /[?&]ro\b/.test(location.search);
      let r = null;
      if (window.__STANDALONE__) {                                                    // 공유용 HTML 파일 하나: 서버 없이 이 브라우저에 저장
        A.LOCAL = true; document.body.classList.add('local');
        let saved = null;
        try { saved = JSON.parse(localStorage.getItem(LSKEY) || 'null'); } catch (e) { saved = null; }
        A.firstRun = !saved;
        r = { state: saved, env: { standalone: true } };
      }
      if (!r && !forceRO) { try { r = await api('/api/state'); } catch (e) { r = null; } }
      if (!r) {
        const resp = await fetch('snapshot.json?t=' + Date.now());
        if (!resp.ok) throw new Error('서버에도 올려 둔 복사본에도 연결할 수 없어요');
        const snap = await resp.json();
        A.RO = true; document.body.classList.add('ro'); r = { state: snap.state, env: { publishedAt: snap.publishedAt } };
      }
      A.ENV = r.env || {};
      A.S = migrate(r.state || (A.LOCAL ? P.emptyState() : P.defaultState(A.ENV)));
      if (A.RO) { try { const t = localStorage.getItem('planner-theme'); if (t) A.S.settings.theme = t; } catch (e) { /* noop */ } }   // 보기 전용: 이 기기에서 고른 화면 모드를 우선
      if (A.RO) { try { Object.assign(A.S.settings, JSON.parse(localStorage.getItem('planner-look') || '{}')); } catch (e) { /* noop */ } }
      A.applyTheme(A.S.settings.theme);
      A.applyLook(A.S.settings);
      if (!r.state || A._migrated) A.save();
      A.ui.prompts = A.LOCAL ? (window.__PROMPTS__ || {}) : A.RO ? {} : await api('/api/prompts').catch(() => ({}));
      const t = location.hash.slice(1);
      A.ui.tab = A.views[t] ? t : 'home';
      if (A.onShow[A.ui.tab]) A.onShow[A.ui.tab]();
      A.render();
      if (A.cloudBoot) A.cloudBoot();                                                  // 클라우드에 연결돼 있으면 맞추기
      if (A.tourAuto) A.tourAuto();                                                    // 공유용을 처음 열면 사용법 안내
    } catch (e) {
      document.getElementById('main').innerHTML = `<div class="card"><h2>서버에 연결할 수 없어요</h2><p>실행.bat 으로 서버를 켠 뒤 새로고침하세요.</p><pre class="prompt">${h.esc(e.message)}</pre></div>`;
    }
  };
})();

</script>
<script>
/* widgets.js — 설정/시험·과제 화면에서 쉽게 값을 정하는 공용 위젯 (스위치, ± 스테퍼, 선택 버튼, 색 고르기, 시간 선택) */
(function () {
  'use strict';
  const A = window.App, P = window.Planner, h = A.h, esc = h.esc;

  // 켜고 끄는 스위치 한 줄 (제목 + 설명)
  h.sw = (path, on, label, desc, rerender) =>
    `<label class="swrow"><span class="swt"><b>${esc(label)}</b>${desc ? `<small>${esc(desc)}</small>` : ''}</span>
      <span class="sw"><input type="checkbox" data-bind="${path}" ${rerender ? 'data-render="1"' : ''} ${on ? 'checked' : ''}><i></i></span></label>`;

  // 숫자 − 값 +  (o: step, min, max, unit, def(비어 있을 때 기본값), hours(저장은 분, 표시는 시간))
  h.step = (path, val, o) => {
    o = o || {};
    const step = o.step || (o.hours ? 30 : 5), min = o.min != null ? o.min : 0, max = o.max != null ? o.max : 99999;
    const show = val == null ? '' : (o.hours ? Math.round(val / 6) / 10 : val);
    const btn = (d, t) => `<button type="button" data-action="step" data-path="${path}" data-d="${d}" data-min="${min}" data-max="${max}" data-def="${o.def != null ? o.def : ''}">${t}</button>`;
    return `<span class="stp">${btn(-step, '−')}<input type="number" data-bind="${path}" data-render="1" data-type="${o.hours ? 'hours' : 'int'}" value="${show}" placeholder="${o.def != null ? (o.hours ? o.def / 60 : o.def) : ''}" step="${o.hours ? 0.5 : step}"><em>${o.unit || ''}</em>${btn(step, '＋')}</span>`;
  };

  // 선택 버튼 묶음 (options: [[값, 라벨], ...])
  h.seg = (path, val, options, type) =>
    `<span class="segb">${options.map(([v, n]) => `<button type="button" class="${String(val) === String(v) ? 'on' : ''}" data-action="setval" data-path="${path}" data-val="${esc(v)}" data-type="${type || 'str'}">${esc(n)}</button>`).join('')}</span>`;

  h.swatches = (path, val) =>
    `<span class="swatches">${P.COLORS.map(c => `<button type="button" class="${c === val ? 'on' : ''}" style="background:${c}" data-action="setval" data-path="${path}" data-val="${c}" title="${c}"></button>`).join('')}</span>`;

  // 15분 단위 시간 목록 (다음날 새벽 2시=26:00 까지 고를 수 있다). opt: { render: 바꾸면 화면 갱신, id: 상태와 연결하지 않고 id로만 읽기 }
  h.tsel = (path, val, isEnd, opt) => {
    opt = opt || {};
    const opts = [];
    for (let m = isEnd ? 15 : 0; m <= (isEnd ? P.DAY_END : P.DAY_END - 15); m += 15) opts.push(P.hm(m));
    if (val && !opts.includes(val)) { opts.push(val); opts.sort(); }
    const attr = opt.id ? `id="${opt.id}"` : `data-bind="${path}" ${opt.render || opt.tmin ? 'data-render="1"' : ''} ${opt.tmin ? 'data-type="tmin"' : ''}`;
    return `<select class="tsel" ${attr}>${val && !opt.none ? '' : `<option value="" ${val ? '' : 'selected'}>${opt.none || '시간 선택'}</option>`}${opts.map(o => `<option value="${o}" ${o === val ? 'selected' : ''}>${o === '24:00' ? '12:00 AM (자정)' : P.toMin(o) > 1440 ? P.t12str(o) + ' (다음날)' : P.t12str(o)}</option>`).join('')}</select>`;
  };

  // 하루(0~24시) 막대: 가용 시간대를 한눈에
  h.dayBar = blocks => `<div class="daybar">${blocks.map(([a, b]) => {
    const s = P.toMin(a), e = P.toMin(b);
    return e > s ? `<i style="left:${s / (P.DAY_END / 100)}%;width:${(e - s) / (P.DAY_END / 100)}%" title="${a}~${b}"></i>` : '';
  }).join('')}<span style="left:23%">6 AM</span><span style="left:46%">12 PM</span><span style="left:69%">6 PM</span><span style="left:92%">12 AM</span></div>`;

  // ---------- 액션 ----------
  const Ac = A.actions;
  const rootOf = path => (path.startsWith('ui.') ? A : A.S);
  Ac.step = el => {
    const path = el.dataset.path, root = rootOf(path);
    let cur = A.getPath(root, path);
    if (cur == null || isNaN(cur)) cur = parseFloat(el.dataset.def);
    if (isNaN(cur)) cur = 0;
    const v = Math.max(+el.dataset.min, Math.min(+el.dataset.max, cur + parseFloat(el.dataset.d)));
    A.setPath(root, path, v);
    if (root === A.S) A.save();
    A.render();
  };
  Ac.setval = el => {
    const path = el.dataset.path, root = rootOf(path), t = el.dataset.type;
    const v = t === 'int' ? parseInt(el.dataset.val, 10) : el.dataset.val;
    A.setPath(root, path, v);
    if (root === A.S) A.save();
    A.render();
  };
})();

</script>
<script>
/* timeline.js — 시간대별 타임라인(드래그로 이동·길이 조절·삭제), 하루 일정 추가, 오늘/캘린더 탭 공용 헬퍼 */
(function () {
  'use strict';
  const A = window.App, P = window.Planner, h = A.h, esc = h.esc;
  const PPM = 1.8;   // 분당 픽셀 (60분 = 108px)
  const SNAP = 5;    // 5분 단위로 맞춤

  h.KIND = { study: '공부', review: '복습', preview: '예습', exam: '시험 대비', final: '직전 정리', task: '대회·과제' };
  h.partsLabel = (e, withMin) => e.parts.map(p => (p.k === 'routine' ? p.item.routine.title : { review: '복습', preview: '예습', exam: '시험 대비', final: '직전 정리' }[p.k]) + (withMin ? ` ${p.min}분` : '')).join(withMin ? ' · ' : '·');
  h.kindLabel = e => (e.custom ? (e.custom.alloc ? ((P.allocFind(A.S, e.custom.alloc) || { a: { title: '할당' } }).a.title) : (e.custom.kind === 'event' ? '일정' : '할 일')) : h.KIND[e.kind]);
  const isJobKind = e => e.kind === 'task';

  h.colorOf = (S, e) => {
    if (e.custom) { const f = e.custom.alloc && P.allocFind(S, e.custom.alloc); return f ? f.a.color : (e.custom.color || (e.custom.kind === 'event' ? '#64748b' : '#0ea5e9')); }
    const sb = P.subj(S, e.sid);
    return sb ? sb.color : (e.kind === 'task' ? '#d97706' : '#64748b');
  };
  h.rgba = (hex, a) => {
    const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || '');
    return m ? `rgba(${parseInt(m[1], 16)},${parseInt(m[2], 16)},${parseInt(m[3], 16)},${a})` : `rgba(100,116,139,${a})`;
  };
  // 시각이 정해진 고정 블록(루틴 또는 복습)의 제목·보조 문구
  h.fixedTitle = (S, e) => { const it = e.parts[0].item, sb = P.subj(S, e.sid); return it.routine ? it.routine.title : `${sb ? sb.name : ''} 복습`; };
  h.fixedSub = (S, e) => { const it = e.parts[0].item; return it.routine ? (it.routine.amount || (P.subj(S, e.sid) || {}).name || '') : '수업 후 복습'; };
  h.titleOf = (S, e) => {
    if (e.custom) return e.custom.title;
    if (e.routine) return e.routine.title;
    const sb = P.subj(S, e.sid), n = sb ? sb.name : '';
    if (e.kind === 'study') return e.fixedRoutine ? h.fixedTitle(S, e) : n;
    if (e.kind === 'review') return `${n} 복습`;
    if (e.kind === 'preview') return `${n} 예습`;
    return e.job.title;
  };
  h.jobTitleByKey = (S, key) => {
    const [k, id] = key.split('|');
    if (k === 'task') { const t = S.tasks.find(x => x.id === id); return t ? t.title : '과제'; }
    const e = S.exams.find(x => x.id === id), sb = e && P.subj(S, e.sid);
    return sb ? `${sb.name} ${k === 'final' ? '직전 정리' : ((e && e.label) || '기말 대비')}` : '시험 대비';
  };
  h.titleByKey = (S, key) => {
    const p = key.split('|');
    if (p[0] === 'rev' || p[0] === 'pre') { const sb = P.subj(S, p[2]); return `${sb ? sb.name : ''} ${p[0] === 'rev' ? '복습' : '예습'}`; }
    if (p[0] === 'rr') { const sb = P.subj(S, p[2]); return `${sb ? sb.name : ''} 복습`; }
    if (p[0] === 'rt' || p[0] === 'rb') { const r = S.routines.find(x => x.id === p[2]); return r ? r.title : '루틴'; }
    if (p[0] === 'st') { const sb = P.subj(S, p[2]); return sb ? sb.name : '공부'; }
    if (p[0] === 'cu') { const c = S.custom.find(x => x.id === p[1]); return c ? c.title : '일정'; }
    return h.jobTitleByKey(S, key);
  };

  // ---------- 렌더 ----------
  // D: PLAN.days 의 한 날. opt.editable 이면 끌어서 옮기고 길이를 바꾸고 뺄 수 있다.
  h.timeline = function (S, D, opt) {
    opt = opt || {};
    const editable = !!opt.editable, isToday = D.t === 0;
    const full = P.blocksFor(S, D.date);
    let lo = Infinity, hi = -Infinity;
    for (const [a, b] of full) { lo = Math.min(lo, a); hi = Math.max(hi, b); }
    for (const e of D.entries) for (const [a, b] of e.pieces) { lo = Math.min(lo, a); hi = Math.max(hi, b); }
    if (!isFinite(lo)) { lo = 18 * 60; hi = 24 * 60; }
    lo = Math.max(0, Math.floor((lo - 30) / 60) * 60);
    hi = Math.min(P.DAY_END, Math.ceil((hi + 30) / 60) * 60);
    if (hi - lo < 240) hi = Math.min(P.DAY_END, lo + 240);

    // 내 일정이 차지한 시간도 '가용'처럼 보이도록, 원래 가용 시간(내 일정 제외 전)을 다시 계산
    const avail = P.blocksFor(Object.assign({}, S, { custom: [] }), D.date);
    let html = `<div class="tl ${editable ? 'edit' : ''}" data-date="${D.date}" data-t0="${lo}" style="height:${(hi - lo) * PPM}px">`;
    for (const [a, b] of avail) {
      const s = Math.max(a, lo), f = Math.min(b, hi);
      if (f > s) html += `<div class="av" style="top:${(s - lo) * PPM}px;height:${(f - s) * PPM}px"></div>`;
    }
    for (let m = lo; m <= hi; m += 60) html += `<div class="hr" style="top:${(m - lo) * PPM}px"><span>${P.t12s(m)}</span></div>`;
    if (isToday) {
      const n = P.nowMin();
      if (n >= lo && n <= hi) html += `<div class="now" style="top:${(n - lo) * PPM}px"><i></i></div>`;
    }
    for (const e of D.entries) {
      const c = h.colorOf(S, e), running = S.timer && S.timer.key === e.id;
      const cls = [e.custom ? 'cu cu-' + e.custom.kind : (isJobKind(e) ? 'job' : 'rv'), e.manual ? 'pin' : '', running ? 'run' : '', A.ui.sel === e.id ? 'sel' : ''].join(' ');
      e.pieces.forEach(([a, b], pi) => {
        const hpx = Math.max((b - a) * PPM - 2, 18);
        html += `<div class="tb ${cls} ${hpx < 42 ? 'sm' : ''}" data-id="${esc(e.id)}" data-pi="${pi}" data-s="${a}" data-d="${b - a}"
          style="top:${(a - lo) * PPM}px;height:${hpx}px;--c:${c};--cb:${h.rgba(c, 0.2)}" title="${esc(h.titleOf(S, e))}">
          <div class="tt">${esc(h.titleOf(S, e))}${e.pieces.length > 1 ? ` <small>(${pi + 1}/${e.pieces.length})</small>` : ''}</div>
          <div class="tm">${P.range12(a, b)} · ${b - a}분</div>
          ${e.kind === 'study' ? `<div class="tp">${esc(e.fixedRoutine ? h.fixedSub(S, e) : h.partsLabel(e, true))}</div>` : ''}
          ${editable ? `<span class="tools">${h.sessionKeys(S, e, D.date)}${e.manual ? `<button data-action="unpin" data-date="${D.date}" data-id="${esc(e.id)}">고정 해제</button>` : ''}<button class="del" data-action="delentry" data-date="${D.date}" data-id="${esc(e.id)}" title="${e.custom ? '이 일정 삭제' : '이 날 계획에서 빼기'}">${e.custom ? '삭제' : '빼기'}</button></span><i class="rz" title="아래쪽 끝을 끌어 길이 조절"></i>` : ''}</div>`;
      });
    }
    html += '</div>';
    html += `<div class="tlleg"><span><i class="lg rv"></i>공부</span><span><i class="lg job"></i>대회·과제</span><span><i class="lg ev"></i>내 일정</span></div>`;
    const lost = D.entries.filter(e => e.unplaced > 0);
    if (lost.length) html += `<div class="note warn" style="margin-top:8px">시간이 모자라 <b>${lost.map(e => esc(h.titleOf(S, e))).join(', ')}</b> 일부를 놓지 못했어요.</div>`;
    return html;
  };

  // 기존 할 일(안 끝낸 중요 할 일·과제) 목록 — 일정 추가 폼에서 골라 시간을 잡는다
  h.todoPicks = S => {
    const L = [];
    for (const it of S.important) if (!it.done && it.date) L.push({ ref: 'imp:' + it.id, title: it.title, tag: '중요', sub: h.md(it.date), key: it.date });
    for (const t of S.tasks) if (!t.done) L.push({ ref: 'task:' + t.id, title: t.title, tag: '과제', sub: t.due ? `마감 ${h.md(t.due)}` : '', key: t.due || '9' });
    return L.sort((a, b) => a.key.localeCompare(b.key));
  };
  // ‘해결 예정’ 표시: 그 할 일에 일정으로 잡아 둔 시간. due 보다 늦게 잡았으면 경고
  h.schedText = (S, ref, due) => {
    const L = P.scheduledFor(S, ref, P.today());
    if (!L.length) return '';
    const c = L[0], late = due && c.date > due;
    return `<span class="usch ${late ? 'late' : ''}">${late ? '⚠ 마감 뒤에 잡혀 있어요 · ' : ''}해결 예정 ${h.md(c.date)} ${P.t12(c.start)} · ${h.fmtMin(c.dur)}${L.length > 1 ? ` 외 ${L.length - 1}건` : ''}</span>`;
  };

  // 패널 위쪽 도구 줄: 일정 추가 / 되돌리기 / 추가 폼 / 이 날 뺀 항목
  h.addForm = (S, date) => {
    const f = A.ui.addForm;
    if (!f || f.date !== date) return '';
    const picks = h.todoPicks(S);
    const pickRow = picks.length ? `<div class="fl refpick"><span class="muted small">기존 할 일에서 고르기</span>${picks.map(c => `<button type="button" class="chip pick ${f.ref === c.ref ? 'on' : ''}" data-action="addref" data-ref="${esc(c.ref)}" title="${f.ref === c.ref ? '다시 누르면 선택 해제' : '이 할 일을 이 시간에 해결하기로 잡아요'}"><b>${c.tag}</b> ${esc(c.title)}${c.sub ? ` <small>${esc(c.sub)}</small>` : ''}${P.scheduledFor(S, c.ref, P.today()).length ? ' <small>· 예정 있음</small>' : ''}</button>`).join('')}</div>` : '';
    return `<div class="addform">
      ${pickRow}
      ${f.ref ? '<div class="hint refnote">고른 할 일을 아래 시간에 해결하기로 잡아요. 끝내면 그 할 일도 처리돼요.</div>' : ''}
      <div class="fl"><label class="wide">제목<input type="text" id="af-title" data-bind="ui.addForm.title" value="${esc(f.title)}" placeholder="예: 저녁 먹기, 수학 문제집, 동아리"></label></div>
      <div class="fl">${h.seg('ui.addForm.kind', f.kind, [['todo', '공부 할 일'], ['event', '일정 (공부 못 함)']])}</div>
      <div class="fl"><span class="tr">${h.tsel('ui.addForm.start', f.start, false)}<span>부터</span></span>${h.step('ui.addForm.dur', f.dur, { step: 10, min: 5, max: 600, unit: '분' })}</div>
      <div class="fl"><button class="btn primary" data-action="addcustom">추가</button><button class="btn ghost" data-action="addcancel">취소</button></div></div>`;
  };
  h.tlTools = (S, D) => {
    const date = D.date, man = P.manualOf(S, date), skipped = D.skipped || [];
    const hasManual = Object.keys(man).length > 0 || !!(S.layout && S.layout[date]);
    let html = `<div class="tltools"><button class="btn sm primary" data-action="addopen" data-date="${date}">＋ 일정 추가</button>${hasManual ? `<button class="btn sm ghost" data-action="resetday" data-date="${date}">자동 배치로 되돌리기</button>` : ''}</div>`;
    html += h.addForm(S, date);
    if (skipped.length) {
      html += `<div class="skipped"><span class="muted small">이 날 뺀 항목</span>${skipped.map(k => `<button class="chip" data-action="unpin" data-date="${date}" data-id="${esc(k)}" title="다시 넣기">${esc(h.titleByKey(S, k))} <b>↩</b></button>`).join('')}</div>`;
    }
    return html;
  };

  // ---------- 1자습·2자습 간단 이동 ----------
  // 그날 공부 시간대(자습 시간: 설정의 1자습, 2자습 …)가 둘 이상일 때, 항목 옆에 ‘1자습’ ‘2자습’ 키를 붙인다. 누르면 그 시간대의 가장 이른 빈 자리로 옮긴다.
  h.sessionKeys = (S, e, date) => {
    const base = P.baseBlocks(S, date);
    if (base.length < 2) return '';
    const cur = e.pieces && e.pieces.length ? e.pieces[0][0] : null;
    return `<span class="sess">${base.map(([a, b], i) => `<button type="button" class="sk ${cur != null && cur >= a && cur < b ? 'on' : ''}" data-action="tosess" data-date="${date}" data-id="${esc(e.id)}" data-i="${i}" title="${i + 1}자습 (${P.t12(a)}~${P.t12(b)})으로 이동">${i + 1}자습</button>`).join('')}</span>`;
  };
  A.moveToSession = function (date, id, idx) {
    const S = A.S, D = A.PLAN.days.find(x => x.date === date);
    const blk = P.baseBlocks(S, date)[idx], e = D && D.entries.find(x => x.id === id);
    if (!blk || !e) return;
    const a = D.t === 0 ? Math.max(blk[0], D.nowMin || 0) : blk[0];           // 오늘은 이미 지난 시간으로는 옮기지 않는다
    const taken = D.entries.filter(x => x.id !== id).flatMap(x => x.pieces);
    const start = P.firstFit(a, blk[1], taken, e.min);
    if (start == null) { A.toast(`${idx + 1}자습(${P.t12(blk[0])}~${P.t12(blk[1])})에는 빈 자리가 부족해요`, true); return; }
    A.freezeDay(date);                                                          // 다른 블록은 그대로 둔다
    if (e.custom) { e.custom.start = start; if (e.carried) e.custom.date = date; A.save(); A.render(); }
    else A.setManual(date, id, { start });
    A.toast(`${idx + 1}자습(${P.t12(blk[0])}~${P.t12(blk[1])})으로 옮겼어요 · ${P.t12(start)}`);
  };

  // ---------- 드래그 ----------
  let drag = null;

  function resolve(start, dur, others) {
    start = Math.max(0, Math.min(P.DAY_END - dur, start));
    for (let it = 0; it < 8; it++) {
      const hit = others.find(([a, b]) => start < b && start + dur > a);
      if (!hit) break;
      const after = hit[1], before = hit[0] - dur;
      start = (before < 0 || after - start <= start - before) ? after : before;
      start = Math.max(0, Math.min(P.DAY_END - dur, start));
    }
    return start;
  }

  function liveText(d) {
    const s = parseInt(d.tb.dataset.ls, 10), dur = parseInt(d.tb.dataset.ld, 10);
    return `${P.range12(s, s + dur)} · ${dur}분`;
  }

  function commit(d, newStart, newDur) {
    const D = A.PLAN.days.find(x => x.date === d.date);
    const e = D && D.entries.find(x => x.id === d.id);
    if (!e) { A.render(); return; }
    A.freezeDay(d.date);
    const others = D.entries.filter(x => x.pinned && x.id !== e.id && x.pieces.length).map(x => x.pieces[0]);
    if (e.custom) {                                  // 내 일정은 항목 자체를 고친다
      const c = e.custom;
      if (c.start == null && e.pieces.length) c.start = e.pieces[0][0];      // 자동 배치된 할당 일정은 끌면 그 시각으로 고정
      if (e.carried) c.date = d.date;                                         // 이월된 건 끌면 오늘 것으로 확정
      if (d.mode === 'move') c.start = resolve(newStart, c.dur, others);
      else {
        let dur = Math.max(5, newDur);
        const nxt = others.filter(([a]) => a >= c.start + 1).sort((p, q) => p[0] - q[0])[0];
        if (nxt) dur = Math.max(5, Math.min(dur, nxt[0] - c.start));
        c.dur = Math.min(dur, P.DAY_END - c.start);
      }
      A.save(); A.render();
      return;
    }
    if (d.mode === 'move') {
      const offset = e.pieces.slice(0, d.pi).reduce((a, p) => a + (p[1] - p[0]), 0);
      A.setManual(d.date, d.id, { start: resolve(newStart - offset, e.min, others) });
    } else {
      const total = Math.max(5, e.min - d.d + newDur);
      const start = e.pieces[0][0];
      let dur = total;
      const nxt = others.filter(([a]) => a >= start + 1).sort((p, q) => p[0] - q[0])[0];
      if (nxt) dur = Math.max(5, Math.min(dur, nxt[0] - start));
      A.setManual(d.date, d.id, { start, dur: dur + (e.spentExam || e.spent || 0) });
    }
  }

  function scrollRow(id) {
    const r = document.querySelector(`[data-row="${CSS.escape(id)}"]`);
    if (r) r.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  document.addEventListener('pointerdown', ev => {
    if (A.RO) return;                                                              // 보기 전용: 끌어 옮기기 없음
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    if (ev.target.closest('[data-action]')) return;
    const tb = ev.target.closest('.tb');
    if (!tb) return;
    const tl = tb.closest('.tl');
    drag = {
      tb, tl, id: tb.dataset.id, pi: +tb.dataset.pi, date: tl.dataset.date,
      s: +tb.dataset.s, d: +tb.dataset.d, y0: ev.clientY, moved: false,
      mode: ev.target.closest('.rz') ? 'resize' : 'move', editable: tl.classList.contains('edit')
    };
    tb.dataset.ls = drag.s; tb.dataset.ld = drag.d;
    try { tb.setPointerCapture(ev.pointerId); } catch (e) { /* noop */ }
    ev.preventDefault();
  });

  document.addEventListener('pointermove', ev => {
    if (!drag) return;
    const dy = ev.clientY - drag.y0;
    if (!drag.moved && Math.abs(dy) < 4) return;
    if (!drag.editable) return;
    if (!drag.moved) { drag.moved = true; A.ui.dragging = true; drag.tb.classList.add('drag'); }
    const dm = Math.round(dy / PPM / SNAP) * SNAP, t0 = +drag.tl.dataset.t0;
    if (drag.mode === 'move') {
      const s = Math.max(0, Math.min(P.DAY_END - drag.d, drag.s + dm));
      drag.tb.style.top = ((s - t0) * PPM) + 'px';
      drag.tb.dataset.ls = s; drag.tb.dataset.ld = drag.d;
    } else {
      const dur = Math.max(5, Math.min(P.DAY_END - drag.s, drag.d + dm));
      drag.tb.style.height = Math.max(dur * PPM - 2, 18) + 'px';
      drag.tb.dataset.ls = drag.s; drag.tb.dataset.ld = dur;
    }
    const tm = drag.tb.querySelector('.tm');
    if (tm) tm.textContent = liveText(drag);
  });

  function finishDrag(cancel) {
    if (!drag) return;
    const d = drag;
    drag = null;
    A.ui.dragging = false;
    d.tb.classList.remove('drag');
    if (cancel) { A.render(); return; }
    if (!d.moved) { A.ui.sel = d.id; A.ui.open = d.id; A.render(); scrollRow(d.id); return; }
    commit(d, parseInt(d.tb.dataset.ls, 10), parseInt(d.tb.dataset.ld, 10));
  }
  document.addEventListener('pointerup', () => finishDrag(false));
  document.addEventListener('pointercancel', () => finishDrag(true));

  // ---------- 일정 추가 / 삭제 ----------
  function openAdd(date, startMin) {
    const S = A.S;
    let m = startMin;
    if (m == null) {
      const b = P.blocksFor(S, date)[0], first = b ? b[0] : 18 * 60 + 30;
      m = date === P.today() ? Math.max(Math.ceil(P.nowMin() / 15) * 15, first) : first;
    }
    m = Math.max(0, Math.min(P.DAY_END - 15, Math.round(m / 15) * 15));
    A.ui.addForm = { date, title: '', kind: 'todo', start: P.hm(m), dur: 30, ref: '' };
    A.render();
    const t = document.getElementById('af-title');
    if (t) { t.focus(); t.scrollIntoView({ block: 'nearest' }); }
  }
  document.addEventListener('dblclick', ev => {
    const tl = ev.target.closest('.tl.edit');
    if (!tl || ev.target.closest('.tb') || ev.target.closest('[data-action]')) return;
    const y = ev.clientY - tl.getBoundingClientRect().top;
    openAdd(tl.dataset.date, +tl.dataset.t0 + y / PPM);
  });

  const Ac = A.actions;
  Ac.addopen = el => openAdd(el.dataset.date, null);
  Ac.addcancel = () => { A.ui.addForm = null; A.render(); };
  Ac.addref = el => {
    const f = A.ui.addForm, pick = f && h.todoPicks(A.S).find(c => c.ref === el.dataset.ref);
    if (!pick) return;
    const typed = h.val('af-title');
    if (f.ref === pick.ref) { f.ref = ''; f.title = typed || f.title; }
    else { f.ref = pick.ref; f.title = pick.title; f.kind = 'todo'; }
    A.render();
  };
  Ac.addcustom = () => {
    const f = A.ui.addForm, S = A.S;
    if (!f) return;
    const title = (h.val('af-title') || f.title || '').trim(), start = P.toMin(f.start);
    if (!title) { A.toast('제목을 입력하세요', true); return; }
    if (isNaN(start)) { A.toast('시작 시간을 고르세요', true); return; }
    const dur = Math.max(5, Math.min(+f.dur || 30, P.DAY_END - start));
    A.freezeDay(f.date);
    const c = { id: P.uid(), date: f.date, title, kind: f.kind || 'todo', start, dur, done: false };
    if (f.ref && h.todoPicks(S).some(x => x.ref === f.ref)) c.ref = f.ref;       // 기존 할 일에 묶는다 (해결 예정으로 표시됨)
    S.custom.push(c);
    A.ui.addForm = null;
    A.save(); A.render();
    A.toast(c.ref ? `해결 예정으로 잡았어요 · ${h.md(f.date)} ${P.t12(start)}` : `${f.kind === 'event' ? '일정' : '할 일'}을 추가했어요`);
  };
  Ac.delentry = el => {
    const id = el.dataset.id, date = el.dataset.date, S = A.S;
    A.freezeDay(date);
    if (id.startsWith('cu|')) {
      const i = S.custom.findIndex(c => c.id === id.slice(3));
      if (i >= 0) {
        const al = S.custom[i].alloc;
        S.custom.splice(i, 1); delete S.acc[id]; if (S.timer && S.timer.key === id) S.timer = null; A.save(); A.render();
        if (al) A.toast('배정을 풀었어요 · 할당의 대기로 돌아갔어요');
      }
    } else {
      // 과목 블록·복습을 ‘빼기’ = 그 안의 복습·예습은 안 하기: 내일 ‘밀린 복습’으로 이월되지 않게 안 함으로 표시한다.
      // (시험 대비·과제 몫은 계획이 알아서 다른 날로 나눈다.) ‘이 날 뺀 항목 ↩’로 되돌리면 같이 되살아난다.
      const D = A.PLAN.days.find(x => x.date === date), e = D && D.entries.find(x => x.id === id);
      const open = k => !(S.progress[k] && (S.progress[k].done || S.progress[k].skipped));
      const keys = (e && e.parts ? e.parts : []).filter(p => p.item && (p.item.kind === 'review' || p.item.kind === 'preview') && open(p.item.key)).map(p => p.item.key);
      for (const k of keys) S.progress[k] = { skipped: true, byBlock: true };
      A.setManual(date, id, { skip: true, skippedKeys: keys });
      A.toast(keys.length ? '뺐어요 · 복습·예습은 내일로 이월되지 않아요' : '이 날 계획에서 뺐어요', false, { fn: () => A.clearManual(date, id) });
    }
  };
  Ac.unpin = el => A.clearManual(el.dataset.date, el.dataset.id);
  Ac.tosess = el => A.moveToSession(el.dataset.date, el.dataset.id, +el.dataset.i);
  Ac.resetday = el => A.clearManual(el.dataset.date);
})();

</script>
<script>
/* v_today.js — 오늘 탭: 왼쪽 할 일 목록 / 오른쪽 시간대별 타임라인 */
(function () {
  'use strict';
  const A = window.App, P = window.Planner, h = A.h, esc = h.esc;
  const KIND = h.KIND;

  // 경고/안내. compact 면 급한 것(시간 부족)만 펼쳐 두고 나머지는 접어 둔다
  h.alerts = function (S, PLAN) {
    const urgent = [], info = [];
    for (const d of PLAN.deficits) {
      urgent.push(`<div class="note bad">⚠ <b>${esc(d.job.title)}</b> — 마감(${h.md(d.job.deadline)})까지 약 <b>${h.fmtMin(d.amount)}</b> 부족해요. 마감·범위를 조정하거나 가용 시간을 늘려야 해요.</div>`);
    }
    const unconf = S.exams.filter(e => !e.confirmed && e.date >= PLAN.today);
    if (unconf.length) info.push(`시험 날짜가 <b>미확정</b>인 과목이 ${unconf.length}개예요 (임시 날짜로 계산 중). 시험 시간표가 나오면 <button class="link" data-action="tab" data-tab="work">시험·과제</button>에서 날짜를 고치고 ‘확정’을 체크하세요.`);
    const nofix = S.fixed.filter(f => !(P.toMin(f.start) < P.toMin(f.end)));
    if (nofix.length) info.push(`고정 일정 시간이 비어 있어요: ${nofix.map(f => esc(f.title)).join(', ')} — <button class="link" data-action="tab" data-tab="settings">설정</button>에서 시간을 넣으면 그 시간이 공부 시간에서 빠져요.`);
    const kan = S.tasks.filter(t => !t.done && t.totalMin > 0).length;
    if (!kan && S.milestones.some(m => m.kind === 'deadline' && m.date >= PLAN.today)) info.push(`마감 일정(KSEF·포스터 등)에 작업 시간이 아직 없어요 — <button class="link" data-action="tab" data-tab="work">시험·과제</button>에서 ‘작업으로 추가’를 누르세요.`);
    return { urgent: urgent.join(''), info };
  };
  h.warnings = function (S, PLAN) {
    const a = h.alerts(S, PLAN);
    return a.urgent + a.info.map(t => `<div class="note warn">${t}</div>`).join('');
  };

  function checklist(S, key, items, editable) {
    return `<ul class="chk">${items.map((it, i) => {
      const on = !!S.checks[key + ':' + i];
      return `<li><label><input type="checkbox" data-action="chk" data-key="${esc(key)}" data-i="${i}" ${on ? 'checked' : ''} ${editable ? '' : 'disabled'}>${it.tag ? `<span class="tag">${esc(it.tag)}</span>` : ''}<span class="tx ${on ? 'done' : ''}">${esc(it.text)}${it.min != null ? ` <small class="muted">${it.min}분</small>` : ''}</span></label></li>`;
    }).join('')}</ul>`;
  }
  const bullets = (arr, open, label) => `<details ${open ? 'open' : ''}><summary>${label} (${arr.length})</summary><ul>${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul></details>`;

  function bodyOf(S, e) {
    if (e.kind === 'routine') { const r = e.item.routine; return r.amount ? `<div class="hint">목표: <b>${esc(r.amount)}</b></div>` : ''; }
    if (e.kind === 'review') {
      const note = e.item.note;
      if (!note) return `<div class="hint">저장된 노트가 없어요. <button class="link" data-action="tab" data-tab="notes">노트 탭</button>에서 다글로 파일과 프롬프트로 체크리스트를 만들 수 있어요. 없이도 복습 후 ✓ 를 누르면 돼요.</div>`;
      let out = '';
      if (note.summary && note.summary.length) out += bullets(note.summary, false, '요약');
      if (note.concepts && note.concepts.length) out += bullets(note.concepts, false, '핵심 개념');
      if (note.items && note.items.length) out += checklist(S, e.id, note.items, true);
      if (note.questions && note.questions.length) out += bullets(note.questions, true, '헷갈린 부분');
      return out;
    }
    if (e.kind === 'preview') {
      const src = e.item.src;
      if (!src) return `<div class="hint">노트에 다음 수업 범위가 없어요. 교재에서 다음 범위를 미리 훑어보세요.</div>`;
      return checklist(S, e.id, src.items, true) + `<div class="muted small">${h.md(src.date)} 수업 노트 기준</div>`;
    }
    const ref = e.job.ref;
    if (e.kind === 'final') return `<div class="hint">전 범위를 훑고, 헷갈린 부분과 틀린 문제를 다시 보세요.</div>`;
    if (e.kind === 'exam') {
      if (!ref.scope || !ref.scope.length) return `<div class="hint">범위(단원)를 입력하면 단원별 진도를 관리해요 → <button class="link" data-action="tab" data-tab="work">시험·과제</button>.</div>`;
      const next = ref.scope.map((c, i) => [c, i]).filter(([c]) => !c.done).slice(0, 3);
      return `<ul class="chk">${next.map(([c, i]) => `<li><label><input type="checkbox" data-action="chapter" data-ex="${esc(ref.id)}" data-i="${i}"><span class="tx">${esc(c.title)} <small class="muted">${c.min || S.settings.minDefaults.chapter}분</small></span></label></li>`).join('')}</ul>`;
    }
    if (ref.items && ref.items.length) {
      return `<ul class="chk">${ref.items.map((it, i) => `<li><label><input type="checkbox" data-action="taskitem" data-t="${esc(ref.id)}" data-i="${i}" ${it.done ? 'checked' : ''}><span class="tx ${it.done ? 'done' : ''}">${esc(it.text)}${it.min != null ? ` <small class="muted">${it.min}분</small>` : ''}</span></label></li>`).join('')}</ul>`;
    }
    return '';
  }

  function subOf(S, e, today) {
    if (e.kind === 'routine') return `${P.daysText(e.item.routine.days)} 루틴 · ${e.item.routine.min}분`;
    if (e.kind === 'review') {
      const it = e.item, per = it.periods.length ? ` ${it.periods.join('·')}교시` : '';
      const when = it.overdue ? `${h.md(it.date)} 수업${per} · ${it.overdue}일 밀림` : `오늘 수업${per}`;
      const inf = it.estInfo && it.estInfo.auto ? ` · 최근 ${it.estInfo.n}회 중앙값 ${Math.round(it.estInfo.median)}분 반영` : '';
      return `${when}${inf}`;
    }
    if (e.kind === 'preview') return `${h.md(e.item.date)} ${e.item.periods.join('·')}교시 수업 대비`;
    const j = e.job, ref = j.ref;
    const rest = `남은 ${h.fmtMin(j.rem)} · 오늘 몫 ${h.fmtMin(e.planned)}${e.spent ? ` (이미 ${e.spent}분)` : ''}`;
    if (e.kind === 'task') return `마감 ${h.md(j.deadline)} ${h.dday(j.deadline, today)} · ${rest}`;
    const when = e.kind === 'exam' ? `시험 ${h.md(ref.date)} ${h.dday(ref.date, today)}${ref.confirmed ? '' : ' (미확정)'}` : `시험 ${h.md(ref.date)} 직전`;
    return `${when} · ${rest}`;
  }

  function chooser(S, e) {
    const f = A.ui.finish;
    if (!f || f.key !== e.id) return '';
    let presets;
    if (f.mode === 'item') {
      presets = [0.5, 1, 1.5, 2].map(x => Math.max(5, P.round5(e.min * x)));
      presets = presets.filter((v, i) => presets.indexOf(v) === i);
    } else presets = [15, 30, 45, 60, 90];
    return `<div class="finish"><span class="muted small">${f.mode === 'item' ? '실제로 얼마나 걸렸나요?' : '얼마나 했나요?'}</span>
      ${presets.map(m => `<button class="btn sm" data-action="finishpick" data-key="${esc(e.id)}" data-min="${m}">${m}분</button>`).join('')}
      <input type="number" id="fin-min" min="1" max="600" placeholder="직접">
      <button class="btn sm ok" data-action="finishpick" data-key="${esc(e.id)}" data-min="custom">확인</button>
      <button class="btn sm ghost" data-action="finishcancel">닫기</button></div>`;
  }

  function timeEdit(S, e, date) {
    const s = e.pieces.length ? e.pieces[0][0] : 1110;
    return `<div class="te"><span class="muted small">시간 직접 설정</span>
      <label>시작 ${h.tsel('', P.hm(s), false, { id: 'tm-s' })}</label>
      <label>길이 <input type="number" id="tm-d" min="5" step="5" value="${e.min}" style="width:4.6rem">분</label>
      <button class="btn sm" data-action="applytime" data-id="${esc(e.id)}" data-date="${date}">적용</button>
      ${e.manual ? `<button class="btn sm ghost" data-action="unpin" data-id="${esc(e.id)}" data-date="${date}">자동 배치로</button>` : ''}</div>`;
  }

  function customRow(S, e, date) {
    const c = e.custom, color = h.colorOf(S, e), slot = e.pieces.length ? P.range12(e.pieces[0][0], e.pieces[0][1]) : (c.alloc ? '시간 못 정함' : '');
    const live = date === P.today(), running = live && S.timer && S.timer.key === e.id;
    const todo = c.kind === 'todo';
    return `<div class="ri ${running ? 'run' : ''} ${A.ui.sel === e.id ? 'sel' : ''}" data-row="${esc(e.id)}" style="--c:${color}"><div class="ri-h">
      ${todo && live ? `<button class="ck" data-action="finish" data-key="${esc(e.id)}" title="완료로 표시">✓</button>` : '<span class="ck-sp"></span>'}
      <span class="ri-main"><span class="ri-t"><i class="dot" style="background:${color}"></i>${esc(c.title)}<span class="pill">${c.alloc ? esc(h.kindLabel(e)) : (todo ? '할 일' : '일정')}</span></span><span class="ri-s">${slot} · ${h.fmtMin(e.min)}${e.carried ? ` · ${h.md(c.date)} 배정 · ${e.overdue}일 밀림` : ''}</span></span>
      ${h.sessionKeys(S, e, date)}
      ${todo && live ? (running ? `<button class="tbtn run" data-action="timerstop">⏸ <span data-timer="${esc(e.id)}"></span></button>` : `<button class="tbtn" data-action="timer" data-key="${esc(e.id)}" data-label="${esc(c.title)}">▶ <span data-timer="${esc(e.id)}"></span></button>`) : ''}
      <button class="x" data-action="delentry" data-date="${date}" data-id="${esc(e.id)}" title="삭제">×</button></div>${todo && live ? chooser(S, e) : ''}</div>`;
  }

  // 한 과목의 복습·예습·시험 대비를 하루에 블록 하나로 보여준다
  const PLBL = { review: '복습', preview: '예습', exam: '시험 대비', final: '직전 정리' };
  const lbl = p => (p.k === 'routine' ? p.item.routine.title : PLBL[p.k]);
  function partEntry(S, e, p) {
    return p.item ? { kind: p.k, id: p.item.key, sid: e.sid, item: p.item, min: p.min }
      : { kind: p.k, id: p.job.id, sid: e.sid, job: p.job, min: p.min, planned: p.w.min, spent: p.w.sp };
  }
  // 어제·그제 수업의 복습이 못 끝나 이월된 항목이면 줄에 바로 이유를 보여준다 (예: ‘11/9(월) 수업 복습 1일 밀림’)
  function carriedText(e) {
    const late = (e.parts || []).filter(p => p.item && p.item.overdue).map(p => p.item);
    if (!late.length) return '';
    return ' · <span class="late">' + late.map(it => `${h.md(it.date)} 수업 복습 ${it.overdue}일 밀림`).join(', ') + '</span>';
  }
  function studyRow(S, e, date, today, open) {
    const live = date === today, color = h.colorOf(S, e), running = live && S.timer && S.timer.key === e.id;
    const slot = e.pieces.length ? e.pieces.map(([a, b]) => P.range12(a, b)).join(' · ') : '시간 못 정함';
    const timerBtn = !live ? '' : running
      ? `<button class="tbtn run" data-action="timerstop" title="정지">⏸ <span data-timer="${esc(e.id)}"></span></button>`
      : `<button class="tbtn" data-action="timer" data-key="${esc(e.id)}" data-label="${esc(h.titleOf(S, e))}" title="타이머 시작">▶ <span data-timer="${esc(e.id)}"></span></button>`;
    let more = '';
    if (open) {
      const sections = e.parts.map(p => {
        const pe = partEntry(S, e, p);
        const skipBtn = p.item ? `<button class="btn sm ghost" data-action="skip" data-key="${esc(p.item.key)}" title="다시 띄우지 않아요">${p.k === 'routine' ? '오늘은 건너뛰기' : `이 ${PLBL[p.k]}은 안 할래요`}</button>` : '';
        return `<div class="part"><div class="part-h"><b>${esc(lbl(p))}</b> <small>${p.min}분</small>${skipBtn}</div><div class="sub">${esc(subOf(S, pe, today))}</div>${bodyOf(S, pe)}</div>`;
      }).join('');
      more = `<div class="ri-b">${live ? chooser(S, e) : ''}${sections}${e.extra ? `<div class="hint">자유 공부 ${e.extra}분이 더 잡혀 있어요 (직접 늘린 시간)</div>` : ''}${e.shrunk ? `<div class="hint">복습·예습 계획은 ${e.baseMin}분인데 ${e.min}분으로 줄여 잡았어요 (시험 대비 몫은 먼저 빠지고, 나머지가 비례해서 줄었어요). 되돌리려면 ‘자동 배치로’를 누르세요.</div>` : ''}${timeEdit(S, e, date)}
        <div class="acts">${live ? `<button class="btn" data-action="finishask" data-key="${esc(e.id)}">걸린 시간 입력해서 완료</button>` : ''}<button class="btn ghost" data-action="delentry" data-date="${date}" data-id="${esc(e.id)}" title="복습·예습은 안 하기로 처리돼 내일로 이월되지 않아요">${live ? '오늘' : '이 날'} 계획에서 빼기 (이월 안 됨)</button></div></div>`;
    }
    return `<div class="ri ${open ? 'open' : ''} ${A.ui.sel === e.id ? 'sel' : ''} ${running ? 'run' : ''}" data-row="${esc(e.id)}" style="--c:${color}">
      <div class="ri-h">${live ? `<button class="ck" data-action="finish" data-key="${esc(e.id)}" title="이 과목 공부를 마쳤어요">✓</button>` : '<span class="ck-sp"></span>'}
        <button class="ri-main" data-action="toggleRow" data-id="${esc(e.id)}">
          <span class="ri-t"><i class="dot" style="background:${color}"></i>${esc(h.titleOf(S, e))}<span class="pill">${e.fixedRoutine ? esc(e.parts[0].k === 'review' ? '복습' : ((P.subj(S, e.sid) || {}).name || '')) : esc(h.partsLabel(e))}</span>${e.manual ? '<span class="pill">고정</span>' : ''}</span>
          <span class="ri-s">${slot} · ${h.fmtMin(e.min)}${carriedText(e)}</span></button>${h.sessionKeys(S, e, date)}${timerBtn}</div>${more}</div>`;
  }

  function row(S, e, date, today, open) {
    if (e.custom) return customRow(S, e, date);
    if (e.kind === 'study') return studyRow(S, e, date, today, open);
    const live = date === today, color = h.colorOf(S, e), running = live && S.timer && S.timer.key === e.id;
    const slot = e.pieces.length ? e.pieces.map(([a, b]) => P.range12(a, b)).join(' · ') : '시간 못 정함';
    const isItem = e.kind === 'review' || e.kind === 'preview';
    const check = !live ? '<span class="ck-sp"></span>' : isItem
      ? `<button class="ck" data-action="finish" data-key="${esc(e.id)}" title="완료로 표시">✓</button>`
      : `<button class="ck" data-action="jobdone" data-key="${esc(e.id)}" data-min="${e.min}" title="오늘 몫 ${e.min}분을 했어요">✓</button>`;
    const timerBtn = !live ? '' : running
      ? `<button class="tbtn run" data-action="timerstop" title="정지">⏸ <span data-timer="${esc(e.id)}"></span></button>`
      : `<button class="tbtn" data-action="timer" data-key="${esc(e.id)}" data-label="${esc(h.titleOf(S, e))}" title="타이머 시작">▶ <span data-timer="${esc(e.id)}"></span></button>`;
    let more = '';
    if (open) {
      more = `<div class="ri-b">${live ? chooser(S, e) : ''}<div class="sub">${esc(subOf(S, e, today))}</div>${bodyOf(S, e)}${timeEdit(S, e, date)}
        <div class="acts">${isItem
    ? `<button class="btn ghost" data-action="skip" data-key="${esc(e.id)}" title="다시 나오지 않아요">안 할래요 (이월 안 됨)</button>`
    : `${live ? `<button class="btn" data-action="jobmore" data-key="${esc(e.id)}">시간 기록</button>` : ''}${e.kind === 'task' ? `<button class="btn ghost" data-action="taskfinish" data-t="${esc(e.id.split('|')[1])}">과제 끝!</button>` : ''}`}</div></div>`;
    }
    return `<div class="ri ${open ? 'open' : ''} ${A.ui.sel === e.id ? 'sel' : ''} ${running ? 'run' : ''}" data-row="${esc(e.id)}" style="--c:${color}">
      <div class="ri-h">${check}<button class="ri-main" data-action="toggleRow" data-id="${esc(e.id)}">
        <span class="ri-t"><i class="dot" style="background:${color}"></i>${esc(h.titleOf(S, e))}<span class="pill ${e.kind === 'task' ? 'warn' : ''}">${KIND[e.kind]}</span>${e.manual ? '<span class="pill">고정</span>' : ''}</span>
        <span class="ri-s">${slot} · ${h.fmtMin(e.min)}</span></button>${h.sessionKeys(S, e, date)}${timerBtn}</div>${more}</div>`;
  }

  function todayWork(S) {
    const today = P.today(), by = {};
    for (const w of S.work) if (w.date === today) { by[w.key] = by[w.key] || { key: w.key, min: 0 }; by[w.key].min += w.min; }
    return Object.values(by);
  }

  // ---------- 날짜 이동 (오늘 탭에서 다른 날도 같은 화면으로 보고 고친다) ----------
  const MAXBACK = 60;
  const mdw = d => { const dt = P.parse(d); return `${dt.getMonth() + 1}월 ${dt.getDate()}일`; };
  function dayNav(date, today) {
    const live = date === today;
    return `<div class="daynav"><button class="btn" data-action="daynav" data-d="-1" title="이전 날">◀</button>
      <input type="date" class="daypick" data-bind="ui.dayView" data-render="1" value="${date}" title="날짜 고르기">
      <button class="btn" data-action="daynav" data-d="1" title="다음 날">▶</button>${live ? '' : '<button class="btn primary" data-action="daytoday">오늘로</button>'}</div>`;
  }
  const relLabel = (idx) => (idx === 0 ? '<span class="pill ok">오늘</span>' : idx === 1 ? '<span class="pill">내일</span>' : idx === 2 ? '<span class="pill">모레</span>' : idx > 2 ? `<span class="pill">${idx}일 뒤</span>` : `<span class="pill">${-idx}일 전</span>`);

  // 지난 날: 한 일 기록만 보여준다
  function pastDay(S, PLAN, date) {
    const today = PLAN.today, idx = P.diffDays(today, date), dt = P.parse(date);
    const logs = S.log.filter(l => l.date === date), total = logs.reduce((a, l) => a + l.act, 0);
    const ms = S.milestones.filter(m => m.date <= date && date <= (m.end || m.date)), ov = S.dayOverrides[date];
    const left = `<header class="dayhead"><h1>${dt.getMonth() + 1}월 ${dt.getDate()}일 <span>${P.DOW[dt.getDay()]}요일</span> ${relLabel(idx)}</h1>
        <div>${ms.map(m => `<span class="pill warn">${esc(m.title)}</span>`).join(' ')}${ov && ov.off ? `<span class="pill">쉬는 날${ov.note ? ' · ' + esc(ov.note) : ''}</span>` : ''}</div></header>
      ${dayNav(date, today)}
      <div class="stats"><div><span>한 시간</span><b>${h.fmtMin(total)}</b></div><div><span>기록</span><b>${logs.length}개</b></div></div>
      <div class="card donelist"><h2>한 일</h2>${logs.length ? logs.map(l => `<div class="r"><span>✓ ${esc(h.logLabel(S, l))}</span><span class="muted small right">${l.act}분</span></div>`).join('') : '<div class="hint">기록이 없는 날이에요.</div>'}</div>`;
    const right = `<div class="panel"><div class="ph"><h2>${mdw(date)} 기록</h2></div><div class="hint">지난 날은 기록만 볼 수 있어요. 시간표를 고치려면 오늘이나 앞 날짜로 가세요.</div><div class="fl"><button class="btn primary" data-action="daytoday">오늘로</button></div></div>`;
    return `<div class="split"><div class="pane-l">${left}</div><aside class="pane-r">${right}</aside></div>`;
  }

  A.views.today = function (S, PLAN) {
    const today = PLAN.today, last = PLAN.days[PLAN.days.length - 1].date;
    let date = A.ui.dayView || today;
    if (date > last) date = last;
    if (date < P.addDays(today, -MAXBACK)) date = P.addDays(today, -MAXBACK);
    const idx = P.diffDays(today, date);
    if (idx < 0) return pastDay(S, PLAN, date);
    const live = idx === 0, D = PLAN.days[idx];
    const entries = D.entries;
    const planned = entries.filter(e => !(e.custom && e.custom.kind === 'event')).reduce((a, e) => a + e.min, 0);
    const works = live ? todayWork(S) : [];
    const doneMin = D.done.reduce((a, x) => a + (x.actual || 0), 0) + works.reduce((a, w) => a + w.min, 0);
    const pct = doneMin + planned ? Math.round(doneMin / (doneMin + planned) * 100) : 0;
    const dt = P.parse(date), ms = S.milestones.filter(m => m.date <= date && date <= (m.end || m.date));
    const ov = S.dayOverrides[date];
    const al = h.alerts(S, PLAN);
    const openId = A.ui.open && entries.some(e => e.id === A.ui.open) ? A.ui.open : (live && S.timer && entries.some(e => e.id === S.timer.key) ? S.timer.key : null);
    const who = live ? '오늘' : '이 날';

    const left = `
      <header class="dayhead"><h1>${dt.getMonth() + 1}월 ${dt.getDate()}일 <span>${P.DOW[dt.getDay()]}요일</span> ${relLabel(idx)}</h1>
        <div>${ms.map(m => `<span class="pill warn">${esc(m.title)}</span>`).join(' ')}${ov && ov.off ? `<span class="pill">쉬는 날${ov.note ? ' · ' + esc(ov.note) : ''}</span>` : ''}</div></header>
      ${dayNav(date, today)}
      <div class="stats">
        ${live ? `<div><span>남은 가용</span><b>${h.fmtMin(D.raw)}</b></div>
        <div><span>남은 계획</span><b>${h.fmtMin(planned)}</b></div>
        <div><span>오늘 한 시간</span><b>${h.fmtMin(doneMin)}</b></div>
        <div class="grow"><div class="prog"><i style="width:${pct}%"></i></div><span class="small muted">${pct}% 진행</span></div>`
    : `<div><span>가용</span><b>${h.fmtMin(D.raw)}</b></div><div><span>계획</span><b>${h.fmtMin(planned)}</b></div><div><span>여유</span><b>${h.fmtMin(Math.max(0, D.cap - planned))}</b></div>`}
      </div>
      ${(() => { const lost = entries.reduce((a, e) => a + (e.unplaced || 0), 0); return lost > 0 ? `<div class="note warn">${who} 할 일이 ${live ? '남은 ' : ''}가용 시간보다 <b>${h.fmtMin(lost)}</b> 많아요. 시간에 못 넣은 건 ‘시간 못 정함’으로 표시돼요. 안 할 건 줄을 열어 ‘안 할래요’로 빼거나 끌어서 옮기세요.</div>` : ''; })()}
      ${live ? `${al.urgent}${al.info.length ? `<details class="alerts"><summary>확인할 것 ${al.info.length}개</summary>${al.info.map(t => `<div class="note warn">${t}</div>`).join('')}</details>` : ''}` : ''}
      <div class="list">${entries.length ? entries.map(e => row(S, e, date, today, e.id === openId)).join('') : `<div class="empty">${D.raw === 0 ? `${who}은 ${live ? '남은 ' : ''}가용 시간이 없어요.` : `${who} 계획된 할 일이 없어요.`}</div>`}</div>
      ${D.dropped.length ? `<div class="card"><h2>${live ? '오늘은' : `${mdw(date)}에는`} 시간·상한 때문에 빠진 항목</h2><div class="hint">복습·예습 상한(${S.settings.reviewCapMin}분) 또는 남은 시간이 부족해요. ${S.settings.carryAll === false ? `밀린 복습은 ${S.settings.lookback}일까지 자동으로 다시 나타나요.` : `노트가 있는 복습은 끝낼 때까지, 노트 없는 복습은 ${S.settings.lookback}일까지 다시 나타나요. 안 할 것은 ‘빼기’로 지워요.`}</div>${D.dropped.map(it => `<div class="ms"><span class="dot" style="background:${h.colorOf(S, it)}"></span>${esc(h.titleOf(S, it))} <span class="muted small">${h.fmtMin(it.est)}${it.overdue ? ` · ${h.md(it.date)} 수업 · ${it.overdue}일 밀림` : ''}</span><button class="btn sm ghost right" data-action="dropskip" data-key="${esc(it.key)}" title="이 항목은 다시 띄우지 않아요">빼기</button></div>`).join('')}</div>` : ''}
      ${live && (D.done.length || works.length || (D.customDone || []).length) ? `<div class="card donelist"><h2>오늘 한 것</h2>
        ${(D.customDone || []).map(c => `<div class="r"><span class="dot" style="background:#0ea5e9"></span><span>✓ ${esc(c.title)}</span><span class="muted small">${c.actual || c.dur}분</span><button class="btn sm ghost right" data-action="undo" data-key="cu|${esc(c.id)}">되돌리기</button></div>`).join('')}
        ${D.done.map(it => `<div class="r"><span class="dot" style="background:${h.colorOf(S, it)}"></span><span>✓ ${esc(h.titleOf(S, it))}</span><span class="muted small">${it.actual}분 (예상 ${it.est}분)</span><button class="btn sm ghost right" data-action="undo" data-key="${esc(it.key)}">되돌리기</button></div>`).join('')}
        ${works.map(w => `<div class="r"><span class="dot" style="background:#6366f1"></span><span>${esc(h.jobTitleByKey(S, w.key))}</span><span class="muted small">+${w.min}분</span><button class="btn sm ghost right" data-action="undowork" data-key="${esc(w.key)}">마지막 기록 취소</button></div>`).join('')}</div>` : ''}`;

    const right = `<div class="panel"><div class="ph"><h2>${live ? '오늘' : mdw(date)} 시간표</h2></div>${h.tlTools(S, D)}
      <div class="hint">끌어서 옮기고, 아래 끝을 끌어 길이를 바꿔요 · 빈 곳을 더블클릭하면 일정 추가${live ? '' : ' · 완료 체크와 타이머는 그날이 되면 쓸 수 있어요'}</div>
      <div class="tlwrap">${h.timeline(S, D, { editable: true })}</div></div>`;

    return `<div class="split"><div class="pane-l">${left}</div><aside class="pane-r">${right}</aside></div>`;
  };

  // ---------- 액션 ----------
  const Ac = A.actions;
  A.onShow.today = () => { if (A.ui.dayJump) A.ui.dayJump = false; else A.ui.dayView = null; };   // 오늘 탭을 누르면 항상 오늘부터 (계획 탭의 ‘이 날 열기’만 예외)
  const clampDay = d => { const t = P.today(), last = A.PLAN.days[A.PLAN.days.length - 1].date; return d > last ? last : d < P.addDays(t, -MAXBACK) ? P.addDays(t, -MAXBACK) : d; };
  Ac.daynav = el => { const cur = A.ui.dayView || P.today(), d = clampDay(P.addDays(cur, +el.dataset.d)); A.ui.dayView = d === P.today() ? null : d; A.render(); };
  Ac.daytoday = () => { A.ui.dayView = null; A.render(); };
  Ac.openday = el => { A.ui.dayView = el.dataset.date === P.today() ? null : el.dataset.date; A.ui.dayJump = true; A.setTab('today'); };
  Ac.toggleRow = el => { A.ui.open = A.ui.open === el.dataset.id ? '' : el.dataset.id; A.ui.sel = el.dataset.id; A.render(); };
  Ac.timer = el => A.timerStart(el.dataset.key, el.dataset.label);

  Ac.chk = el => {
    A.S.checks[el.dataset.key + ':' + el.dataset.i] = el.checked;
    const tx = el.closest('label').querySelector('.tx');
    if (tx) tx.classList.toggle('done', el.checked);
    A.save();
  };
  Ac.taskitem = el => {
    const t = A.S.tasks.find(x => x.id === el.dataset.t);
    if (t && t.items[+el.dataset.i]) t.items[+el.dataset.i].done = el.checked;
    const tx = el.closest('label').querySelector('.tx');
    if (tx) tx.classList.toggle('done', el.checked);
    A.save();
  };
  Ac.chapter = el => A.toggleChapter(el.dataset.ex, +el.dataset.i, el.checked);

  // ✓ 한 번으로 바로 완료: 타이머로 잰 시간이 있으면 그 시간, 없으면 계획한 시간으로 기록한다. 실제 시간이 다르면 줄을 열어 ‘걸린 시간 입력해서 완료’
  Ac.finish = el => {
    const S = A.S, key = el.dataset.key;
    let acc = (S.acc[key] || 0);
    if (S.timer && S.timer.key === key) acc += (Date.now() - S.timer.startedAt) / 60000;
    const e = A.PLAN.days[0].entries.find(x => x.id === key);
    const m = acc >= 0.5 ? acc : (e ? e.min : 0);
    if (!(m >= 1)) { A.ui.finish = { key, mode: 'item' }; A.ui.open = key; A.render(); return; }      // 계획 시간이 없으면 물어본다
    const parts = e && e.parts ? e.parts.map(p => (p.item ? { item: p.item.key } : { job: p.job.id })) : null;
    const title = e ? h.titleOf(S, e) : '';
    A.finishItem(key, m);
    A.toast(`완료 · ${title} ${Math.round(m)}분`, false, { fn: () => {
      if (parts) for (const p of parts) { if (p.item) A.undoItem(p.item); else A.undoWork(p.job); }
      else A.undoItem(key);
    } });
  };
  // 줄을 열어 ‘걸린 시간 입력해서 완료’: 실제 걸린 시간을 직접 고른다
  Ac.finishask = el => { A.ui.finish = { key: el.dataset.key, mode: 'item' }; A.ui.open = el.dataset.key; A.render(); const f = document.querySelector('.finish'); if (f) f.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); };
  Ac.jobmore = el => { A.ui.finish = { key: el.dataset.key, mode: 'job' }; A.render(); };
  Ac.finishcancel = () => { A.ui.finish = null; A.render(); };
  Ac.finishpick = el => {
    const key = el.dataset.key;
    const m = el.dataset.min === 'custom' ? parseInt(h.val('fin-min'), 10) : parseInt(el.dataset.min, 10);
    if (!(m >= 1 && m <= 600)) { A.toast('1~600분 사이로 입력하세요', true); return; }
    const f = A.ui.finish;
    A.ui.finish = null;
    if (A.isJob(key)) A.addWork(key, m, 'tap'); else A.finishItem(key, m);
    if (f && f.mode === 'job') A.toast(`${m}분 기록했어요`);
  };
  Ac.jobdone = el => { A.addWork(el.dataset.key, parseInt(el.dataset.min, 10), 'tap'); A.toast(`${el.dataset.min}분 기록했어요`); };
  Ac.skip = el => { A.S.progress[el.dataset.key] = { skipped: true }; A.save(); A.render(); };
  Ac.dropskip = el => {
    const key = el.dataset.key, S = A.S, it = A.PLAN.days.flatMap(d => d.dropped).find(x => x.key === key);
    S.progress[key] = { skipped: true };
    A.save(); A.render();
    A.toast(`뺐어요 · ${it ? h.titleOf(S, it) : '항목'}`, false, { fn: () => { delete S.progress[key]; A.save(); A.render(); } });
  };
  Ac.undo = el => A.undoItem(el.dataset.key);
  Ac.undowork = el => A.undoWork(el.dataset.key);
  Ac.taskfinish = el => {
    const t = A.S.tasks.find(x => x.id === el.dataset.t);
    if (!t || !window.confirm(`‘${t.title}’을(를) 끝난 과제로 표시할까요?`)) return;
    t.done = true; A.save(); A.render();
  };

  // 숫자로 직접 시간 설정
  Ac.applytime = el => {
    const m = /^(\d{1,2}):(\d{2})$/.exec(h.val('tm-s').trim());
    const dur = parseInt(h.val('tm-d'), 10);
    if (!m || +m[1] > 25 || +m[2] > 59) { A.toast('시작 시간은 HH:MM 형식으로 (예: 19:30)', true); return; }
    if (!(dur >= 5 && dur <= 480)) { A.toast('길이는 5~480분 사이로 입력하세요', true); return; }
    const D = A.PLAN.days.find(x => x.date === el.dataset.date);
    const e = D && D.entries.find(x => x.id === el.dataset.id);
    const start = Math.min(+m[1] * 60 + +m[2], P.DAY_END - dur);
    A.freezeDay(el.dataset.date);
    A.setManual(el.dataset.date, el.dataset.id, { start, dur: dur + ((e && (e.spentExam || e.spent)) || 0) });
  };
})();

</script>
<script>
/* v_calendar.js — 계획 탭: 월간 캘린더(날짜별 할 일을 크게, 끌어서 다른 날로 옮기기) + 선택한 날의 시간표 */
(function () {
  'use strict';
  const A = window.App, P = window.Planner, h = A.h, esc = h.esc, pad = P.pad;

  function cellsOf(ym) {
    const [y, m] = ym.split('-').map(Number);
    const first = `${y}-${pad(m)}-01`;
    const start = P.addDays(first, -P.dow(first));
    const last = P.fmt(new Date(y, m, 0, 12));
    const end = P.addDays(last, 6 - P.dow(last));
    return Array.from({ length: P.diffDays(start, end) + 1 }, (_, i) => P.addDays(start, i));
  }
  const shiftMonth = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1, 12); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };

  // 하루 요약: 일정(라벨) + 계획 한 줄들 + 합계. drag 가 있는 항목은 다른 날짜 칸으로 끌어 옮길 수 있다.
  function dayInfo(S, PLAN, d) {
    const idx = P.diffDays(PLAN.today, d);
    const info = { events: [], jobs: [], total: 0, parts: { rev: 0, task: 0 }, past: 0 };
    for (const it of S.important) if (it.date === d) info.events.push({ t: '★ ' + it.title, k: it.done ? 'imp done' : 'imp' });   // 중요 할 일은 칸에서 잘리지 않게 맨 앞에
    for (const m of S.milestones) if (m.date <= d && d <= (m.end || m.date)) info.events.push({ t: m.title, k: m.kind || 'etc' });
    for (const e of S.exams) if (e.date === d) {
      const sb = P.subj(S, e.sid);
      info.events.push({ t: `${sb ? sb.short || sb.name : ''} 시험`, k: 'subj', c: sb && sb.color, unconf: !e.confirmed, drag: `exam|${d}|${e.id}` });
    }
    for (const t of S.tasks) if (!t.done && t.due === d) info.events.push({ t: `마감 · ${t.title}`, k: 'deadline' });
    if (idx >= 0 && idx < PLAN.days.length) {
      const D = PLAN.days[idx];
      for (const e of D.entries) {
        if (e.custom && e.custom.kind === 'event') { info.events.push({ t: e.custom.title, k: 'etc', drag: `cu|${d}|${e.id}` }); continue; }   // 내 일정은 공부 총량에 넣지 않는다
        info.total += e.min;
        const sb = P.subj(S, e.sid), c = h.colorOf(S, e);
        if (e.custom) { info.jobs.push({ t: e.custom.title, m: e.min, c, drag: `cu|${d}|${e.id}`, al: !!e.custom.alloc }); info.parts.rev += e.min; continue; }
        if (e.kind === 'task') { info.jobs.push({ t: e.job.title, m: e.min, c, drag: `job|${d}|${e.id}` }); info.parts.task += e.min; continue; }
        // 과목 블록: 시험 대비 몫이 있으면 그 몫을 다른 날로 옮길 수 있다 (복습·예습은 수업 날짜에 묶여 있으므로 그대로)
        info.jobs.push({ t: e.fixedRoutine ? h.fixedTitle(S, e) : (sb ? sb.short || sb.name : ''), m: e.min, c, sub: h.partsLabel(e), drag: e.parts.some(p => p.job) ? `job|${d}|${e.id}` : '' });
        info.parts.rev += e.min;
      }
      info.jobs.sort((a, b) => (b.al ? 2 : b.drag ? 1 : 0) - (a.al ? 2 : a.drag ? 1 : 0));   // 옮길 수 있는 줄(시험 대비·과제)이 칸에서 잘리지 않게 앞에 둔다
    } else if (idx < 0) {
      info.past = S.log.filter(l => l.date === d).reduce((a, l) => a + l.act, 0);
    }
    return info;
  }

  const dragAttr = v => (v ? `draggable="true" data-drag="${esc(v)}"` : '');

  function cell(S, PLAN, d, ym, sel) {
    const inf = dayInfo(S, PLAN, d), w = P.dow(d), today = PLAN.today;
    const total = inf.total || inf.past;
    const seg = (m, k) => (m ? `<i class="${k}" style="width:${Math.min(100, m / 300 * 100)}%"></i>` : '');
    return `<div class="cell ${d.slice(0, 7) !== ym ? 'out' : ''} ${d === today ? 'today' : ''} ${d === sel ? 'sel' : ''} ${w === 0 ? 'sun' : w === 6 ? 'sat' : ''} ${d < today ? 'past' : ''}" role="button" tabindex="0" data-action="calsel" data-date="${d}">
      <span class="dn">${+d.slice(8)}</span>
      <span class="evs">${inf.events.slice(0, 3).map(ev => `<span class="ev ${ev.k}" ${ev.c ? `style="--c:${ev.c}"` : ''} ${dragAttr(ev.drag)}>${esc(ev.t)}${ev.unconf ? '?' : ''}</span>`).join('')}${inf.events.length > 3 ? `<span class="more">+${inf.events.length - 3}</span>` : ''}</span>
      <span class="lns">${inf.jobs.slice(0, 3).map(l => `<span class="ln" ${dragAttr(l.drag)} title="${esc(l.t)}${l.sub ? ' · ' + esc(l.sub) : ''}"><i style="background:${l.c}"></i><em>${esc(l.t)}</em><b>${l.m}분</b></span>`).join('')}${inf.jobs.length > 3 ? `<span class="more">+${inf.jobs.length - 3}개 더</span>` : ''}</span>
      <span class="ft">${total ? `<b>${h.fmtMin(total)}</b>${inf.past ? ' ✓' : ''}` : ''}<span class="mini">${seg(inf.parts.rev, 'k-rev')}${seg(inf.parts.task, 'k-task')}</span></span>
    </div>`;
  }

  function logLabel(S, l) {
    const sb = P.subj(S, l.sid), n = sb ? sb.name : '';
    if (l.kind === 'review') return `${n} 복습`;
    if (l.kind === 'preview') return `${n} 예습`;
    if (l.kind === 'routine') return h.titleByKey(S, l.key);
    if (l.kind === 'custom') return l.key ? h.titleByKey(S, l.key) : '할 일';
    return h.jobTitleByKey(S, l.key);
  }

  h.logLabel = logLabel;

  function detail(S, PLAN, sel) {
    const today = PLAN.today, idx = P.diffDays(today, sel), dt = P.parse(sel);
    const head = `<div class="ph"><h2>${dt.getMonth() + 1}월 ${dt.getDate()}일 ${P.DOW[dt.getDay()]}요일${sel === today ? ' <span class="pill ok">오늘</span>' : ''}</h2><button class="btn sm" data-action="openday" data-date="${sel}" title="오늘 탭의 큰 화면으로 열어요">이 날 열기 ›</button></div>`;
    const inf = dayInfo(S, PLAN, sel);
    const evs = inf.events.length ? `<div class="evl">${inf.events.map(ev => `<span class="ev ${ev.k}" ${ev.c ? `style="--c:${ev.c}"` : ''}>${esc(ev.t)}${ev.unconf ? ' (미확정)' : ''}</span>`).join('')}</div>` : '';
    const ov = S.dayOverrides[sel];
    const off = ov && ov.off ? `<div class="note info">쉬는 날${ov.note ? ' · ' + esc(ov.note) : ''} — 공부 시간이 없는 날이에요.</div>` : '';

    if (idx < 0) {
      const logs = S.log.filter(l => l.date === sel);
      return `<div class="panel" id="daydetail">${head}${evs}${off}${h.impBox(S, sel)}${logs.length ? `<h3>한 일 (${h.fmtMin(inf.past)})</h3>${logs.map(l => `<div class="ms"><span>${esc(logLabel(S, l))}</span><span class="muted small right">${l.act}분</span></div>`).join('')}` : '<div class="hint">기록이 없는 날이에요.</div>'}</div>`;
    }
    if (idx >= PLAN.days.length) return `<div class="panel" id="daydetail">${head}${evs}${h.impBox(S, sel)}<div class="hint">이 날까지 배정된 시험·과제가 없어요. 마감이 이 날 이후인 대회·과제를 추가하면 계획이 여기까지 이어져요.</div></div>`;
    const D = PLAN.days[idx];
    const planned = D.entries.filter(e => !(e.custom && e.custom.kind === 'event')).reduce((a, e) => a + e.min, 0);
    return `<div class="panel" id="daydetail">${head}${evs}${off}${h.impBox(S, sel)}
      <div class="stats"><div><span>가용</span><b>${h.fmtMin(D.raw)}</b></div><div><span>계획</span><b>${h.fmtMin(planned)}</b></div><div><span>여유</span><b>${h.fmtMin(Math.max(0, D.cap - planned))}</b></div></div>${h.tlTools(S, D)}
